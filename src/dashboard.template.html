/* ---------- waiver wire ----------
   Four sheets, one at a time, the way a waiver cheat sheet is actually read:
   overview, projections, the points already scored, and the schedule.
   Each position is its own table of the best players still available here.
   Overview ranks by the agreed number (same as Players); FantasyPros' own
   rank is the ECR column. */

let waiverBy  = store.get('gd.waiverBy','ros')==='wk'? 'wk' : 'ros';
let waiverN   = Math.max(5, Math.min(40, Number(store.get('gd.waiverN','12'))||12));
let waiverPos = new Set(String(store.get('gd.waiverPos','')).split(',').filter(Boolean));
let waiverSheet = ['overview','projections','statistics','schedule'].includes(store.get('gd.waiverSheet',''))? store.get('gd.waiverSheet') : 'overview';
let waiverShowMine = store.get('gd.waiverMine','')==='1';

const POS_TITLE={QB:'Quarterbacks', RB:'Running backs', WR:'Wide receivers', TE:'Tight ends', K:'Kickers', DST:'Defenses'};
const WAIVER_SHEETS=[['overview','Overview'],['projections','Projections'],['statistics','Statistics'],['schedule','Schedule']];

/** One position at a time, like a cheat-sheet tab. An old multi-select collapses to all. */
function waiverPosition(){ return waiverPos.size===1? [...waiverPos][0] : ''; }
function setWaiverPosition(pos){
  waiverPos = pos? new Set([pos]) : new Set();
  store.set('gd.waiverPos', [...waiverPos].join(','));
  render();
}
/** Agreed number for the sheet's period: ranks the available list. */
function sheetPeriod(p){
  const h=waiverBy==='wk'? parseHz('w-'+DATA.week) : parseHz('ros');
  const a=metric(p,'agreed',h);
  return {pts:a&&a.v, rk:a&&a.pr, h};
}
function ecrText(rk){
  if(rk==null || rk==='') return '\u2014';
  const s=String(rk);
  const m=s.match(/^[A-Za-z]+(\d+)$/);
  return m? m[1] : s;
}
function sheetNote(p){
  const bits=[];
  if(p.inj && p.inj!=='ACTIVE' && p.inj!=='None') bits.push([p.inj, p.injT].filter(Boolean).join(' '));
  if(p.blurb) bits.push(p.blurb);
  else if(p.nw) bits.push(p.nw);
  return bits.join(' \u00b7 ');
}
function noteCell(p){
  const td=el('td','noteclip');
  const text=sheetNote(p);
  const s=el('span','sheetnote', text || '\u2014');
  if(text) td.title=text;
  td.append(s);
  return td;
}
function numCell(v, digits, sep){ return cell('num', v, {d:digits===0? 0 : 1, sep}); }

/**
 * Available players at one position, best first for the chosen period.
 * Yours are mixed in only when the sheet asks for them, and stay marked.
 */
function waiverRows(pool, pos, mineIds){
  const rows=pool.filter(p=>p.p===pos).map(p=>{
    const per=sheetPeriod(p);
    return {p, pts:per.pts, rk:per.rk, ord:consOrder(p, per.h), mine:mineIds.has(p.i), free:!ROSTER.has(p.i)};
  });
  // Rest of season orders by League Value and rank, not points (consOrder).
  const byPts=(a,b)=> b.ord-a.ord || (a.p.i<b.p.i?-1:1);
  const free=rows.filter(r=>r.free && r.pts!=null).sort(byPts).slice(0, waiverN);
  if(!waiverShowMine) return free;
  const mine=rows.filter(r=>r.mine);
  return mine.concat(free).sort(byPts);
}

/**
 * The columns of the current waiver sheet, each with its own cell — rows are
 * `waiverRows` entries ({p, pts, rk, mine}). Sorting is by each column's own
 * number, so a sheet re-orders by floor, ceiling or a week's points in place.
 */
function waiverSheetCols(){
  const wk=waiverBy==='wk';
  const player={key:'name', label:'Player', w:330, band:'', dir:'asc', sort:r=>r.p.n||'', cell:r=> cell('player', r.p)};
  const roster={label:'Owner', w:56, band:'', ctr:1, cell:r=> rosterBadgeCell(r.p)};
  const n=(key,label,get,d,o={})=> Object.assign({key, label, r:1, w:58, sort:get, cell:r=> cell('num', get(r), {d, sep:o.sep})}, o);
  if(waiverSheet==='projections'){
    const band=wk? 'Week '+DATA.week : 'Rest of season · '+rosSpan();
    const ds=r=> r.p.ds||{};
    return [player, roster,
      n('fp','FP', r=>{ const m=metric(r.p,'fp', sheetPeriod(r.p).h); return m? m.v : null; }, wk? 1 : 0, {sep:1, band, title:'FantasyPros’ own projection'}),
      ...(wk? [n('wkx','Rank pts', r=>r.p.wkX, 1, {w:64, band, title:'Points implied by the expert rankings'})] : []),
      n('ds','DS', r=>{ const m=metric(r.p,'ds', sheetPeriod(r.p).h); return m? m.v : null; }, wk? 1 : 0, {band, title:'Draft Sharks'}),
      n('floor','Floor', r=> wk? ds(r).floor : ds(r).rosFloor, 1, {band}),
      n('ceil','Ceiling', r=> wk? ds(r).ceiling : ds(r).rosCeiling, 1, {w:64, band}),
      {key:'own', label:'FP %', r:1, w:56, sep:1, band, title:'Rostered across FantasyPros leagues', sort:r=>r.p.own, cell:r=> cell('num', null, {text:fxPct(r.p.own), sep:1})},
    ];
  }
  if(waiverSheet==='statistics'){
    const weeks=[];
    for(let w=1; w<=(Number(DATA.week)||1); w++) weeks.push(w);
    const total=r=>{ let sum=0, k=0; weeks.forEach(w=>{ const v=weekActual(r.p,w); if(v!=null){ sum+=v; k++; } }); return k? Math.round(sum*100)/100 : null; };
    return [player, roster,
      ...weeks.map((w,i)=> n('w'+w, 'Wk '+w, r=> weekActual(r.p,w), 1, {w:52, sep:i===0?1:0, band:'Points scored', title:'Fantasy points in week '+w})),
      n('total','Total', total, 1, {sep:1, band:'Points scored', title:'Sum of the weeks stored'}),
    ];
  }
  if(waiverSheet==='schedule'){
    const from=Number(DATA.week)||1;
    const weeks=[];
    for(let w=from; w<=Math.min(18, from+7); w++) weeks.push(w);
    return [player, roster,
      n('bye','Bye', r=> r.p.bye ?? (r.p.sch && r.p.sch.bye), 0, {w:48, sep:1}),
      ...weeks.map((w,i)=>({label:'Wk '+w, w:64, sep:i===0?1:0, band:'Upcoming', cell:r=> cell('text', null, {cls:'num'+(i===0?' tsep':''), text:oppLabel(r.p, w)})})),
    ];
  }
  return [
    {key:'ecr', label:'ECR', r:1, w:56, dir:'asc', title:'FantasyPros expert consensus rank', sort:r=> waiverBy==='wk'? r.p.rk : r.p.rosRk, cell:r=> cell('num', null, {text:ecrText(waiverBy==='wk'? r.p.pr : r.p.rosPr)})},
    player, roster,
    {label:'Opp', w:72, r:1, cell:r=> cell('text', null, {cls:'r num opp', text:oppLabel(r.p, DATA.week)})},
    Object.assign(n('pts', 'Pts', r=>r.pts, wk? 1 : 0, {title:'Agreed points: FantasyPros and Draft Sharks, one vote per site'}), {cell:r=>{
      const td=cell('num', r.pts, {d:wk? 1 : 0}); td.title=consTip(r.p, sheetPeriod(r.p).h); return td;
    }}),
    {label:'News', w:340, cell:r=> noteCell(r.p)},
  ];
}

function pageWaivers(){
  const l=L(), out=[];
  const head=el('div','head');
  head.append(el('h1',null,'Waiver Wire'));
  head.append(el('p',null, leagueLabel(l)+' \u00b7 the best players still available, one sheet at a time. Yours stay off the sheet until you ask for them.'));
  out.push(head);

  const pool=DATA.pools[scoringKey(l)]||[];
  if(!pool.length){ out.push(panel('Waiver Wire', null, emptyState('No player pool','Run `npm run fp:sync`, then rebuild the dashboard.'))); return out; }
  leagueContext(l);
  const mineIds=new Set(); myTeams(l).forEach(t=> t.players.forEach(p=> mineIds.add(p.i)));
  const positions=['QB','RB','WR','TE','K','DST'].filter(x=> pool.some(p=>p.p===x));

  const tabs=el('div','pgtabs'); tabs.setAttribute('role','tablist'); tabs.setAttribute('aria-label','Waiver sheets');
  WAIVER_SHEETS.forEach(([k,label])=>{
    const b=el('button',null,label); b.type='button'; b.setAttribute('role','tab');
    b.setAttribute('aria-selected', String(k===waiverSheet));
    b.onclick=()=>{ waiverSheet=k; store.set('gd.waiverSheet', k); render(); };
    tabs.append(b);
  });
  out.push(tabs);

  const posTabs=el('div','pgtabs'); posTabs.setAttribute('role','tablist'); posTabs.setAttribute('aria-label','Position');
  [['', 'All positions']].concat(positions.map(p=>[p, p])).forEach(([k,label])=>{
    const b=el('button',null,label); b.type='button'; b.setAttribute('role','tab');
    b.setAttribute('aria-selected', String(k===waiverPosition()));
    b.onclick=()=>setWaiverPosition(k);
    posTabs.append(b);
  });
  out.push(posTabs);

  const fp=el('div','panel'), body=el('div','pfilter'), line=el('div','prowbar');
  if(waiverSheet==='overview' || waiverSheet==='projections'){
    line.append(segmented([{label:'This week',value:'wk'},{label:'Rest of season',value:'ros'}], waiverBy,
      v=>{ waiverBy=v; store.set('gd.waiverBy', v); render(); }));
  }
  line.append(el('span','lbl','Show'));
  const nSel=el('select','hz');
  [8,12,20,30].forEach(n=>{ const o=document.createElement('option'); o.value=String(n); o.textContent='Top '+n; nSel.append(o); });
  nSel.value=String(waiverN);
  nSel.onchange=()=>{ waiverN=Number(nSel.value); store.set('gd.waiverN', String(waiverN)); render(); };
  line.append(nSel);
  const mineBtn=el('button','iconbtn'+(waiverShowMine?' watchon':''), 'Show my players');
  mineBtn.type='button';
  mineBtn.setAttribute('aria-pressed', String(waiverShowMine));
  mineBtn.onclick=()=>{ waiverShowMine=!waiverShowMine; store.set('gd.waiverMine', waiverShowMine?'1':''); render(); };
  line.append(mineBtn);
  body.append(line);
  fp.append(body);
  out.push(fp);

  if(!mineIds.size){
    out.push(panel('Your roster', null, emptyState('No roster yet','Claim a team in League Setup, or wait for the host to sync rosters.')));
    return out;
  }

  const shown=positions.filter(x=> !waiverPosition() || x===waiverPosition());
  const spec=waiverSheetCols();
  let any=false;
  shown.forEach(pos=>{
    const rows=waiverRows(pool, pos, mineIds);
    if(!rows.length) return;
    any=true;
    const title=POS_TITLE[pos] || pos;
    out.push(panel(title, rows.length+' \u00b7 '+(waiverShowMine? 'yours included' : 'available'),
      smallTable({id:'waivers|'+waiverSheet+'|'+waiverBy, cols:spec, rows, lean:true, nopos:true, rowClass:r=> ownerRowClass(r.p)})));
  });
  if(!any) out.push(panel('Waiver Wire', null, emptyState('Nobody available','No player at this position has a FantasyPros projection.')));

  const lg=el('div','legend');
  lg.append(el('span',null,'ECR and FP are FantasyPros\u2019 own rank and projection, the same numbers as on Players. Yours are shaded. Available players show as FA, or as on waivers when a claim period is set in League Setup.'));
  lg.append(el('span',null,'Statistics are the points each player scored, from the league lineup when it has him and from Sleeper\u2019s weekly stats otherwise.'));
  out.push(lg);
  return out;
}

/* ---------- sources page ----------
   Every source's OWN numbers, unmixed with any other's — no blend, no
   rest-of-season spread, nothing computed by combining two sources. The Players
   page and the market edge reconcile sources into one view; this is where you
   judge each one on its own first. What each column holds, and why a source's
   season column is labelled ROS or Season Total, is in src/sourcetables.js. */

/** The pool a league's scoring format reads: PPR, HALF or STD. */
function scoringKey(l){
  const u=String(l.scoring||'PPR').toUpperCase();
  return u==='HALF'? 'HALF' : (u==='STD'? 'STD' : 'PPR');
}

const SRC_ORDER = DATA.sourceOrder || [];
let srcQuery = store.get('gd.srcQuery','');
let srcPos   = new Set(String(store.get('gd.srcPos','')).split(',').filter(Boolean));
let SRC_LIST=null, SRC_POOL=new Map();

const srcMeta = src => (DATA.sourceMeta && DATA.sourceMeta[src]) || {label:src};

/**
 * Fixed scoring format for these league-independent Sources pages —
 * scoring differs slightly across the user's leagues, but not enough to
 * matter for judging a source's own numbers on their own. PPR when any
 * league reads it, else whichever format the leagues do.
 */
const SRC_SCORING = (DATA.pools && !DATA.pools.PPR && Object.keys(DATA.pools)[0]) || 'PPR';

const SRC_FRESH = {fp:'fp', draftsharks:'draftsharks'};
const SEASON_KIND = {
  remaining:{label:'Revised rest of season', cls:'ok'},
  static:   {label:'Static full season',     cls:'q'},
  sum:      {label:'Sum of weekly numbers',  cls:'gh'},
  none:     {label:'No season figure',       cls:'gh'},
};

/**
 * What this source covers, in plain words, from the record kept next to the
 * code that reads it (SOURCE_META in src/sourcetables.js). Answers the
 * questions a number on its own never does: is it this week or later, does a
 * rest-of-season figure include the week in progress, and how current is it.
 */
function sourceAboutPanel(src){
  const m=srcMeta(src), sc=m.scope;
  if(!sc) return null;
  const card=el('section','panel srccard');
  const hd=el('header'); hd.append(el('h3',null,'About this source')); hd.append(el('div','spacer'));
  const kind=SEASON_KIND[sc.seasonKind]||SEASON_KIND.none;
  hd.append(el('span','pill '+kind.cls, kind.label));
  card.append(hd);
  const body=el('div','pbody');
  const fr=(DATA.freshness||[]).find(f=>f.source===SRC_FRESH[src]);
  const rows=[
    ['This week', sc.thisWeek],
    ['Future weeks', sc.futureWeeks],
    ['Season figure', sc.season],
    ['Includes this week', ({yes:'Yes', no:'No', 'n/a':'Not applicable', unclear:'Unclear \u2014 see below'})[sc.includesThisWeek] || 'Unclear'],
    ['Rest of season here', sc.rosUsed],
    ['Actual points', sc.actuals],
    ['Scoring', sc.scoring],
    ['Last pulled', fr? fr.age+(fr.stale? ' \u2014 past its refresh window' : '') : 'no sync recorded'],
    ['Measured', sc.evidence],
  ];
  rows.forEach(([k,v])=>{ const r=el('div','gline'); r.append(el('b',null,k)); r.append(el('span',null,v)); body.append(r); });
  card.append(body);
  return card;
}

/** This source's error against what players actually scored, for every completed week. */
function accuracyPanels(){
  const acc = DATA.accuracy && DATA.accuracy[SRC_SCORING];
  const out=[];
  if(!acc){
    out.push(panel('Accuracy', null, emptyState('Nothing to score yet',
      'This needs a completed week and the FantasyPros API\u2019s per-week actuals (`FP_API_KEY`, then `npm run fp:sync`).')));
    return out;
  }
  const rowsFor=(stats)=> SRC_ORDER.filter(k=>stats[k]).map(k=>({k, st:stats[k]}));
  const build=(stats, title, sub)=>{
    const rows=rowsFor(stats);
    if(!rows.length) return null;
    const best=Math.min(...rows.map(r=>r.st.mae));
    const trs=rows.map(({k,st})=>{
      const tr=el('tr');
      tr.append(Object.assign(el('td'),{textContent:srcMeta(k).label}));
      tr.append(Object.assign(el('td','r num'),{textContent:String(st.n)}));
      const mae=el('td','r num'+(st.mae===best?' bestcell':'')); mae.textContent=fmt(st.mae,2); tr.append(mae);
      const bias=el('td','r num'); bias.textContent=(st.bias>0?'+':'')+fmt(st.bias,2);
      bias.title=st.bias>0? 'Runs high: projects more than players scored' : (st.bias<0? 'Runs low: projects less than players scored' : 'Unbiased');
      tr.append(bias);
      tr.append(Object.assign(el('td','r num'),{textContent:fmt(st.rmse,2)}));
      tr.append(Object.assign(el('td','r num'),{textContent:st.corr==null? '\u2014' : fmt(st.corr,2)}));
      return tr;
    });
    return panel(title, sub, table([{label:'Source'},{label:'Players',r:1},{label:'MAE',r:1},{label:'Bias',r:1},{label:'RMSE',r:1},{label:'Corr',r:1}], trs));
  };
  const commonPanel=build(acc.common.sources, 'Same players for every source', acc.common.n+' player-weeks both sources priced \u00b7 week'+(acc.weeks.length>1?'s ':' ')+acc.weeks.join(', '));
  if(commonPanel) out.push(commonPanel);
  const eachPanel=build(acc.sources, 'Each source on the players it covers', 'a narrower source prices mostly starters, so its errors are not comparable to a broader one\u2019s');
  if(eachPanel) out.push(eachPanel);
  if(!out.length){
    out.push(panel('Accuracy', null, emptyState('Nothing to score yet',
      'This needs a completed week and the FantasyPros API\u2019s per-week actuals (`FP_API_KEY`, then `npm run fp:sync`).')));
    return out;
  }
  const rd=el('div','pbody');
  [
    ['MAE','Mean absolute error in points per player-week \u2014 lower is better; the best is shaded.'],
    ['Bias','Projection minus actual, averaged. Positive runs high, negative low; a source with a steady bias can be corrected for, one with a large error cannot.'],
    ['RMSE','Like MAE but punishes big misses harder.'],
    ['Corr','How well it ranks players against their results, whatever its level. 1 is perfect.'],
    ['Caveat', acc.note],
  ].forEach(([k,v])=>{ const r=el('div','gline'); r.append(el('b',null,k)); r.append(el('span',null,v)); rd.append(r); });
  out.push(panel('Reading this', null, rd));
  return out;
}

/* ---- one page per site, one tab per file ----
   The rail lists each site (src/sourcefeeds.js FEED_SITES); a site's tabs are
   the files it gives us, each with its own path, clock and row count. */
const SRC_PAGE = id=> 'src-'+id;
const siteOfPage = pid=> FEED_SITES.find(s=> SRC_PAGE(s.id)===pid) || null;
const srcFeedKey = {};
FEED_SITES.forEach(s=>{ const k=store.get('gd.srcFeed.'+s.id,''); srcFeedKey[s.id]= s.feeds.some(f=>f.key===k)? k : s.feeds[0].key; });
{ const s=siteOfPage(page); if(s && H.tab && s.feeds.some(f=>f.key===H.tab)) srcFeedKey[s.id]=H.tab; }

const freshOf = k=> (DATA.freshness||[]).find(f=>f.source===k) || null;

/** Every week some player has a Sleeper result for, in order. */
let srcWeeks=null;
function srcActualWeeks(){
  if(srcWeeks) return srcWeeks;
  const ws=new Set();
  (DATA.pools[SRC_SCORING]||[]).forEach(p=> Object.keys(p.act||{}).forEach(w=> ws.add(Number(w))));
  return srcWeeks=[...ws].filter(Number.isFinite).sort((a,b)=>a-b);
}
function feedCtx(){
  return {season:DATA.season, week:DATA.week, scoring:SRC_SCORING.toLowerCase(), pool:DATA.pools[SRC_SCORING]||[],
    weeks:srcActualWeeks(), schedule:DATA.schedule, buzzDate:DATA.signals && DATA.signals.buzzDate};
}

/** The two clocks for one feed: when we pulled it, and when the site says it last recomputed (src/freshness.js). */
function feedClock(feed){
  const fr=freshOf(feed.ledger);
  return fr? {fetchedAt:fr.fetchedAt, sourceAt:fr.sourceAt, stale:fr.stale, limitMin:fr.limitMin, moved:fr.moved} : null;
}
function feedStatus(clk){
  if(!clk || !clk.fetchedAt) return el('span','pill gh','No sync');
  return clk.stale? el('span','pill q','Past '+clk.limitMin+'m window') : el('span','pill ok','Fresh');
}
const feedSiteClock = clk=> !clk? '—' : clk.sourceAt? ago(clk.sourceAt)+' ago'+(clk.moved===false? ', unchanged since our pull before' : '') : 'not published';

/** One cell, by the column's declared kind (src/sourcefeeds.js). */
function feedCell(c, v, r){
  if(c.kind==='text') return cell('text', v, {title: c.wide && v? String(v) : undefined});
  if(c.kind==='delta') return cell('delta', v, {d:c.d??0});
  const text = v==null? FX_BLANK
    : c.kind==='rank'? fxRank(v)
    : c.kind==='pos'? fxPosRank(r.p, v)
    : c.kind==='pct'? fxPct(v)
    : c.kind==='value'? fxValue(v)
    : c.kind==='count'? fxCount(v)
    : fxNum(v, c.d);
  return cell('num', v, {text});
}

/** No roster/team column here — these pages are league-independent, so who has a player rostered is out of scope. */
function sourceTable(site, feed, ctx, rows){
  const teams=feed.unit==='teams';
  const cols=feed.cols(ctx, rows);
  const lead = teams
    ? {key:'team', label:'Team', w:72, dir:'asc', sort:r=>r.team, cell:r=>cell('text', r.team)}
    : {key:'name', label:'Player', w:330, dir:'asc', sort:r=>String(r.n||'').toLowerCase(), cell:r=>cell('player', r)};
  const gcols=[lead, ...cols.map(c=>({key:c.key, label:c.label, title:c.title, r:c.kind==='text'? 0 : 1,
    w: c.wide? 420 : teams? 60 : c.kind==='text'? 104 : 84, dir:feedDir(c),
    sort:r=>{ const v=c.get(r,ctx); return v===''? null : v; },
    cell:r=> feedCell(c, c.get(r,ctx), r)}))];
  const first=cols.find(c=>c.key===feed.sort);
  return grid({id:'source|'+site.id+'|'+feed.key, cols:gcols, rows, noun: teams? 'teams' : 'players', lean:true,
    sort: first? {key:first.key, dir:feedDir(first)} : null,
    empty:['No '+site.label+' '+feed.label.toLowerCase(), 'Run the sync for it, rebuild the dashboard, or loosen the filters.']});
}

function feedFilteredRows(feed, ctx){
  let rows=feedRows(feed, ctx);
  if(feed.unit==='teams') return rows;
  if(srcPos.size)  rows=rows.filter(r=> srcPos.has(r.p));
  if(srcQuery)     rows=rows.filter(r=> String(r.n||'').toLowerCase().includes(srcQuery));
  return rows;
}

function buildSourceList(site, feed){
  if(!SRC_LIST) return;
  while(SRC_LIST.childNodes.length>1) SRC_LIST.removeChild(SRC_LIST.lastChild);
  const ctx=feedCtx();
  SRC_LIST.append(sourceTable(site, feed, ctx, feedFilteredRows(feed, ctx)));
}

/** Where this tab's numbers came from: the file on disk, both clocks, and what the file is. */
function feedProvenance(site, feed, ctx, n){
  const card=el('section','panel srccard');
  const hd=el('header'); hd.append(el('h3',null,feed.label)); hd.append(el('div','spacer'));
  const clk=feedClock(feed);
  hd.append(feedStatus(clk));
  card.append(hd);
  const body=el('div','pbody');
  const files=el('span');
  feed.files(ctx).forEach((f,i)=>{ if(i) files.append(document.createTextNode(' ')); files.append(el('code',null,'data/'+f)); });
  const pool=(ctx.pool||[]).length;
  [
    ['File', files],
    ['What it is', feed.about],
    ['Rows', feed.unit==='teams'? n+' teams' : n+' of '+pool+' players in the pool'],
    ['Clocks', (clk && clk.fetchedAt? 'pulled '+ago(clk.fetchedAt)+' ago'+(clk.stale? ' (past its '+clk.limitMin+'m refresh window)' : '') : 'no sync recorded')+' · site’s own clock: '+feedSiteClock(clk)],
  ].forEach(([k,v])=>{ const r=el('div','gline'); r.append(el('b',null,k)); const s=el('span'); if(v instanceof Node) s.append(v); else s.textContent=v; r.append(s); body.append(r); });
  card.append(body);
  return card;
}

function sourceTabBar(site, ctx){
  const tabs=el('div','pgtabs'); tabs.setAttribute('role','tablist'); tabs.setAttribute('aria-label', site.label+' files');
  const cur=srcFeedKey[site.id];
  const pick=k=>{ srcFeedKey[site.id]=k; store.set('gd.srcFeed.'+site.id,k); writeHash(); render(); const b=document.querySelector('.pgtabs [aria-selected="true"]'); if(b) b.focus(); };
  site.feeds.forEach(f=>{
    const b=el('button',null,f.label); b.type='button'; b.setAttribute('role','tab');
    b.append(el('span','tag', String(feedRows(f, ctx).length)));
    b.setAttribute('aria-selected', String(f.key===cur));
    b.tabIndex = f.key===cur? 0 : -1;
    b.onclick=()=>pick(f.key);
    tabs.append(b);
  });
  tabs.addEventListener('keydown',e=>{
    if(e.key!=='ArrowRight' && e.key!=='ArrowLeft') return;

  return tabs;
}

function textInput(value, onCommit, placeholder){

/**
 * The league's scoring table, and the corrections to it.
 *
 * Two sources disagree here, and both are shown rather than merged silently:
 *
 *   scraped  MyPlaybook's reading of the league's rules. Available for ESPN,
 *            Yahoo and Sleeper, and complete for none of them — its Sleeper
 *            reading carries no defensive stats for a league that scores them.
 *   host     the host's own table, where the host publishes one. Sleeper does;
 *            ESPN and Yahoo do not expose one reachable from here.
 *
 * You edit the third column, which wins over both. Nothing here changes the
 * points on the rest of the page — those come from the host itself, per player,
 * off the live board — so this is the reference that explains WHY a number
 * differs from a generic PPR projection, and the place to record a rule the
 * scrape got wrong.
 */
const SLEEPER_STAT = {
  'PassYds':'pass_yd', 'PassTD':'pass_td', 'IntQB':'pass_int', 'Pass2pt':'pass_2pt',
  'RushYds':'rush_yd', 'RushTD':'rush_td', 'Rush2pt':'rush_2pt',
  'RecYds':'rec_yd', 'RecTD':'rec_td', 'Rec':'rec', 'RecWR':'rec', 'RecRB':'rec', 'RecTE':'rec',
  'FumLost':'fum_lost', 'FumRec':'fum_rec', '2-PT':'pass_2pt',
  'PAT':'xpm', 'IntDef':'int', 'Sack':'sck', 'Safety':'safe', 'DefTD':'def_td',
};
const STAT_LABEL = {
  'PassYds':'Passing yards', 'PassTD':'Passing TD', 'IntQB':'Interception thrown',
  'RushYds':'Rushing yards', 'RushTD':'Rushing TD',
  'RecYds':'Receiving yards', 'RecTD':'Receiving TD',
  'Rec':'Reception', 'RecWR':'Reception — WR', 'RecRB':'Reception — RB', 'RecTE':'Reception — TE',
  'FumLost':'Fumble lost', 'FumRec':'Fumble recovered', '2-PT':'Two-point conversion',
  'FG':'Field goal', 'PAT':'Extra point', 'IntDef':'Interception (D)', 'Sack':'Sack',
  'Safety':'Safety', 'DefTD':'Defensive TD', 'PtsAllow':'Points allowed',
};

function scoringPanel(l, o){
  const sys=l.scoringSystem;
  const host=(l.detail && l.detail.supported && l.detail.settings) ? l.detail.settings.scoring : null;
  const over=o.scoring||{};
  if(!sys && !host){
    return panel('Scoring', l.host,
      emptyState('No scoring table from this host', 'Per-player points still come from the host itself, so they are correct — there is just nothing here to show or correct.'));
  }

  const rules=(sys&&sys.rules)||[];
  const seen=new Set(rules.map(r=>r.stat));
  // A stat the host publishes and the scrape missed is exactly the gap this
  // panel exists for, so it gets a row of its own rather than being dropped.
  const extra=[];
  if(host){
    Object.entries(SLEEPER_STAT).forEach(([stat,key])=>{
      if(seen.has(stat) || host[key]==null) return;
      if(extra.some(e=>e.stat===stat)) return;
      extra.push({stat, tiers:[], missing:true});
    });
  }

  const rowFor=(r)=>{
    const tr=el('tr');
    if(r.missing) tr.classList.add('benchrow');

    const nc=el('td');
    const w=el('div','nm');
    w.append(el('b',null, STAT_LABEL[r.stat] || r.stat));
    w.append(el('small',null, r.stat + (r.tiers.length>1? ' · '+r.tiers.length+' bands' : '')));
    nc.append(w); tr.append(nc);

    // Banded stats (FG by distance, PtsAllow by bracket) are a table, not a
    // number, so they are shown whole and left uneditable rather than flattened
    // to whichever band happened to come first.
    const sc=el('td','r');
    if(r.tiers.length>1){
      sc.append(Object.assign(el('div','ss'),{textContent:r.tiers.map(t=>t.points+' @ '+t.lower+'–'+t.upper).join('  ·  ')}));
    } else if(r.tiers.length===1){
      sc.append(Object.assign(el('div','num'),{textContent:String(r.tiers[0].points)}));
    } else sc.append(el('span','note','—'));
    tr.append(sc);

    const hc=el('td','r');
    const hv=host? host[SLEEPER_STAT[r.stat]] : undefined;
    if(hv==null) hc.append(el('span','note', host? '—' : ''));
    else{
      const sp=el('span','num', String(hv));
      // A disagreement is the whole reason both columns are here.
      if(r.tiers.length===1 && Number(hv)!==Number(r.tiers[0].points)) sp.style.color='var(--warn)';
      hc.append(sp);
    }
    tr.append(hc);

    const oc=el('td','r');
    if(r.tiers.length>1) oc.append(el('span','note','banded'));
    else oc.append(numInput(over[r.stat], v=>{
      const next={...over}; if(v==null) delete next[r.stat]; else next[r.stat]=v;
      edits.set(l.key,{scoring:next}); render();
    }, {placeholder: r.tiers[0]? String(r.tiers[0].points) : (hv!=null? String(hv) : '')}));
    tr.append(oc);
    return tr;
  };

  const all=[...rules, ...extra].sort((a,b)=>String(a.stat).localeCompare(String(b.stat)));
  const body=table(
    [{label:'Stat'},{label:'MyPlaybook',r:1},{label:l.host+' direct',r:1},{label:'Yours',r:1}],
    all.map(rowFor));

  const notes=[];
  if(sys) notes.push('Format: '+(sys.format||'—')+(sys.custom? ' · custom scoring on' : ''));
  if(extra.length) notes.push(extra.length+' stat(s) the '+l.host+' table has and the MyPlaybook read does not.');
  notes.push('Per-player points elsewhere in this app come from the host’s own scoring, not from this table — this is the reference, and the place to record what the scrape got wrong.');
  const wrap=el('div');
  wrap.append(body);
  const nb=el('div','pbody');
  notes.forEach(n=> nb.append(Object.assign(el('p','note'),{textContent:n})));
  wrap.append(nb);
  return panel('Scoring', sys? (sys.basic||sys.format||null) : l.host, wrap);
}

function pageManage(){

  h.append(el('p',null,'Corrections to what the host reports — names, which teams are yours, divisions, and the seeding rule no host exposes. '+

  const divNames=[...new Set([...(o.divisions||[]).map(d=>d.name), ...Object.values(o.teams||{}).map(t=>t.division).filter(Boolean)])];

  const teamRows=l.teams.map(t=>{
    const id=String(t.id);
    const to=o.teams[id]||{};
    const tr=el('tr');

    const idc=el('td','r num'); idc.textContent=id; tr.append(idc);

    const nc=el('td');
    nc.append(textInput(to.nickname, v=>{ edits.setTeam(l.key,id,{nickname:v}); render(); }, teamHostName(t)));

    tr.append(nc);

    // The short badge shown beside the crest on the Players and Sources pages.

    const bc=el('td');
    const bi=textInput(to.abbreviation, v=>{ edits.setTeam(l.key,id,{abbreviation: v? v.slice(0,ABBR_MAX) : null}); render(); }, initials(teamLabel(l,t)));
    bi.maxLength=ABBR_MAX; bi.classList.add('abbrin');

    // "Mine" is a checkbox per team, not a single selector, because two teams

    const cb=el('input'); cb.type='checkbox'; cb.checked=mineIds.has(id);
    cb.onchange=()=>{
      const next=new Set(mineIds);
      if(cb.checked) next.add(id); else next.delete(id);

      edits.set(l.key,{myTeamIds:arr, primaryTeamId: arr.includes(primary)? primary : (arr[0]??null)});

  out.push(panel('Teams', mineIds.size+' marked yours'+(mineIds.size>1? ' · ★ is the one My Team opens on':''),

  pg.append(field('Playoff teams',
    numInput(pf.playoffTeams ?? (l.playoffs&&l.playoffs.teams), v=>{ edits.set(l.key,{playoffs:{playoffTeams:v}}); render(); }, {min:2,max:16}),

  if(pf.rule==='division-first'){
    pg.append(field('Division seeds locked',
      numInput(pf.divisionSeeds ?? 2, v=>{ edits.set(l.key,{playoffs:{divisionSeeds:v}}); render(); }, {min:1,max:8}),

  }
  if(pf.rule==='points-wildcard'){
    pg.append(field('Points wildcards',
      numInput(pf.wildcards ?? 1, v=>{ edits.set(l.key,{playoffs:{wildcards:v}}); render(); }, {min:1,max:4}),
      'Final N seeds go to the highest points-for among teams that missed on record.'));
  }
  pg.append(field('Tiebreaker',
    selectInput([{value:null,label:'Points for (default)'}, ...Object.entries(DATA.rules.tiebreak).map(([k,v])=>({value:k,label:v}))],
      pf.tiebreak, v=>{ edits.set(l.key,{playoffs:{tiebreak:v}}); render(); })));
  pg.append(field('Playoffs start week',
    numInput(pf.startWeek ?? (l.playoffs&&l.playoffs.startWeek), v=>{ edits.set(l.key,{playoffs:{startWeek:v}}); render(); }, {min:10,max:18})));
  pg.append(field('Note', textInput(pf.note, v=>{ edits.set(l.key,{playoffs:{note:v}}); render(); }, 'e.g. seed 6 is most points among 6–12'),
    'Free text, for the rule your league actually wrote down.'));
  pb.append(pg);
  if(pf.rule){
    const d=el('p','note'); d.style.marginTop='10px';
    d.textContent='→ '+describeSeedRule(pf);

  }
  out.push(panel('Playoffs', pf.rule? null : 'not configured — Standings will not show a bracket', pb));

  /* --- waivers -------------------------------------------------------- */
  const wv=o.waivers||{};
  const wb=el('div','pbody');

  wg.append(field('Waiver type',
    selectInput([{value:null,label:l.waiverType? 'Host: '+l.waiverType : '— not set —'},
      {value:'rolling',label:'Rolling list'},{value:'faab',label:'FAAB'},{value:'reverse',label:'Reverse standings'},{value:'none',label:'No waivers'}],
      wv.type, v=>{ edits.set(l.key,{waivers:{type:v}}); render(); })));
  wg.append(field('Claim period (days)',
    numInput(wv.claimDays, v=>{ edits.set(l.key,{waivers:{claimDays:v}}); render(); }, {min:0,max:7,placeholder:'2'}),
    'How long a dropped player sits before clearing to free agency.'));
  wg.append(field('Claims process on',
    selectInput([{value:null,label:'—'},...['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'].map((d,i)=>({value:i,label:d}))],
      wv.processDay, v=>{ edits.set(l.key,{waivers:{processDay: v==null?null:Number(v)}}); render(); }),
    'Used to say when a player clears.'));
  wg.append(field('at hour',
    numInput(wv.processHour, v=>{ edits.set(l.key,{waivers:{processHour:v}}); render(); }, {min:0,max:23,placeholder:'3'}),
    '24h, your local time.'));
  wb.append(wg);

  /* --- scoring -------------------------------------------------------- */
  out.push(scoringPanel(l, o));
  return out;

/** Plain-English restatement of the configured seeding rule. */
function describeSeedRule(c){
  const tb=(DATA.rules.tiebreak[c.tiebreak]||'Points for').toLowerCase();
  const n=c.playoffTeams ?? '?';
  if(c.rule==='record') return 'Seeds 1–'+n+' by record, ties broken by '+tb+'.';
  if(c.rule==='division-first') return 'Top '+(c.divisionSeeds ?? 2)+' seeds are division winners; the rest by record, ties broken by '+tb+'.';
  if(c.rule==='points-wildcard') return 'Seeds 1–'+(Number(n)-(c.wildcards ?? 1))+' by record; the final '+(c.wildcards ?? 1)+' by most points for among everyone who missed.';
  return '';
}
const DAYS=['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
function describeWaivers(w){
  const hr=w.processHour!=null? ' at '+(w.processHour%12||12)+(w.processHour<12?'am':'pm') : '';
  return 'Claims process '+DAYS[w.processDay]+hr+(w.claimDays!=null? '; dropped players sit '+w.claimDays+' day(s) before clearing.' : '.');
}

/**
 * Save every league's local edits straight to data/league-overrides.json,
 * for everyone under `node src/cli.js serve` — no file to download, no
 * `league:import` to remember. Only works when the dashboard is actually
 * being served (fetch to a relative /api/ path 404s or errors outright on a
 * file:// page), so a failure here falls back to telling the user to use
 * Export instead rather than pretending it worked.
 */
async function saveEditsToServer(btn){
  const body={ leagues: edits.all() };
  const n=Object.keys(body.leagues).length;
  if(!n){ toast('No local edits to save.',{level:'warn'}); return; }
  const prev=btn.textContent; btn.disabled=true; btn.textContent='Saving…';
  try{
    const res=await fetch('/api/overrides',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
    const r=await res.json().catch(()=>null);
    if(!res.ok || !r || !r.ok) throw new Error((r&&r.message)||('HTTP '+res.status));
    edits.clearAll();
    LOG.add('ok','saved League Setup edits for '+n+' league(s) to data/league-overrides.json','setup',{toast:false});
    location.reload();
  }catch(e){
    LOG.add('error','Could not save to the server: '+e.message+' — use Export edits when the page is a static file.','setup');
  }finally{
    btn.disabled=false; btn.textContent=prev;
  }
}

/**
 * Write the local edits out as the file `league:import` reads.
 *
 * A download is the only way off a page with no server. Anchor downloads are
 * blocked in some embedded viewers, so the JSON is also dropped into a
 * selectable box — a copy-paste always works.
 */
function exportEdits(){
  const body={ exportedAt:new Date().toISOString(), leagues: edits.all() };
  const json=JSON.stringify(body,null,2);
  const n=Object.keys(body.leagues).length;
  if(!n){ toast('No local edits to export.',{level:'warn'}); return; }
  try{
    const url=URL.createObjectURL(new Blob([json],{type:'application/json'}));
    const a=el('a'); a.href=url; a.download='league-overrides.patch.json';
    document.body.append(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(url),1000);
  }catch{ /* download blocked; the box below still works */ }
  const dlg=el('div','exportbox');
  dlg.append(el('h3',null,'Edits for '+n+' league(s)'));
  dlg.append(Object.assign(el('p','note'),{textContent:'Save as league-overrides.patch.json, then: node src/cli.js league:import league-overrides.patch.json'}));
  const ta=el('textarea'); ta.value=json; ta.readOnly=true; ta.rows=14;
  dlg.append(ta);
  const close=el('button','iconbtn','Close'); close.type='button'; close.onclick=()=>dlg.remove();
  dlg.append(close);
  $('#page').prepend(dlg);
  ta.focus(); ta.select();
}

/* ---------- league analysis ----------
 *
 * FantasyPros valuing EVERY roster in the league (see src/leagueanalysis.js). It
 * is the one league-specific valuation of other managers' players, so it answers
 * questions the boards cannot: who is strong where, and what is my weakest spot
 * measured against the people I actually play.
 *
 * Two periods: `ros` scores the whole roster (bench depth counts over a season),
 * `week` scores the starters only. The sync checks that each team's score is the
 * sum of its players' values and this page says so when it is not.
 */
let anPeriod = store.get('gd.an.period','ros')==='week' ? 'week' : 'ros';
let anMetric = store.get('gd.an.metric','vorp')==='value' ? 'value' : 'vorp';
const AN_PERIODS = {ros:'Rest of season', week:'This week'};
const anSigned = (v,d)=> v==null? '—' : (v>0?'+':(v<0?'−':''))+Math.abs(v).toFixed(d==null?1:d);
const shortName = (n,pos)=>{
  if(!n) return '—';
  const w=String(n).trim().split(/\s+/);
  if(String(pos||'').toUpperCase()==='DST' || w.length<2) return w[w.length-1];
  return w[0][0]+'. '+w.slice(1).join(' ');
};
const tierChip = t=> el('span','tierchip t'+(t==null?'x':t), t==null? '—' : 'Tier '+t);
/** A slot label as the position chip's colour key: RB1 -> RB, FLX -> FLEX, SFLX -> SF. */
const slotKey = sl=>{ const k=String(sl||'').toUpperCase().replace(/\d+$/,''); return k==='FLX'? 'FLEX' : (k==='SFLX'? 'SF' : k); };

function pageAnalysis(){
  const l=L(), out=[];
  const head=el('div','head');
  head.append(el('h1',null,'League Analysis'));
  head.append(el('p',null,'FantasyPros values every roster in '+leagueLabel(l)+' against a replacement level, under this league’s own scoring and lineup slots — so you can see who is strong where, not just who is ranked high.'));
  out.push(head);

  const A=l.analysis;
  if(!A){
    out.push(panel('League analysis',null,emptyState('Not synced yet','Run `npm run scrape` — MyPlaybook serves this for every league on the account, ESPN, Yahoo and Sleeper alike.')));
    return out;
  }

  const bar=el('div','toggles');
  bar.append(segmented(Object.keys(AN_PERIODS).map(k=>({label:AN_PERIODS[k],value:k})), anPeriod, v=>{ anPeriod=v; store.set('gd.an.period',v); render(); }));
  bar.append(segmented([{label:'Points over replacement',value:'vorp'},{label:'Trade value',value:'value'}], anMetric, v=>{ anMetric=v; store.set('gd.an.metric',v); render(); }));
  out.push(bar);

  const P=A[anPeriod];
  if(!P){
    out.push(panel(AN_PERIODS[anPeriod],null,emptyState('No '+AN_PERIODS[anPeriod].toLowerCase()+' analysis','FantasyPros did not return this period on the last sync. Run `npm run scrape` again.')));
    return out;
  }

  const uni=universe(scoringKey(l));
  const ltOf=id=> l.teams.find(t=>String(t.id)===String(id)) || null;
  const nameOf=a=>{ const t=ltOf(a.teamId); return t? teamLabel(l,t) : (a.name||('Team '+a.teamId)); };
  const N=P.teams.length;
  const mine=P.teams.find(t=>{ const lt=ltOf(t.teamId); return (lt&&lt.mine) || t.isMine; }) || P.teams.find(t=>t.isMine) || null;
  const me=P.me;

  // ---- the read at a glance
  const strip=el('div','strip');
  if(mine){
    strip.append(statTile(P.basis==='roster'?'Roster strength':'Starter strength','#'+mine.rank+' of '+N,
      'Tier '+mine.tier+' · '+anSigned(mine.vorpPct-100)+'% vs league mean','consensus'));
  }
  if(me&&me.startersOnly) strip.append(statTile('Starters','#'+me.startersOnly.rank+' of '+N,'Tier '+me.startersOnly.tier));
  if(me&&me.benchOnly) strip.append(statTile('Bench','#'+me.benchOnly.rank+' of '+N,'Tier '+me.benchOnly.tier));
  const weak=me&&me.tradeNeeds&&me.tradeNeeds[0];
  if(weak) strip.append(statTile('Weakest spot',weak.position,'#'+weak.rank+' of '+N+' at the position','market'));
  out.push(strip);

  const note=el('div','note');
  note.append(document.createTextNode(P.basis==='roster'
    ? 'Team scores add up every rostered player’s points over replacement, bench included — depth counts over a season. '
    : 'Team scores add up the starters’ points over replacement only — a benched player scores nothing this week. '));
  note.append(P.ok
    ? el('span','pill ok','scores match the player values')
    : Object.assign(el('span','pill out','scores do not match'),{title:'Each team’s score should equal the sum of its players’ values; here it is off by up to '+P.drift+'. FantasyPros may have changed what these numbers mean — treat the ranking as unverified.'}));
  if(A.asOf) note.append(el('span','wk',' · synced '+new Date(A.asOf).toLocaleString()));
  out.push(note);

  // ---- team strength
  const isMine=a=>{ const lt=ltOf(a.teamId); return (lt&&lt.mine)||a.isMine; };
  const dvOf=a=> a.vorpPct==null? null : a.vorpPct-100;
  out.push(panel('Team strength', AN_PERIODS[anPeriod]+' · '+N+' teams', smallTable({id:'analysis|'+anPeriod, rows:P.teams,
    rowClass:a=> isMine(a)? 'mine' : null, cols:[
      {key:'rank', label:'#', dir:'asc', sort:a=>a.rank, cell:a=> cell('num', a.rank, {d:0})},
      {key:'team', label:'Team', dir:'asc', sort:a=>nameOf(a), cell:a=>{ const lt=ltOf(a.teamId); return cell('team', {logo:lt&&lt.logo, name:nameOf(a)}); }},
      {key:'tier', label:'Tier', dir:'asc', sort:a=>a.tier, cell:a=>{ const td=el('td'); td.append(tierChip(a.tier)); return td; }},
      {label:'Strength', cell:a=> cell('bar', (a.index||0)/100, {cls:'t'+a.tier})},
      {key:'score', label:'Score', r:1, sort:a=>a.score, cell:a=> cell('num', a.score, {d:0})},
      {key:'vs', label:'vs mean', r:1, sort:dvOf, cell:a=>{
        const dv=dvOf(a), td=el('td','r');
        td.append(el('span','delta '+(dv>0?'up':dv<0?'dn':'flat'), dv==null? FX_BLANK : anSigned(dv)+'%'));
        return td;
      }}
    ]})));

  // ---- my team: by position group, and slot by slot
  if(me){
    const cols=el('div','cols');
    const list=el('div','pbody posrank');
    const add=(label,r,strong)=>{
      const row=el('div','prk'+(strong?' strong':''));
      row.append(el('span','pl1',label));
      const b=el('div','sbar t'+r.tier); const f=el('i'); f.style.width=Math.max(4,r.percent)+'%'; b.append(f); row.append(b);
      row.append(el('span','pr1 num','#'+r.rank+' of '+N));
      list.append(row);
    };
    if(me.startersOnly) add('Starters',me.startersOnly,true);
    if(me.benchOnly) add('Bench',me.benchOnly,true);
    (me.positions||[]).forEach(r=> add(r.position,r,false));
    if(me.tradeNeeds&&me.tradeNeeds.length){
      const tn=el('div','tneeds'); tn.append(el('span','lbl','Where to trade'));
      me.tradeNeeds.forEach(n=> tn.append(el('span','pill q',n.position+' · #'+n.rank)));
      list.append(tn);
    }
    cols.append(panel('Your team by position', 'rank among '+N+' teams', list));

    const lineup=me.lineup||[];
    cols.append(panel('Your lineup, slot by slot','FantasyPros’ optimal lineup',
      lineup.length? smallTable({id:'analysis-lineup', nopos:true, rows:lineup, cols:[
        {label:'Slot', cell:x=> cell('slot', x.slot)},
        {label:'Player', cell:x=>{ const pr=uni.get(Number(x.fpId)); return pr? cell('player', pr) : cell('text', null, {text:x.name||FX_BLANK}); }},
        {key:'rank', label:'League rank', r:1, dir:'asc', sort:x=>x.rank, cell:x=> cell('num', null, {text:fxRank(x.rank)})},
        {key:'tier', label:'Tier', dir:'asc', sort:x=>x.tier, cell:x=>{ const td=el('td'); td.append(tierChip(x.tier)); return td; }}
      ]}) : emptyState('No lineup','')));
    out.push(cols);
  }

  out.push(analysisGrid(l,P,uni,nameOf,ltOf));
  return out;
}

/**
 * Every team's roster, one column per team, one row per lineup slot.
 *
 * Each cell is shaded against the rest of ITS row, so a strong quarterback
 * reads as strong next to other quarterbacks and a weak bench reads as weak
 * next to other benches. Where a slot appears twice (RB, RB) the better player
 * goes first: the payload keys players by id and drops the grid's own order.
 */
function analysisGrid(l,P,uni,nameOf,ltOf){
  const key = anMetric==='value'? 'value' : 'vorp';
  const byTeam=new Map();
  Object.entries(P.players).forEach(([id,p])=>{
    const k=String(p.tid); if(!byTeam.has(k)) byTeam.set(k,[]);
    byTeam.get(k).push(Object.assign({id:Number(id)},p));
  });
  const slotList=(tid,slot)=> (byTeam.get(String(tid))||[]).filter(p=>p.slot===slot).sort((a,b)=>(b[key]??-1e9)-(a[key]??-1e9));

  const tb=el('tbody'), seen={};
  P.slots.forEach(slot=>{

    const cells=P.teams.map(a=> slotList(a.teamId,slot)[k] || null);
    const vals=cells.filter(Boolean).map(c=>c[key]).filter(v=>v!=null);
    const lo=Math.min(...vals), hi=Math.max(...vals), span=hi-lo;
    const tr=el('tr');
    const sc=el('td','slot'); const chip=el('span','pos slot',slot==='BN'?'BN':slot); chip.setAttribute('data-p',slotKey(slot)); sc.append(chip); tr.append(sc);
    cells.forEach((c,i)=>{
      const a=P.teams[i], lt=ltOf(a.teamId), isMine=(lt&&lt.mine)||a.isMine;
      const td=el('td','gcell'+(isMine?' mine':''));
      if(c){
        const pr=uni.get(c.id);
        const h=span>0 && c[key]!=null ? (c[key]-lo)/span : 0.5;
        td.style.background='color-mix(in srgb, var(--consensus) '+Math.round(5+h*34)+'%, var(--surface))';
        td.append(Object.assign(el('div','gn'),{textContent:shortName(pr&&pr.n,pr&&pr.p)}));
        const gs=el('div','gs');
        gs.append(el('b',null,c[key]==null?'—':(key==='vorp'? Math.round(c[key]) : c[key].toFixed(1))));
        gs.append(el('span',null,(pr&&pr.p||'')+(c.pRank!=null? c.pRank : '')));
        td.append(gs);
        td.title=(pr&&pr.n||'fpId '+c.id)+' — '+(c.vorp!=null? Math.round(c.vorp)+' pts over replacement' : '')+(c.value!=null? ' · trade value '+c.value : '')+(c.oRank!=null? ' · #'+c.oRank+' overall' : '');
      } else td.append(el('span','delta flat','—'));
      tr.append(td);
    });
    tb.append(tr);
  });
  const fr=el('tr','totrow'); fr.append(el('td','slot','Score'));
  P.teams.forEach(a=>{
    const v = key==='vorp'? a.score : (byTeam.get(String(a.teamId))||[]).filter(p=>P.basis==='roster'||p.slot!=='BN').reduce((s,p)=>s+(p.value||0),0);
    fr.append(Object.assign(el('td','r num'),{textContent: key==='vorp'? fmt(v,0) : fmt(v,1)}));
  });
  tb.append(fr); t.append(tb);

  const wrap=el('div','scroll'); wrap.append(t);
  return panel('Every roster, slot by slot',
    (key==='vorp'? 'points over replacement' : 'trade value')+' · shaded against the rest of the row',
    wrap);
}

/* ---------- values: every rest-of-season source, on one axis ----------
   FantasyPros' and Draft Sharks' ROS projections and the FantasyPros, ESPN,
   FanDuel and FantasyGuys ROS ranks (valuescale.js). No trade values: a
   market's number is already a price for someone else's league, and pricing
   for THIS league is what League Value does. Each source's opinion is its
   position rank, priced by the league's curve and replacement level
   (leaguevalue.js `lvWorth`), so every column is in one unit; League Value is
   their consensus, and every cell is shaded by how far its source sits from
   it. The sources' own numbers and plain position ranks are one toggle away.
   Modules inlined (the same files the tests run): valuescale.js reads a
   source, powerrank.js scores teams, leaguevalue.js prices for the league. */
/*__INLINE:valuescale.js__*/
/*__INLINE:powerrank.js__*/
/*__INLINE:leaguevalue.js__*/

let valSrc   = store.get('gd.val.src','') || null;
/** 'league' (points over replacement here), 'rank' (position rank), 'raw' (the source's own number). */
let valScale = ({norm:'league', league:'league', rank:'rank', raw:'raw'})[store.get('gd.val.scale','league')] || 'league';
let valView  = store.get('gd.val.view','players')==='teams' ? 'teams' : 'players';
let valTeam  = 'all', valPos='ALL', valQuery='';
let prSort   = store.get('gd.pr.sort','contender')==='trade' ? 'trade' : 'contender';

const LV_SOURCE = {id:'lv', group:'league', label:'League Value', short:'League Value', kind:'league'};
const srcCache=new Map();
const sourcesOf = l=>{ const k=scoringKey(l); if(!srcCache.has(k)) srcCache.set(k, vsSources(DATA.pools[k]||[])); return srcCache.get(k); };

/** Who publishes what: FantasyPros' projection and its rank are two products, so they sit together but apart. */
const SRC_GROUPS=[
  {key:'league', label:'This league'},
  {key:'fp',     label:'FantasyPros'},
  {key:'ds',     label:'Draft Sharks'},
  {key:'other',  label:'For comparison (not counted)'}
];
const srcGroup = s=> s.group;
const srcShort = s=> s.short || s.label;
/** What a column IS, for its tooltip. */
function srcTitle(s){
  if(s.id==='lv') return 'League Value: every source’s position rank, combined, priced for this league';
  return s.label+(s.kind==='rank'? ' — a rest-of-season rank' : ' — rest-of-season points')+', read as a position rank and priced for this league';
}
const valSources = l=>{
  const ss=sourcesOf(l);
  return ss.length? [LV_SOURCE, ...ss] : [];
};
/** League Value by default: it is the one number priced for this league. */
function valSrcId(l){
  const ss=valSources(l);
  if(valSrc && ss.some(s=>s.id===valSrc)) return valSrc;
  return ss.length? 'lv' : null;
}
const valSource = (l,id)=> valSources(l).find(s=>s.id===id) || null;
const valName = s=> !s? '—' : s.label;
const prIsSF = l=> prSuperflex(prSlots(l.rosterSlots));

/**
 * The evidence League Value orders players by (src/leaguevalue.js): the same
 * rest-of-season inputs as the agreed ROS number — FantasyPros and Draft
 * Sharks, one vote per site. The projections also set the points curve.
 */
function lvSignals(l){
  return vsSignals(sourcesOf(l));
}
const lvCache=new Map();
function lvFor(l){
  const k=l.key;
  if(!lvCache.has(k)){
    const slots=prSlots(l.rosterSlots);
    const bench=(l.rosterSlots||[]).filter(x=>/^(BN|BE|BENCH)$/i.test(String(x).trim())).length;
    // How deep the league really rosters each position, counted off its teams.
    const uni=universe(scoringKey(l)), rostered={QB:0,RB:0,WR:0,TE:0};
    l.teams.forEach(t=> t.players.forEach(x=>{ const pos=(uni.get(x.i)||{}).p; if(pos in rostered) rostered[pos]++; }));
    const known=Object.values(rostered).reduce((a,b)=>a+b,0)>0;
    lvCache.set(k, lvValues(DATA.pools[scoringKey(l)]||[], lvSignals(l), {teams:l.teams.length, slots, benchSpots:bench, rostered:known? rostered : null, games:vsGames}));
  }
  return lvCache.get(k);
}
/** Each source's within-position ranks over this league's pool — the very ranks League Value read it by. */
const rankCache=new Map();
function srcPosRanks(l, src){
  const k=l.key+'|'+src.id;
  // A ROS projection is ranked per game, as League Value reads it.
  if(!rankCache.has(k)) rankCache.set(k, lvRanksBy(DATA.pools[scoringKey(l)]||[], src.rate? r=> vsRate(r,src) : r=> vsScore(r,src)));
  return rankCache.get(k);
}

/** Every page reads a value through these, so League Value is just another source to them. */
function valRaw(p,src,sf){ if(src&&src.id==='lv'){ const x=lvFor(L()).players.get(p.i); return x? x.value : null; } return vsRaw(p,src); }
/** The source's position rank in this league's pool; League Value's is the consensus order. */
function valPosRank(p,src,sf){
  if(src.id==='lv'){ const x=lvFor(L()).players.get(p.i); return x? x.posRank : null; }
  return srcPosRanks(L(), src).get(p.i) ?? null;
}
/** The source's opinion, priced here: points over replacement at the rank it gives him. */
function valWorth(p,src,sf){ return src.id==='lv'? valRaw(p,src,sf) : lvWorth(lvFor(L()), p.p, valPosRank(p,src,sf), vsGames(p)); }
function valRanks(p,src,sf){ if(src&&src.id==='lv'){ const x=lvFor(L()).players.get(p.i); return x? {rank:x.rank, posRank:x.posRank} : null; } return {rank:null, posRank:valPosRank(p,src,sf)}; }
/** The number in a player cell, by the current view. */
const valOf = (p,src,sf)=> valScale==='raw'? valRaw(p,src,sf) : valScale==='rank'? valPosRank(p,src,sf) : valWorth(p,src,sf);
/** What a player adds to a team total: ranks do not add up, so only projected points are summed raw; everything else sums league points. */
const teamVal = (p,src,sf)=> valScale==='raw' && src.kind==='points'? valRaw(p,src,sf) : valWorth(p,src,sf);
/** ~10,000-scale numbers read as whole numbers; small ones keep a decimal. */
const prFmt = fxValue;
const valCellText = (p,v,s)=> v==null? '—' : valScale==='rank'? (p.p||'')+v : valScale==='raw' && s && s.kind==='rank'? '#'+v : prFmt(v);

/**
 * How far a source sits from League Value, as a shade: up = the source likes
 * him more. Points where the view is points (a rank gap at the top of a
 * position is worth more than one at the bottom), ranks otherwise.
 */
function heatClass(p, src, sf){
  if(src.id==='lv') return '';
  if(valScale==='league'){
    const a=valWorth(p,src,sf), b=valWorth(p,LV_SOURCE,sf);
    return a==null || b==null? '' : fxHeatClass(fxHeat(a-b, [8,20,40]));
  }
  const a=valPosRank(p,src,sf), b=valPosRank(p,LV_SOURCE,sf);
  return a==null || b==null? '' : fxHeatClass(fxHeat(b-a, [3,8,16]));
}
function heatLegend(){
  const n=el('div','heatkey');
  n.append(el('span','hu2','higher on him'), el('span','hd2','lower on him'));
  n.append(document.createTextNode(valScale==='league'
    ? ' than League Value, by the points his rank there is worth in this league. Darker is further apart; no shade is within 8 points.'
    : ' than League Value, by position rank. Darker is further apart; no shade is within 3 spots.'));
  return n;
}

function valSourceSelect(l, onPick){
  const lab=el('label','lbl'); lab.style.display='inline-flex'; lab.style.alignItems='center'; lab.style.gap='8px';
  lab.append(document.createTextNode('Source'));
  const sel=el('select','hz'); sel.setAttribute('aria-label','Value source');
  SRC_GROUPS.forEach(g=>{
    const og=document.createElement('optgroup'); og.label=g.label;
    valSources(l).filter(s=>srcGroup(s)===g.key).forEach(s=>{ const o=document.createElement('option'); o.value=s.id; o.textContent=valName(s); og.append(o); });
    if(og.children.length) sel.append(og);
  });
  sel.value=valSrcId(l);
  sel.onchange=()=>{ valSrc=sel.value; store.set('gd.val.src',sel.value); onPick? onPick() : render(); };
  lab.append(sel);
  return lab;
}
/** Tables of players offer all three views; team totals only the two that add up. */
const valScaleToggle = (withRank)=> segmented([{label:'League points',value:'league'}, ...(withRank? [{label:'Position rank',value:'rank'}] : []), {label:'Source’s own',value:'raw'}],
  !withRank && valScale==='rank'? 'league' : valScale, v=>{ valScale=v; store.set('gd.val.scale',v); render(); });

/** Every team in the league scored from one source, on the current view. */
function prScore(l, src){
  const uni=universe(scoringKey(l)), sf=prIsSF(l);
  const teams=l.teams.map(t=>({id:t.id, players:t.players.map(x=>{
    const p=uni.get(x.i)||{};
    return {id:x.i, pos:p.p, value:p.p? teamVal(p,src,sf) : null, inj:(p.dd&&p.dd.inj)||p.inj||null};
  })}));
  return prScoreTeams(teams, l.rosterSlots);
}

function pagePower(){
  const l=L(), out=[];
  const head=el('div','head');
  head.append(el('h1',null,'Power Rankings'));
  head.append(el('p',null,'Every roster in '+leagueLabel(l)+' scored from one rest-of-season source, League Value by default. Contender is the best lineup the team can start; Trade value is everything on the roster, bench included. In league points every player counts for what his rank in that source is worth here, so a team’s total means the same thing whichever source you pick.'));
  out.push(head);

  const id=valSrcId(l), S=valSource(l,id);
  if(!S){
    out.push(panel('Power rankings',null,emptyState('No rest-of-season data','Run `npm run sync -- --only projections`, then rebuild the dashboard.')));
    return out;
  }
  const sf=prIsSF(l);

  const bar=el('div','toggles');
  bar.append(valSourceSelect(l));
  bar.append(segmented([{label:'Contender',value:'contender'},{label:'Trade value',value:'trade'}], prSort, v=>{ prSort=v; store.set('gd.pr.sort',v); render(); }));
  bar.append(valScaleToggle(false));
  out.push(bar);

  const rows=prScore(l, S);
  const N=rows.length;
  if(!rows.some(r=>r.trade>0)){
    out.push(panel('Power rankings',null,emptyState('Nobody priced','No player in this league has a value in '+valName(S)+'. Try another source.')));
    return out;
  }
  const lt=id=> l.teams.find(t=>String(t.id)===String(id));
  const mineIds=new Set(myTeams(l).map(t=>String(t.id)));

  const D=l.dd;
  const from=Number(DATA.week)||1, to=((D&&D.playoffStartWeek)||15)-1;
  const sos=D&&D.schedule? prScheduleStrength(rows, D.schedule, {from, to}) : null;
  const sosOf=id=> sos? sos.find(x=>String(x.id)===String(id)) : null;
  const ppts=id=> D&&D.metrics&&D.metrics[String(id)]? D.metrics[String(id)].ppts : null;
  const hasPpts=l.teams.some(t=>ppts(t.id)!=null);

  const me=rows.find(r=>mineIds.has(String(r.id)));
  if(me){
    const strip=el('div','strip');
    strip.append(statTile('Contender','#'+me.contenderRank+' of '+N, PR_TIERS[me.tier], 'consensus'));
    strip.append(statTile('Trade value','#'+me.tradeRank+' of '+N, PR_TIERS[me.valueTier]+' by roster value'));
    if(me.needs.length) strip.append(statTile('Needs', me.needs.join(' · '), 'bottom third of the league','market'));
    const ms2=sosOf(me.id);
    if(ms2 && ms2.rank!=null) strip.append(statTile('Rest of schedule','#'+ms2.rank+' of '+N, '#1 is the hardest · '+ms2.games+' games, weeks '+from+'–'+to));
    out.push(strip);
  }

  const note=el('div','note');
  note.append(document.createTextNode((S.id==='lv'? 'League Value is priced for this league’s own lineup and bench'+(sf? ', superflex included' : '')+'; values are rest-of-season points over a replacement player. ' : S.label+' is read as a position rank and priced for this league’s lineup and bench'+(sf? ', superflex included' : '')+'. ')
    +'Players on IR, PUP or suspended stay out of the contender lineup. Kickers and defenses are unpriced and count as zero for every team.'));
  if(D && D.stale) note.append(Object.assign(el('span','pill out','schedule scores frozen at week '+D.scoredThrough),{title:'Dynasty Daddy serves a cached copy of this private ESPN league. Its pairings are right; its scores stopped at week '+D.scoredThrough+'. Set ESPN_S2 and ESPN_SWID in .env to refresh it.'}));
  out.push(note);

  const key=prSort==='trade'? 'trade' : 'contender';
  const sorted=rows.slice().sort((a,b)=> b[key]-a[key]);
  const top=Math.max(...rows.map(r=>r[key]))||1;
  const tierOf=r=> prSort==='trade'? r.valueTier : r.tier;
  const place=new Map(sorted.map((r,i)=>[r.id,i+1]));
  const nameOf=r=>{ const t=lt(r.id); return t? teamLabel(l,t) : 'Team '+r.id; };
  const two=(v,rk,o={})=> cell('num', null, Object.assign({stack:true, text:prFmt(v), sub:'#'+rk}, o));
  const cols=[
    {key:'n', label:'#', dir:'asc', sort:r=>place.get(r.id), cell:r=> cell('num', place.get(r.id), {d:0})},
    {key:'team', label:'Team', dir:'asc', sort:nameOf, cell:r=>{ const t=lt(r.id); return cell('team', {logo:t&&t.logo, name:nameOf(r)}); }},
    {key:'tier', label:'Tier', dir:'asc', sort:tierOf, cell:r=> cell('chip', null, {cls:'tierchip prt'+tierOf(r), text:PR_TIERS[tierOf(r)]})},
    {label:prSort==='trade'?'Roster value':'Lineup value', cell:r=> cell('bar', r[key]/top, {cls:'prt'+tierOf(r)})},
    {key:'contender', label:'Contender', r:1, sort:r=>r.contender, cell:r=> two(r.contender, r.contenderRank)},
    {key:'trade', label:'Trade value', r:1, sort:r=>r.trade, cell:r=> two(r.trade, r.tradeRank)},
    {key:'bench', label:'Bench', r:1, sort:r=>r.bench, cell:r=> cell('num', null, {text:prFmt(r.bench)})},
    ...PR_GROUPS.map(g=>({key:'g'+g, label:g, r:1, sort:r=>r.groups[g].value, cell:r=>{
      const c=two(r.groups[g].value, r.groups[g].rank);
      if(r.needs.includes(g)) c.querySelector('.ss').style.color='var(--bad)';
      return c;
    }}))
  ];
  if(sos) cols.push({key:'sos', label:'Schedule', r:1, dir:'asc', sort:r=>{ const so=sosOf(r.id); return so&&so.rank; }, cell:r=>{
    const so=sosOf(r.id);
    return cell('num', null, {text:so&&so.rank!=null? '#'+so.rank : FX_BLANK, title:'#1 is the hardest remaining schedule. '+(so&&so.mean!=null? 'Opponents average '+prFmt(so.mean)+' contender value over '+so.games+' games' : '')});
  }});
  if(hasPpts) cols.push({key:'ppts', label:'Max PF', r:1, sort:r=>ppts(r.id), cell:r=> cell('num', ppts(r.id))});
  out.push(panel(prSort==='trade'? 'By trade value' : 'By contender value', valName(S)+' · '+N+' teams',
    smallTable({id:'power|'+prSort, cols, rows:sorted, rowClass:r=> mineIds.has(String(r.id))? 'mine' : null})));
  // League Value beside every source it was built from.
  out.push(valTeamsMatrix(l, sorted.map(r=>r.id)));

  if(me){
    const uni=universe(scoringKey(l));
    const slotOf=x=> x.slot.includes('/')? (x.slot.includes('QB')? 'SF' : 'FLEX') : x.slot;
    const prOf=x=> x.id!=null? uni.get(Number(x.id)) : null;
    out.push(panel('Your contender lineup', valName(S), smallTable({id:'power-lineup', nopos:true, rows:me.lineup, cols:[
      {label:'Slot', cell:x=> cell('slot', slotOf(x))},
      {label:'Player', cell:x=>{ const pr=prOf(x); return pr? cell('player', pr) : cell('text', null, {text:x.id!=null? FX_BLANK : 'Empty'}); }},
      // Unpriced (a kicker, a defense) reads as a dash, not as a value of 0.
      {key:'v', label:'Value', r:1, sort:x=>{ const pr=prOf(x); return pr? teamVal(pr,S,sf) : null; }, cell:x=>{ const pr=prOf(x); return cell('num', null, {text:prFmt(pr? teamVal(pr,S,sf) : null)}); }},
      {key:'pr', label:'Position rank', r:1, dir:'asc', sort:x=>{ const pr=prOf(x), rk=pr&&valRanks(pr,S,sf); return rk&&rk.posRank; }, cell:x=>{
        const pr=prOf(x), rk=pr? valRanks(pr,S,sf) : null;
        return cell('num', null, {text:rk&&rk.posRank!=null? fxPosRank(pr.p, rk.posRank) : FX_BLANK});
      }}
    ]})));
  }
  return out;
}

/**
 * The league's teams in every source of one kind: each cell is the team's
 * lineup (or roster) total in that source, with its rank there underneath,
 * shaded by how far it sits from the team's League Value total. Read across a
 * row to see whether the sources agree about a team; the last column is how
 * far apart its best and worst rank are.
 */
function valTeamsMatrix(l, order){
  const ss=valSources(l);
  const key=prSort==='trade'? 'trade' : 'contender', rkKey=prSort==='trade'? 'tradeRank' : 'contenderRank';
  const scored=ss.map(s=>({s, rows:prScore(l,s)})).filter(x=>x.rows.some(r=>r.trade>0));
  const lvRows=(scored.find(x=>x.s.id==='lv')||{}).rows||[];
  const mineIds=new Set(myTeams(l).map(t=>String(t.id)));
  const ids=order || l.teams.map(t=>t.id);
  const at=(rows,id)=> rows.find(y=>String(y.id)===String(id));
  const range=id=>{ const rk=scored.filter(x=>x.s.id!=='lv').map(x=>at(x.rows,id)).filter(Boolean).map(x=>x[rkKey]); return rk.length? [Math.min(...rk), Math.max(...rk)] : null; };
  const cols=[
    {key:'team', label:'Team', dir:'asc', sort:id=>{ const t=l.teams.find(x=>String(x.id)===String(id)); return t? teamLabel(l,t) : ''; }, cell:id=>{
      const t=l.teams.find(x=>String(x.id)===String(id));
      return cell('team', {logo:t&&t.logo, name:t? teamLabel(l,t) : 'Team '+id});
    }},
    ...scored.map(({s,rows})=>({key:s.id, label:srcShort(s), title:srcTitle(s), r:1,
      band:SRC_GROUPS.find(g=>g.key===srcGroup(s)).label,
      sort:id=>{ const x=at(rows,id); return x? x[key] : null; },
      cell:id=>{
        const x=at(rows,id);
        if(!x) return dashCell();
        const c=stackCell(prFmt(x[key]), '#'+x[rkKey]);
        // Team totals differ from League Value's by a share of it, not by fixed points.
        const base=(at(lvRows,id)||{})[key];
        if(s.id!=='lv' && valScale!=='raw' && base) c.className+=fxHeatClass(fxHeat((x[key]-base)/base, [0.05,0.12,0.25]));
        if(s.id==='lv') c.classList.add('lvcol');
        return c;
      }})),
    {key:'range', label:'Rank range', r:1, title:'Best to worst rank across the sources (not League Value)', sort:id=>{ const r=range(id); return r&&r[1]-r[0]; },
      cell:id=>{ const r=range(id); return cell('num', null, {text:r? '#'+r[0]+'–#'+r[1] : FX_BLANK}); }}
  ];
  const body=el('div');
  // Wide (a column per source): the team stays in view while it scrolls.
  body.append(smallTable({id:'teams|'+prSort, cols, rows:ids, stick:1, rowClass:id=> mineIds.has(String(id))? 'mine' : null}));
  if(valScale!=='raw') body.append(heatLegend());
  return panel((prSort==='trade'? 'Trade value' : 'Contender value')+' in every source',
    (valScale==='raw'? 'each source’s own numbers, which do not compare across columns' : 'points over replacement in this league')+' · rank underneath', body);
}

/** What League Value assumed for this league: how deep each position is rostered, and where replacement sits. */
function lvPanel(l){
  const lv=lvFor(l), wrap=el('div'); wrap.style.padding='12px 14px'; wrap.style.display='grid'; wrap.style.gap='12px';
  const strip=el('div','strip');
  LV_POSITIONS.forEach(pos=>{
    const r=lv.replacement[pos];

    +'Players are ordered within each position by FantasyPros and Draft Sharks, one vote per site ('+lv.signals.map(s=>s.label+' '+Math.round(s.weight*100)+'%').join(', ')+'), given the per-game points that rank scores on the '+(pts.join(' and ')||'projection')+' curve in this league’s scoring times his own games left (byes differ), and valued over the replacement line for those games. ESPN, FanDuel and FantasyGuys are shown beside it, not counted. Open a player for the inputs.'));

      ...ss.map(s=>({

    const footer=[];

    Array.from(LIST.children).slice(1).forEach(n=>n.remove());
    LIST.append(grid({
      id:'values|'+valScale, cols, rows, footer, noun:'players',
      limit: teamView? null : 100, stick:1, rowClass:p=> valOwner(p).row || null,
      legend: valScale!=='raw'? heatLegend() : null,
      empty:['Nobody matches','Loosen the position, search or team filter.']

/* ---------- trade market ----------
   FantasyPros' trade market as its own page: what managers actually pay for a
   player, which way that price moved, and who else costs the same. The value
   is a price on a ~1000 scale, not a projection, so nothing here feeds the
   consensus. Every player comes from the same pool as the Players page, so a
   card's headshot, badge and team are the ones used everywhere else. */

let tradePos   = store.get('gd.tradePos','ALL');
let tradeSort  = store.get('gd.tradeSort','value');
let tradeQuery = '';
const TRADE_ROWS = 75;
let tradeGrad  = 0;

const svgEl=(tag, attrs, parent)=>{
  const n=document.createElementNS(SVGNS,tag);
  Object.entries(attrs||{}).forEach(([k,v])=> n.setAttribute(k,v));
  if(parent) parent.append(n);
  return n;
};
/** "Bhayshul Tuten" -> "B. Tuten", the way the similar-value cards label a player. */
const tmShortName = n=>{ const s=String(n||'').trim(), i=s.indexOf(' '); return i<0? s : s[0]+'. '+s.slice(i+1); };
const dayLabel = d=> new Date(d+'T00:00:00Z').toLocaleDateString('en-US',{month:'short',day:'numeric',timeZone:'UTC'});
const dayShort = d=> { const m=String(d).match(/^\d{4}-(\d{2})-(\d{2})$/); return m? (+m[1])+'/'+(+m[2]) : String(d); };
const dirOf = d=> d>0? 'up' : d<0? 'dn' : 'flat';

/**
 * A smooth line through the points. Catmull-Rom converted to cubic segments, with
 * every control point held inside [lo,hi] so a sharp turn cannot overshoot the
 * plot and draw a value the series never had.
 */
function smoothPath(pts, lo, hi){
  if(pts.length<2) return '';
  const cl=y=> Math.max(lo,Math.min(hi,y));
  let d='M'+pts[0][0].toFixed(1)+' '+pts[0][1].toFixed(1);
  for(let i=0;i<pts.length-1;i++){
    const p0=pts[i-1]||pts[i], p1=pts[i], p2=pts[i+1], p3=pts[i+2]||p2;
    const c1=[p1[0]+(p2[0]-p0[0])/6, cl(p1[1]+(p2[1]-p0[1])/6)];
    const c2=[p2[0]-(p3[0]-p1[0])/6, cl(p2[1]-(p3[1]-p1[1])/6)];
    d+=' C'+c1[0].toFixed(1)+' '+c1[1].toFixed(1)+' '+c2[0].toFixed(1)+' '+c2[1].toFixed(1)+' '+p2[0].toFixed(1)+' '+p2[1].toFixed(1);
  }
  return d;
}
/** Adds the gradient the area under a line fades through; returns its id. */
function areaGradient(svg){
  const id='tmg'+(++tradeGrad);
  const defs=svgEl('defs',null,svg), g=svgEl('linearGradient',{id, x1:'0', y1:'0', x2:'0', y2:'1'},defs);
  svgEl('stop',{offset:'0','stop-color':'currentColor','stop-opacity':'.20'},g);
  svgEl('stop',{offset:'1','stop-color':'currentColor','stop-opacity':'0'},g);
  return id;
}

/** The small filled trend line used in the table and on the cards. */
function areaSpark(vals, W, H){
  const pts=vals.map((v,i)=>[i,v]).filter(x=>x[1]!=null);
  const svg=svgEl('svg',{viewBox:'0 0 '+W+' '+H, width:W, height:H, 'aria-hidden':'true'});
  svg.setAttribute('class','areaspark');
  if(pts.length<2) return svg;
  const lo=Math.min(...pts.map(x=>x[1])), hi=Math.max(...pts.map(x=>x[1])), span=hi-lo;
  const padY=3, X=i=> (vals.length>1? i/(vals.length-1) : 0)*W;
  const Y=v=> span===0? H/2 : H-padY-((v-lo)/span)*(H-2*padY);
  const xy=pts.map(x=>[X(x[0]),Y(x[1])]);
  const id=areaGradient(svg);
  const line=smoothPath(xy,padY,H-padY);
  svgEl('path',{d:line+' L'+xy[xy.length-1][0].toFixed(1)+' '+H+' L'+xy[0][0].toFixed(1)+' '+H+' Z', fill:'url(#'+id+')'},svg);
  svgEl('path',{d:line, class:'ln'},svg);
  svg.setAttribute('class','areaspark '+dirOf(pts[pts.length-1][1]-pts[0][1]));
  return svg;
}

/**
 * Market Value History: a smooth line over dashed gridlines with a faded fill,
 * a dot on the latest day, and a tooltip that follows the pointer to the nearest
 * day. It draws exactly the days the payload carries; the y range is padded out
 * to round ticks so the line never touches the frame.
 */
function tmChart(p){
  const dates=tradeDates(), vals=p.tm.s||[];
  const pts=vals.map((v,i)=>[i,v]).filter(x=>x[1]!=null);
  const wrap=el('div','tmplot');
  if(pts.length<2){ wrap.append(el('p','note','Fewer than two days of history for him.')); return wrap; }
  const W=1000, H=290, pl=54, pr=18, pt=18, pb=36;
  const lo=Math.min(...pts.map(x=>x[1])), hi=Math.max(...pts.map(x=>x[1]));
  // Never finer than 5 a tick: a series that barely moves should read as barely
  // moving, not as a staircase of 1-point gridlines.
  const raw=Math.max(5,(hi-lo)/4);
  const step=[5,10,25,50,100,250].find(x=>x>=raw) || 500;
  let t0=Math.floor(lo/step)*step, t1=Math.ceil(hi/step)*step;
  // A flat (or near-flat) line is centred in the plot rather than pinned to an edge.
  if(t1-t0<2*step){ t0-=step; t1+=step; }
  const n=vals.length;
  const X=i=> pl+(n>1? i/(n-1) : 0)*(W-pl-pr);
  const Y=v=> pt+(1-(v-t0)/(t1-t0))*(H-pt-pb);
  const base=H-pb;
  const dir=dirOf(pts[pts.length-1][1]-pts[0][1]);
  wrap.classList.add(dir);

  const svg=svgEl('svg',{viewBox:'0 0 '+W+' '+H, role:'img',
    'aria-label':'Market value history: '+pts[0][1]+' on '+dayLabel(dates[pts[0][0]]||'')+' to '+pts[pts.length-1][1]+' on '+dayLabel(dates[pts[pts.length-1][0]]||'')});
  const id=areaGradient(svg);
  for(let v=t0; v<=t1; v+=step){
    svgEl('line',{x1:pl, x2:W-pr, y1:Y(v).toFixed(1), y2:Y(v).toFixed(1), class: v===t0? 'axis' : 'grid'},svg);
    const tx=svgEl('text',{x:pl-12, y:(Y(v)+4).toFixed(1), 'text-anchor':'end'},svg); tx.textContent=String(v);
  }
  for(let i=n-1;i>=0;i-=2){
    const tx=svgEl('text',{x:X(i).toFixed(1), y:H-10, 'text-anchor':'middle'},svg); tx.textContent=dayShort(dates[i]||'');
  }
  const xy=pts.map(x=>[X(x[0]),Y(x[1])]);
  const line=smoothPath(xy,pt,base);
  svgEl('path',{d:line+' L'+xy[xy.length-1][0].toFixed(1)+' '+base+' L'+xy[0][0].toFixed(1)+' '+base+' Z', fill:'url(#'+id+')'},svg);
  svgEl('path',{d:line, class:'ln'},svg);
  const last=xy[xy.length-1];
  const halo=svgEl('circle',{class:'halo', r:'11', cx:last[0].toFixed(1), cy:last[1].toFixed(1), visibility:'hidden'},svg);
  svgEl('circle',{class:'dot', r:'4.5', cx:last[0].toFixed(1), cy:last[1].toFixed(1)},svg);
  const mark=svgEl('circle',{class:'dot', r:'4.5', visibility:'hidden'},svg);
  wrap.append(svg);

  const tip=el('div','tmtip'); tip.hidden=true;
  const tipD=el('small'), tipV=el('b'), tipN=el('small');
  tip.append(tipD,tipV,tipN); wrap.append(tip);
  const show=ev=>{
    const r=svg.getBoundingClientRect(); if(!r.width) return;
    const x=(ev.clientX-r.left)/r.width*W;
    let best=pts[0], bd=Infinity;
    pts.forEach(q=>{ const d=Math.abs(X(q[0])-x); if(d<bd){ bd=d; best=q; } });
    const cx=X(best[0]), cy=Y(best[1]);
    mark.setAttribute('cx',cx.toFixed(1)); mark.setAttribute('cy',cy.toFixed(1));
    halo.setAttribute('cx',cx.toFixed(1)); halo.setAttribute('cy',cy.toFixed(1));
    mark.setAttribute('visibility','visible'); halo.setAttribute('visibility','visible');
    tipD.textContent=dayLabel(dates[best[0]]||''); tipV.textContent=String(best[1]);
    const tn=p.tm.n && p.tm.n[best[0]];
    tipN.textContent = tn!=null? tn+(tn===1?' trade':' trades') : '';
    tipN.hidden = tn==null;
    tip.style.left=(cx/W*r.width+10)+'px';
    tip.style.top=(cy/H*r.height+12)+'px';
    tip.hidden=false;
  };
  const hide=()=>{ tip.hidden=true; mark.setAttribute('visibility','hidden'); halo.setAttribute('visibility','hidden'); };
  svg.addEventListener('pointermove',show);
  svg.addEventListener('pointerdown',show);
  svg.addEventListener('pointerleave',hide);
  return wrap;
}

function tmArrow(dir){

function tmSimilar(pool, p){
  const sec=el('section','tmsec');
  const head=el('header'); head.append(el('h2',null,'Similarly Valued Players'), el('span','spacer'));
  const nav=el('div','tmnav');
  const arrow=(dir)=>{

    const s=svgEl('svg',{viewBox:'0 0 24 24','aria-hidden':'true'},bt); svgEl('path',{d: dir<0? 'M15 5l-7 7 7 7' : 'M9 5l7 7-7 7'},s);

  nav.append(prev,next); head.append(nav); sec.append(head);
  const cards=el('div','tmcards');

function pageTrade(){

  const meta=(DATA.trade||{})[scoringKey(l)];

  function buildRows(){

    else rows.sort((a,b)=>b.tm.v-a.tm.v);
    const cols=[
      {key:'name', label:'Player', w:330, dir:'asc', sort:p=>p.n||'', cell:p=>cell('player',p)},
      {key:'mkt', label:'Market', r:1, w:104, title:'What managers pay for him in trades, on a ~1000 scale', sort:p=>p.tm.v, cell:tmMarketCell},
      {key:'exp', label:'Experts', r:1, w:104, title:'What FantasyPros’ experts would pay, where published', sort:p=>p.tm.xv, cell:tmExpertCell},
      {key:'gap', label:'Value gap', r:1, w:92, title:'Expert value minus market value', sort:p=>p.tm.x, cell:tmGapCell},
      {key:'hist', label:'Market history', r:1, w:150, title:'Market value over the window', sort:move, cell:tmHistCell},
      {key:'vol', label:'Trades L10D', r:1, w:120, title:'Trades that involved him, per day', sort:p=> p.tm.n? p.tm.n.reduce((a,b)=>a+(b||0),0) : null, cell:tmVolCell},
      {label:'', r:1, w:122, cell:p=>{

    const host=LISTBOX;
    Array.from(host.children).slice(1).forEach(n=>n.remove());
    // The reference's layout: roomy rows that give the history chart room to read.
    host.append(grid({id:'trade|'+tradeSort, cols, rows, noun:'players', density:'roomy', limit:TRADE_ROWS,
      empty:['Nobody matches','Loosen the position, search or roster filter.']}));
  }

const NFL_NAMES={ARI:['Arizona','Cardinals'],ATL:['Atlanta','Falcons'],BAL:['Baltimore','Ravens'],BUF:['Buffalo','Bills'],
  CAR:['Carolina','Panthers'],CHI:['Chicago','Bears'],CIN:['Cincinnati','Bengals'],CLE:['Cleveland','Browns'],DAL:['Dallas','Cowboys'],
  DEN:['Denver','Broncos'],DET:['Detroit','Lions'],GB:['Green Bay','Packers'],HOU:['Houston','Texans'],IND:['Indianapolis','Colts'],
  JAC:['Jacksonville','Jaguars'],KC:['Kansas City','Chiefs'],LV:['Las Vegas','Raiders'],LAC:['Los Angeles','Chargers'],
  LAR:['Los Angeles','Rams'],MIA:['Miami','Dolphins'],MIN:['Minnesota','Vikings'],NE:['New England','Patriots'],
  NO:['New Orleans','Saints'],NYG:['New York','Giants'],NYJ:['New York','Jets'],PHI:['Philadelphia','Eagles'],
  PIT:['Pittsburgh','Steelers'],SF:['San Francisco','49ers'],SEA:['Seattle','Seahawks'],TB:['Tampa Bay','Buccaneers'],
  TEN:['Tennessee','Titans'],WAS:['Washington','Commanders']};

/**
 * Where each player finished at his position, from the weekly points every
 * player in the pool has stored: "w|id" -> "QB4", and "season|id" for the
 * season total so far. Players outside the pool are not counted, so a deep
 * finish can read a few spots high.
 */
const finishCache=new Map();
function posFinish(sc){
  if(finishCache.has(sc)) return finishCache.get(sc);
  const by=new Map(), add=(k,v,id)=>{ if(!by.has(k)) by.set(k,[]); by.get(k).push([v,id]); };
  (DATA.pools[sc]||[]).forEach(x=>{
    if(!x.act || !x.p) return;
    let tot=0;
    Object.entries(x.act).forEach(([w,v])=>{ if(v==null) return; tot+=Number(v); add(w+'|'+x.p, Number(v), x.i); });
    add('season|'+x.p, tot, x.i);
  });
  const out=new Map();
  by.forEach((arr,k)=>{ const [w,pos]=k.split('|'); arr.sort((a,b)=>b[0]-a[0]); arr.forEach(([,id],i)=> out.set(w+'|'+id, pos+(i+1))); });
  finishCache.set(sc,out);
  return out;
}

/**
 * Every week of his season: the opponent, the points he scored (green well
 * above his average, red well below) and where that finished at his
 * position. Weeks still to come show the opponent only — no per-week
 * projections past this one.
 */
function mdGameLog(p){
  const cur=Number(DATA.week)||1, fin=posFinish(scoringKey(L()));
  const rec=p.t && DATA.schedule && DATA.schedule.teams && DATA.schedule.teams[teamAbbr(p.t)];
  const last=Math.max(18, ...Object.keys((rec&&rec.weeks)||{}).map(Number).filter(Number.isFinite));
  const played=[]; for(let w=1; w<cur; w++){ const v=weekActual(p,w); if(v!=null && !isBye(p,w)) played.push(v); }
  const avg=played.length? played.reduce((a,b)=>a+b,0)/played.length : null;
  const rows=[];
  for(let w=1; w<=last; w++){
    const tr=el('tr', w===cur? 'curwk' : (w>cur? 'future' : null));
    tr.append(Object.assign(el('td','r num'),{textContent:String(w)}));
    const bye=p.t && isBye(p,w);
    tr.append(Object.assign(el('td','r num'),{textContent: p.t? oppLabel(p,w) : '—'}));
    const v= w<=cur && !bye? weekActual(p,w) : null;
    const pt=el('td','r num');
    if(v==null) pt.textContent='—';
    else {
      const hot=avg && v>=avg*1.25? 'hu1' : (avg && v<=avg*0.75? 'hd1' : null);
      pt.append(hot? el('span','hc '+hot, fmt(v)) : document.createTextNode(fmt(v)));
      pt.dataset.v=String(v);
    }
    tr.append(pt);
    tr.append(Object.assign(el('td','r num'),{textContent: v!=null? (fin.get(w+'|'+p.i)||'—') : '—'}));
    rows.push(tr);
  }
  const sec=mdSection('Game Logs', el('span','tmwin', (DATA.season||'')+' season'));
  sec.append(table([{label:'Wk',r:1},{label:'Opp',r:1},{label:'Fpts',r:1},{label:'Finish',r:1}], rows));
  return sec;
}

function mdProjections(p){
  const wkH=parseHz('w-'+DATA.week), rosH=parseHz('ros');
  const cols=[{label:'Source'},{label:'Week '+DATA.week,r:1},{label:'Rest of season',r:1},{label:'Floor\u2013ceiling',r:1}];
  const rows=[];
  ['fp','ds'].forEach(k=>{
