<!DOCTYPE html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gridiron Desk</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap">
<style>
:root{
  /* The table system (docs/components.md §3.9): dark is the default theme and
     light is the same tokens re-valued, so nothing below names a hex for one
     theme only. Poppins at 400/500/600 throughout; there is no bold. */
  --font:"Poppins",Arial,Helvetica,sans-serif;
  --ground:#12161F; --surface:#29304A; --surface-2:#222A3E; --line:#3A4360; --line-strong:#424B69;
  --ink:#E6E9EF; --ink-2:#B9C0CC; --muted:#8F98AA;
  /* names, the secondary line (team, sub-line), the header bar and its ink */
  --ink-name:#EEF1F6; --ink-3:#A9B1BF; --th-bg:#222A3E; --th-ink:#B9C0CC;
  --market:#E0A445; --market-soft:#3A2C14;
  --consensus:#5AA2FF; --consensus-soft:#122A4E;
  --good:#5FC095; --good-soft:#15302690; --warn:#D9A038; --bad:#E2786D; --bad-soft:#37211F;
  --gold:#FACD39; --gold-ink:#16191D;
  --shadow:0 1px 3px rgba(0,0,0,.35);
  /* row states */
  --row-hover:#353E5A; --row-sel:#2C3656; --row-sel-edge:#4E9AEB; --row-you:#24365A; --you-ink:#0B1A30;
  --row-exp:#323B58; --row-tray:#232A40; --row-fa:rgba(126,226,184,.08); --row-wv:rgba(250,205,57,.05);
  --link-hover:#7FB2EE; --sort-on:#FACD39;
  /* owner badge: someone else's team, a free agent, on waivers */
  --ob-bg:#3A4360; --ob-ink:#CFD4DC; --ob-fa-bg:rgba(126,226,184,.16); --ob-fa-ink:#7EE2B8;
  --ob-wv-bg:rgba(250,205,57,.18); --ob-wv-ink:#F3D67A;
  /* status tags: BYE yellow, OUT/IR coral */
  --st-bye:#FACD39; --st-out:#FD9891; --st-ink:#16191D;
  /* shaded value cells, strong-up to strong-down */
  --heat-u2:#1F5A50; --heat-u1:#1C3F43; --heat-d1:#3E2B38; --heat-d2:#5E3239;
  /* the two rails: a dark chrome, unchanged by the light/dark page theme */
  --rail-bg:#050E20; --rail-bg-2:#0A1A36; --rail-ink:#B9C6DC; --rail-ink-hi:#FFFFFF; --rail-line:rgba(255,255,255,.10);
  --rail1:76px; --rail2:208px; --rail:calc(var(--rail1) + var(--rail2));
  /* FantasyPros' player-position palette: pastel fills carrying dark navy ink,
     so a badge stays legible without going neon. Flex/superflex are ours. */
  --p-qb:#C8A1FF; --p-rb:#83DCEF; --p-wr:#85DE9E; --p-te:#FF8AA2;
  --p-k:#FDB97C; --p-dst:#BDC3CD; --p-flex:#7FD1D8; --p-sf:#FFB3D1; --p-bn:#EBEEF4; --p-ir:#FD9891;
  --pos-ink:#13284A;
  /* position chip text: the hue pulled toward the page ink, so a pastel stays legible on its own wash */
  --pos-tx-base:#fff; --pos-tx-mix:85%;
  /* One scale for corners and control heights, so a button, a select, a chip
     and a search box sitting on the same row line up instead of each page
     having picked its own. */
  --r-sm:7px; --r:10px; --r-lg:14px; --ctl-h:32px;
}
:root[data-theme="light"]{
  --ground:#DFE4EC; --surface:#FFFFFF; --surface-2:#F3F5F9; --line:#E2E7EE; --line-strong:#D6DCE5;
  --ink:#262B33; --ink-2:#525A67; --muted:#868B95;
  --ink-name:#1F242C; --ink-3:#868B95; --th-bg:#F3F5F9; --th-ink:#525A67;
  --market:#9A6410; --market-soft:#F7EBD3;
  --consensus:#0769DE; --consensus-soft:#E4EEFC;
  --good:#127A52; --good-soft:#DAF0E6; --warn:#96600B; --bad:#B5382E; --bad-soft:#F9E2DF;
  --shadow:0 1px 3px rgba(22,25,29,.10);
  --row-hover:#F3F5F9; --row-sel:#EEF5FD; --row-sel-edge:#0769DE; --row-you:#E9F1FD; --you-ink:#FFFFFF;
  --row-exp:#F3F5F9; --row-tray:#F9FAFC; --row-fa:#EEF9F3; --row-wv:#FFFAEE;
  --link-hover:#025AB6; --sort-on:#0769DE;
  --ob-bg:#EBEEF4; --ob-ink:#525A67; --ob-fa-bg:#D4F1E5; --ob-fa-ink:#1C8157;
  --ob-wv-bg:#F7EDCE; --ob-wv-ink:#7A5C00;
  --st-bye:#F6E5AB;
  --heat-u2:#C4EBDB; --heat-u1:#E3F5EE; --heat-d1:#FBE8E6; --heat-d2:#F5CFCA;
  --rail-bg:#081D3F; --rail-bg-2:#0B2650;
  --p-flex:#A9E6EE;
  --pos-tx-base:#000; --pos-tx-mix:50%;
}
/* ---------- type ----------
   One scale, borrowed from the command palette and the player card: a 13px
   body and title, an 11px muted line under it, a small-caps eyebrow over a
   group, and a few display sizes for numbers. Every size in this sheet is one
   of these; a new rule picks a token rather than a pixel value. */
:root{
  --fs-2xs:10px;   /* chips, tiny tags */
  --fs-label:10px; /* the eyebrow (below) */
  --fs-xs:11px;    /* the muted line under a title; meta */
  --fs-sm:12.5px;  /* controls, notes, secondary text */
  --fs-base:13px;  /* body, table cells, nav, item titles */
  --fs-md:14.5px;  /* card titles */
  --fs-lg:17px;    /* section titles */
  --fs-xl:20px;    /* card numbers */
  --fs-2xl:22px;   /* page titles, headline numbers */
  --track:.08em;   /* every uppercase label */
  --fs-th:12px;    /* table headers */
  --fs-num:12px;   /* numbers and ranks in a table */
  --fs-name:14px;  /* a player's name in a table */
}
*{box-sizing:border-box}
body{margin:0;background:var(--ground);color:var(--ink);font-family:var(--font);font-size:var(--fs-base);line-height:1.5;-webkit-font-smoothing:antialiased}
td,th,.stat .v,.num{font-variant-numeric:tabular-nums}
h1,h2,h3{font-family:var(--font);font-weight:600;letter-spacing:-.01em;text-wrap:balance;margin:0}
h1{font-size:var(--fs-2xl);line-height:1.15}
h2{font-size:var(--fs-xl);line-height:1.2}
h3{line-height:1.3;color:var(--muted)}
a{color:var(--consensus)}
/* The eyebrow: the one small-caps label — table heads, panel and section
   titles, stat keys, filter captions. It was fourteen rules with five sizes
   and four letter-spacings; colour and spacing stay with each rule. */
h3,
.rsw-cap,
label.lbl,
.stat .k,
.muband,
.pm-kpi .k,
.tmstat .k,
.tneeds .lbl,
.fgroup .ftitle,
.fsel .ftitle,
.cp-sec,
.eyebrow{font-size:var(--fs-label);font-weight:600;text-transform:uppercase;letter-spacing:var(--track);line-height:1.3}

/* Columns of numbers still need to line up; they do not need to look like a
   receipt. Tabular figures give the alignment on the same face as the rest of
   the page, so a table reads as one design instead of two. */
.num{font-variant-numeric:tabular-nums;letter-spacing:0}

/* shell */
.shell{display:grid;grid-template-columns:var(--rail) 1fr;min-height:100vh}
.rail{background:var(--surface);display:flex;position:sticky;top:0;height:100vh}
/* Two tiers. The narrow navy one picks a GROUP of pages and never changes
   width; the wide one lists that group's pages, with the league switcher pinned
   above them because one league is "current" for every page in every group. */
.rail1{width:var(--rail1);flex:none;background:var(--rail-bg);display:flex;flex-direction:column;align-items:center;gap:6px;padding:14px 8px;overflow-y:auto}
.rail2{flex:1;min-width:0;display:flex;flex-direction:column;gap:18px;padding-block:16px;padding-inline:12px;overflow-y:auto;border-right:1px solid var(--line)}
.brandmark{display:flex;flex-direction:column;align-items:center;gap:3px;margin-bottom:10px;line-height:1}
.brandmark b{font-size:var(--fs-xl);font-weight:600;letter-spacing:.02em;color:var(--rail-ink-hi)}
.brandmark span{font-size:9px;font-weight:600;text-transform:uppercase;letter-spacing:.1em;color:var(--gold)}
.gtile{all:unset;box-sizing:border-box;cursor:pointer;position:relative;width:60px;aspect-ratio:1;border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;color:var(--rail-ink);font-size:var(--fs-2xs);font-weight:500;letter-spacing:.02em;transition:background .12s,color .12s}
.gtile svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.gtile:hover{background:rgba(255,255,255,.08);color:var(--rail-ink-hi)}
.gtile[aria-current="true"]{background:var(--consensus);color:#fff;font-weight:600;box-shadow:0 4px 12px rgba(7,105,222,.45)}
.gtile:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
/* a group can be closed and still need you: pending League Setup edits */
.gtile .gdot{position:absolute;top:7px;right:8px;width:8px;height:8px;border-radius:50%;background:var(--gold);box-shadow:0 0 0 2px var(--rail-bg)}
.rail2-title{margin:0 0 6px;padding-inline:10px}
#nav{display:flex;flex-direction:column;gap:18px}
.navsec{display:flex;flex-direction:column;gap:2px}
.navsec .rail2-title{margin:0 0 4px}
/* The single-page options sit at the foot of the first rail, and their page gets the width. */
.gtile.first-foot{margin-top:auto}
.shell.solo{grid-template-columns:var(--rail1) 1fr}
.shell.solo .rail2{display:none}
#nav button{all:unset;cursor:pointer;padding:8px 10px;border-radius:8px;font-size:var(--fs-base);font-weight:500;color:var(--ink-2);display:flex;justify-content:space-between;align-items:center;gap:8px;position:relative}
#nav button:hover{background:var(--surface-2);color:var(--ink)}
#nav button[aria-current="true"]{background:var(--consensus-soft);color:var(--consensus);font-weight:600}
#nav button[aria-current="true"]::before{content:'';position:absolute;left:-12px;top:8px;bottom:8px;width:3px;border-radius:0 3px 3px 0;background:var(--consensus)}
#nav button:focus-visible{outline:2px solid var(--consensus);outline-offset:1px}
#nav .tag{font-size:var(--fs-xs);font-weight:500;color:var(--muted);font-variant-numeric:tabular-nums;background:var(--surface-2);padding:1px 7px;border-radius:99px}
#nav button[aria-current="true"] .tag{background:var(--surface);color:var(--consensus)}
.rail-foot{margin-top:auto;font-size:var(--fs-xs);color:var(--muted);display:flex;flex-direction:column;gap:4px;line-height:1.45}

.main{min-width:0;display:flex;flex-direction:column}
.topbar{border-bottom:1px solid var(--line);background:var(--surface);padding-block:10px;padding-inline:24px;display:flex;flex-wrap:wrap;gap:12px 18px;align-items:center;position:sticky;top:0;z-index:5}
/* league switcher — the permanent rail control above the page tabs: one league
   is "current" for every page, so the switcher sits above them, not beside one */
.railswitch{position:relative}
.rsw-btn{all:unset;box-sizing:border-box;cursor:pointer;display:flex;align-items:center;gap:10px;width:100%;
  background:var(--surface);border:1px solid var(--line-strong);border-radius:12px;padding:9px 10px;box-shadow:var(--shadow);transition:border-color .12s}
.rsw-btn:hover,.rsw-btn[aria-expanded="true"]{border-color:var(--consensus)}
.rsw-btn:focus-visible{outline:2px solid var(--consensus);outline-offset:1px}
.rsw-txt{display:flex;flex-direction:column;gap:1px;min-width:0;flex:1;text-align:left}
.rsw-name{font-weight:600;font-size:var(--fs-base);color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.25}
.rsw-chev{color:var(--muted);flex:none;width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;transition:transform .15s}
.rsw-btn[aria-expanded="true"] .rsw-chev{transform:rotate(180deg)}
.rsw-sub{display:flex;align-items:center;gap:5px;font-size:var(--fs-xs);color:var(--muted);text-align:left;white-space:nowrap;overflow:hidden}
.rsw-sub .dot{color:var(--line-strong)}
.rsw-panel{position:absolute;top:calc(100% + 6px);left:0;right:0;z-index:20;background:var(--surface);
  border:1px solid var(--line-strong);border-radius:12px;box-shadow:0 10px 30px rgba(8,29,63,.18);padding:6px;
  display:flex;flex-direction:column;gap:2px;max-height:60vh;overflow-y:auto}
.rsw-cap{color:var(--muted);padding:4px 8px 2px}
.rsw-item{all:unset;box-sizing:border-box;cursor:pointer;display:flex;align-items:center;gap:9px;
  padding:7px 8px;border-radius:8px;width:100%}
.rsw-item:hover{background:var(--surface-2)}
.rsw-item:focus-visible{outline:2px solid var(--consensus);outline-offset:-2px}
.rsw-item.current{background:var(--consensus-soft)}
.rsw-item .rsw-txt{gap:0}
.rsw-item-name{font-size:var(--fs-sm);font-weight:600;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rsw-item.current .rsw-item-name{color:var(--consensus)}
.rsw-item-meta{font-size:var(--fs-xs);color:var(--muted)}
.rsw-tick{width:14px;height:14px;flex:none;fill:none;stroke:var(--consensus);stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
label.lbl{color:var(--muted)}
/* Every text control shares one box: height, corner, border, fill. */
select,.psearch,.fld input[type=text],.fld input[type=number],.fld select,.wnum,.pname .txtin{
  font-family:inherit;font-size:var(--fs-sm);color:var(--ink);background:var(--surface);
  border:1px solid var(--line-strong);border-radius:var(--r-sm);min-height:var(--ctl-h);padding:4px 10px}
select{max-width:min(300px,60vw);cursor:pointer}
select.hz{max-width:220px}
select:hover,.psearch:hover{border-color:color-mix(in srgb,var(--consensus) 45%,var(--line-strong))}
select:focus-visible{outline:2px solid var(--consensus);outline-offset:1px}
.spacer{flex:1}
.wk{font-size:var(--fs-xs);color:var(--muted)}
/* One button. `.iconbtn` is the older name for the same thing; `.primary`,
   `.danger` and `.sm` are the only variants. */
.btn,.iconbtn{all:unset;box-sizing:border-box;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:7px;height:var(--ctl-h);padding:0 13px;
  border-radius:var(--r-sm);border:1px solid var(--line-strong);background:var(--surface);font-size:var(--fs-sm);font-weight:500;color:var(--ink-2);white-space:nowrap;transition:background .12s,border-color .12s}
.btn:hover,.iconbtn:hover{background:var(--surface-2);color:var(--ink)}
.btn:focus-visible,.iconbtn:focus-visible{outline:2px solid var(--consensus);outline-offset:2px}
.btn.primary{background:var(--consensus);border-color:var(--consensus);color:#fff;font-weight:600}
.btn.primary:hover{background:color-mix(in srgb,var(--consensus) 86%,#000);color:#fff}
.btn.danger{color:var(--bad)}
.btn.sm{height:28px;padding:0 10px;font-size:var(--fs-xs)}
.btn[disabled]{opacity:.5;cursor:default;pointer-events:none}
.btn svg{width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.page{padding-block:16px 40px;padding-inline:24px;display:flex;flex-direction:column;gap:14px;max-width:1480px;width:100%}

/* pieces */
.head{display:flex;flex-direction:column;gap:3px}
.head .eyebrow{color:var(--consensus);margin-bottom:2px}
.head .titlerow{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.head p{margin:0;color:var(--muted);font-size:var(--fs-base);max-width:70ch}
.strip{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;box-shadow:var(--shadow)}
.stat{background:var(--surface);padding:14px 16px;display:flex;flex-direction:column;gap:4px}
.stat .k{color:var(--muted)}
.stat .v{font-size:var(--fs-2xl)}
/* Headline numbers, wherever they sit: the stat strip, the player card, the
   trade market, a team's standing on All Leagues. */
.stat .v,.pm-kpi .v,.tmstat .v,.lgrank b{font-weight:600;line-height:1.15;letter-spacing:-.01em;font-variant-numeric:tabular-nums}
.stat .s{font-size:var(--fs-xs);color:var(--muted)}
.v.market{color:var(--market)} .v.consensus{color:var(--consensus)}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden}
.panel>header{min-height:38px;padding:6px 14px;border-bottom:1px solid var(--line);background:var(--surface);display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.panel>header h3{margin:0;color:var(--ink)}
.panel>header .note{font-size:var(--fs-xs)}
.panel>header .spacer{flex:1}
.pbody{padding:14px 16px}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:20px;align-items:start}

.scroll{overflow-x:auto;scrollbar-width:thin;scrollbar-color:var(--line-strong) transparent}
table{border-collapse:separate;border-spacing:0;width:auto;font-size:var(--fs-num);--row-h:38px}
/* A column is sized to its content (docs/components.md §3.9): a column's
   width `w` is its floor, never a clip, so a one-row header such as
   "League value" is never cut. Frozen columns pin theirs (see grid). */
table.fixed{table-layout:auto}
.srcth{display:flex;flex-direction:column;align-items:flex-end;gap:2px;line-height:1}
.srcth img{width:13px;height:13px;object-fit:contain;border-radius:3px}
.srcth b{font-size:var(--fs-2xs);font-weight:600;letter-spacing:.06em;color:var(--ink-2)}
th.r .srcth{align-items:center}
/* ---------- the table system (docs/components.md §3.9) ----------
   One look for every table, from the approved boards: a card that hugs its
   columns, ONE header row on a filled header bar (12px/500, sentence case),
   hairline row rules and nothing else — no vertical column lines, no zebra,
   no grouped two-row header. Numbers and ranks are 12px/500 tabular and
   centred; text and the player are left. Row height is the view's
   (--row-h) and the cell is padded 0 8px, so a column is as wide as its data. */
th{height:34px;padding:0 var(--cell-px,8px);font-size:var(--fs-th);font-weight:500;color:var(--th-ink);background:var(--th-bg);
  text-align:left;vertical-align:middle;white-space:nowrap;border-bottom:1px solid var(--line-strong)}
td{height:var(--row-h);padding:0 var(--cell-px,8px);border-bottom:1px solid var(--line);white-space:nowrap;vertical-align:middle;
  font-size:var(--fs-num);font-weight:500;color:var(--ink)}
td.bandsep,.tsep{border-left:0}
table.roomy{--row-h:64px}
/* Two views of every table, one switch for them all (<html data-tv>, see
   tableViewSwitch). Both are plain tables on hairline rules — a row is never a
   card; a single player's card is its own component (the modal). Comfortable
   has 46px rows, a 30px headshot and position and team on a second line under
   the name. Compact is one line with no headshot: the team's abbreviation
   trails the name. Who rosters him is its own Owner column, not part of the name. */
:root[data-tv="comfortable"] table{--row-h:46px}
:root[data-tv="comfortable"] table.roomy{--row-h:64px}
:root[data-tv="comfortable"] td{font-size:var(--fs-base)}
:root[data-tv="comfortable"] .pid{gap:7px}
:root[data-tv="comfortable"] .pid .who{display:grid;grid-template-columns:auto auto;justify-content:start;align-items:center;column-gap:5px;row-gap:0;line-height:1.25}
:root[data-tv="comfortable"] .pid .who>.prt{grid-row:2;grid-column:1/-1}
:root[data-tv="comfortable"] .pid .plink,:root[data-tv="comfortable"] td .nm b{font-size:var(--fs-base);font-weight:600;color:var(--ink)}
:root[data-tv="comfortable"] .pid .av .lg{display:none}
:root[data-tv="comfortable"] td .nm small{font-size:var(--fs-xs);letter-spacing:0;color:var(--muted)}
:root[data-tv="comfortable"] .pid .av{width:30px;height:30px}
/* Position (comfortable only) and team abbreviation, in the Matchup page's team-tag type. */
.pid .who>.prt{display:inline-flex;align-items:center;gap:4px;font-size:var(--fs-2xs);font-weight:600;letter-spacing:.04em;color:var(--muted);white-space:nowrap;flex:none}
/* Comfortable reads the position off the subtext, so the badge before the headshot goes; compact keeps the badge. */
:root[data-tv="comfortable"] .pid:not(.roster)>.pos{display:none}
:root[data-tv="compact"] .pid .who>.prt>.tpos,table.nopos .pid .who>.prt>.tpos{display:none}
.pid .who2>.prt{font-size:var(--fs-xs);font-weight:500;color:var(--ink-3);white-space:nowrap}
.pid .prt:empty{display:none}
:root[data-tv="compact"] table{--row-h:30px;--cell-px:6px}
:root[data-tv="compact"] table.roomy{--row-h:44px}
:root[data-tv="compact"] th{height:30px}
:root[data-tv="compact"] td .pid>.av,:root[data-tv="compact"] td .pl>.av,:root[data-tv="compact"] td .pl>.tav{display:none}
:root[data-tv="compact"] td .stack{flex-direction:row-reverse;align-items:baseline;justify-content:center;gap:6px}
:root[data-tv="compact"] .pid{gap:5px}
:root[data-tv="compact"] .pid .who{align-items:center;gap:6px}
:root[data-tv="compact"] .pid .who2,:root[data-tv="compact"] td .nm{flex-direction:row;align-items:baseline;gap:6px}
:root[data-tv="compact"] .pid .plink{font-size:var(--fs-base);font-weight:600;color:var(--ink)}
:root[data-tv="compact"] .pid .who2>.l1{display:contents}
:root[data-tv="compact"] .pid .who2 .st{order:1}
:root[data-tv="compact"] .hc{height:20px}
tbody tr:last-child>td{border-bottom:0}
td.r,th.r{text-align:center}
td.r .stack{align-items:center}
th.r .sorth{justify-content:center;width:100%}
/* A row's states, strongest last: hover, then yours / free agent / waivers,
   then selected and expanded. The state is a variable every cell paints,
   so a frozen cell (which must stay opaque) layers it over the card. */
td{background:var(--cell-bg,var(--card,transparent))}
table tbody tr:hover{--cell-bg:var(--row-hover)}
table tbody tr.mine,table tbody tr.you{--cell-bg:var(--row-you)}
table tbody tr.fa{--cell-bg:var(--row-fa)}
table tbody tr.wv{--cell-bg:var(--row-wv)}
table tbody tr.mine:hover,table tbody tr.you:hover,table tbody tr.fa:hover,table tbody tr.wv:hover{--cell-bg:var(--row-hover)}
table tbody tr.sel{--cell-bg:var(--row-sel)}
table tbody tr.sel>td:first-child{box-shadow:inset 3px 0 0 var(--row-sel-edge)}
table tbody tr.exp{--cell-bg:var(--row-exp)}
table tbody tr.exp>td{border-bottom:0}
table tbody tr.tray,table tbody tr.tray:hover{--cell-bg:var(--row-tray)}
table tbody tr.tray>td{height:auto;padding:12px 16px 14px 64px;text-align:left;white-space:normal}
table tbody tr:hover .plink{color:var(--link-hover)}
tr[data-xp]{cursor:pointer}
/* the detail tray under an expanded row */
.tray-in{display:flex;gap:32px;align-items:flex-end;flex-wrap:wrap}
.tk{display:flex;flex-direction:column;gap:2px}
.tk b{font-size:var(--fs-2xs);font-weight:500;letter-spacing:.04em;color:var(--muted);text-transform:uppercase}
.tk span{font-size:var(--fs-sm);font-weight:500;color:var(--ink-name)}
.tk .tkdim{color:var(--muted);font-weight:400}
.wbars{display:inline-flex;align-items:flex-end;gap:2px;height:18px}
.wbars i{display:block;width:5px;border-radius:1px;background:var(--row-sel-edge)}
/* Section dividers (Bench, Injured reserve, a playoff cut): a small muted
   label over a thin rule, never a filled band. */
table tbody tr.sec>td,table tbody tr.grouphdr>td,table tbody tr.cutrow>td{height:20px;font-size:var(--fs-2xs);font-weight:500;
  letter-spacing:.04em;text-transform:uppercase;color:var(--muted);text-align:left;padding:6px 0 0 16px;border-top:1px solid var(--line);border-bottom:0}
table tbody tr.grouphdr>td .slotcell{gap:8px}
table tbody tr.totrow>td{border-top:1px solid var(--line-strong);font-weight:500}
table tbody tr.sec,table tbody tr.grouphdr,table tbody tr.cutrow,table tbody tr.totrow{--cell-bg:transparent}
/* sortable headers: dim up/down arrows; the sorted column's arrow is the accent */
.sorth{display:inline-flex;align-items:center;gap:5px}
.sorth svg{flex:none;opacity:.5}
th.sortable{cursor:pointer;user-select:none}
th.sortable:hover,th.sorted{color:var(--ink-name)}
th.sorted .sorth svg{opacity:1}
th.sortable:focus-visible{outline:2px solid var(--consensus);outline-offset:-2px}
.sorth .info{display:inline-flex;align-items:center;justify-content:center;width:13px;height:13px;border-radius:50%;
  border:1px solid var(--muted);color:var(--muted);font-size:9px;font-weight:600;line-height:1;cursor:help}
/* Frozen headers. A table that fits scrolls with the page; a taller one
   scrolls inside its card with the header pinned. */
.scroll:has(>table.fixed){max-height:max(360px,calc(100vh - 150px));overflow:auto}
table.fixed thead th{position:sticky;top:0;z-index:2}
/* DataGrid (docs/components.md §3.1): the same frozen header for any width,
   identity column(s) frozen on the left always. */
.dg-bar{display:flex;align-items:center;gap:6px;padding:10px 14px 8px;flex-wrap:wrap}
.dg-bar .spacer{flex:1}
.dg-bar .pcount{margin-right:10px}
.scroll.dg-scroll{max-height:max(420px,calc(100vh - 170px));overflow:auto}
table.dg thead th{position:sticky;top:0;z-index:2}
table.dg .stk{position:sticky;z-index:1;background:linear-gradient(var(--cell-bg,transparent),var(--cell-bg,transparent)),var(--card,var(--surface))}
table.dg thead .stk{z-index:3;background:var(--th-bg)}
table.dg tr.cutrow td{height:auto}
table.dg.roomy td .av{width:36px;height:36px}
.dg-more{margin:12px 14px}
/* The view switch: Comfortable / Compact, the same pill on every table. */
.seg.dens{height:auto;gap:2px;padding:3px;border-radius:99px;background:var(--ground);border:1px solid var(--line-strong)}
.seg.dens button{height:24px;padding:0 12px;border:0;border-radius:99px;background:transparent;font-size:var(--fs-xs);font-weight:500;color:var(--ink-3)}
.seg.dens button+button{border-left:0}
.seg.dens button:hover{background:transparent;color:var(--ink-name)}
.seg.dens button[aria-pressed="true"]{background:var(--row-hover);color:var(--ink-name);font-weight:500;box-shadow:0 1px 2px rgba(0,0,0,.12)}
/* A card around a table hugs it; past the page width the table scrolls inside it. */
.panel:has(>.scroll>table),.panel:has(>div>.dg-wrap),.panel:has(>.dg-wrap){width:fit-content;max-width:100%}
.panel:has(>.scroll>table)>header,.panel:has(.dg-wrap)>header{background:var(--surface)}
td .av{width:28px;height:28px}
/* Lean (docs/components.md §3.2): one line per row. A number's rank sits
   beside it in the secondary ink ("178.3  RB 9"), and the kickoff a lean row
   drops from the opponent cell stays on its hover. */
table.lean .stack{flex-direction:row-reverse;align-items:baseline;justify-content:center;gap:6px}
table.lean .stack .ss{font-size:var(--fs-num);font-weight:500;color:var(--ink-3)}
table.lean .oppwrap>.ss{display:none}
/* ...except a comfortable lineup, whose Opp column has room for kickoff under the opponent. */
:root[data-tv="comfortable"] table.roster .oppwrap>.ss{display:block;font-size:9px;font-weight:500;color:var(--muted)}
/* The opponent: centred and muted, like the board's. */
td.opp{color:var(--ink-2)}
td.bye{color:var(--bad);font-weight:600}
td.opp .oppwrap,td.opp .oppline{align-items:center;justify-content:center}
/* A table of one position does not repeat the badge on every row. */
table.nopos .pid>.pos{display:none}
/* In the Overview's side column the name gives way first, rather than push the numbers off the panel. */
.teamrail table.lean td:first-child{max-width:0;width:100%}
/* ...which only works if the panel has a width to give: a rail panel that
   hugs its table squeezed the names to one letter. */
.teamrail .panel:has(table){width:auto}
.teamrail table.lean{width:100%}
/* ---------- the player identity (one line) ----------
   position badge → 28px headshot with the NFL logo on its corner → name →
   NFL team → status tag. A roster leads with the lineup slot instead and
   keeps a "POS - TEAM" line under the name; the all-players grid leads with
   a muted overall rank in its own column. */
.pid{display:flex;align-items:center;gap:8px;min-width:0;padding-left:4px}
.pid .av{width:28px;height:28px;margin-left:2px}
.pid .avf{background:var(--line-strong)}
.av .lg{position:absolute;left:-4px;bottom:-2px;width:13px;height:13px;object-fit:contain;filter:drop-shadow(0 0 1.5px rgba(0,0,0,.7))}
:root[data-theme="light"] .av .lg{filter:drop-shadow(0 0 1.5px rgba(0,0,0,.2))}
.pid .who{display:flex;align-items:baseline;gap:6px;min-width:0;margin-left:2px}
.pid .who2{display:flex;flex-direction:column;min-width:0;line-height:1.2}
.pid .l1{display:flex;align-items:center;gap:6px;min-width:0}
.pid .plink{font-size:var(--fs-name);font-weight:500;color:var(--ink-name);line-height:1.2}
.pid .plink:hover{text-decoration:none}
.pid .tm{flex:none;font-size:var(--fs-xs);font-weight:500;color:var(--ink-3);letter-spacing:.02em}
.pid .sub{font-size:11.5px;line-height:1.3;color:var(--ink-3);font-weight:400;letter-spacing:.02em}
.pid.roster{gap:10px}
.pid .dim{opacity:.5}
.st{flex:none;align-self:center;display:inline-flex;align-items:center;height:16px;padding:0 5px;border-radius:4px;
  font-size:var(--fs-2xs);font-weight:600;letter-spacing:.02em;line-height:1;color:var(--st-ink);background:var(--st-bye)}
.st.out{background:var(--st-out)}
.st.q{background:var(--ob-wv-bg);color:var(--ob-wv-ink)}
.ork{font-size:var(--fs-num);font-weight:500;color:var(--muted)}
/* An Owner column: small abbreviation text, out of the way. Only the answers
   that matter to you get a fill: YOU in blue, FA green, W amber. */
td.ctr,th.ctr{text-align:center}
th.ctr .sorth{justify-content:center;width:100%}
.own{display:inline-flex;align-items:center;justify-content:center;gap:3px;min-width:32px;height:18px;padding:0 6px;border-radius:4px;
  vertical-align:middle;font-size:var(--fs-2xs);font-weight:600;letter-spacing:.04em;line-height:1;color:var(--muted);white-space:nowrap}
.own.you{background:var(--consensus);color:var(--you-ink)}
.own.fa{background:var(--ob-fa-bg);color:var(--ob-fa-ink)}
.own.wv{background:var(--ob-wv-bg);color:var(--ob-wv-ink)}
.own small{font-size:var(--fs-2xs);font-weight:500;opacity:.8}
/* Shaded value cells: a rounded cell inside the column, never a full-bleed fill. */
.hc{display:inline-flex;align-items:center;justify-content:center;min-width:48px;height:24px;padding:0 8px;border-radius:6px}
.hc.hu1{background:var(--heat-u1)} .hc.hu2,.hc.hu3{background:var(--heat-u2)}
.hc.hd1{background:var(--heat-d1)} .hc.hd2,.hc.hd3{background:var(--heat-d2)}
.pl{display:flex;align-items:center;gap:8px;min-width:0}
/* Same lesson as the avatar: a name block is a shape, not a context. */
.nm{display:flex;flex-direction:column;line-height:1.2;min-width:0}
.nm b,.plink{font-weight:600;font-size:var(--fs-base);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* A player's name is a real button: it opens the player modal (click anywhere on the [data-pid] cell does too). */
.plink{all:unset;box-sizing:border-box;display:block;max-width:100%;cursor:pointer;font-weight:600;font-size:var(--fs-base);line-height:1.1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--ink)}
.plink:hover{color:var(--consensus);text-decoration:underline}
.plink:focus-visible{outline:2px solid var(--consensus);outline-offset:2px;border-radius:3px}
[data-pid]{cursor:pointer}
.nm small{color:var(--muted);font-size:var(--fs-xs)}
.prow{display:flex;align-items:center;gap:8px;min-width:0}
/**
 * The headshot sits on a grey disc. In a table the NFL logo or (comfortable
 * view) the position tag rides its corner.
 *
 * Sleeper's thumbnails are 350x254 with a transparent background and the face
 * centred, so `object-fit:cover` on a square already crops to a head-and-
 * shoulders view. Zooming it further pushes the chin into the corner and cuts
 * the head off. `object-position` top keeps the crown in frame.
 *
 * Two elements: `.av` is the sized frame, `.avf` the clipped, grey face.
 */
/* Scoped to nothing: an avatar is a SIZE, not a context. Scoping this to
   `.prow` and `.pl` meant the matchup cards drew the raw image at its natural
   width the moment they started using the same helper. */
.av{--c:var(--p-bn);width:34px;height:34px;flex:none;position:relative;display:block}
.avf{position:absolute;inset:0;border-radius:50%;background:var(--line);overflow:hidden;display:block}
.avf img{width:100%;height:100%;object-fit:cover;object-position:50% 0;display:block}
/* Team marks are logos, not faces: no crop, no zoom, and a square frame. */
.av.logo .avf{border-radius:10px}
.av.logo .avf img{object-fit:contain;padding:4px}
table.fixed td .prow, table.fixed td .pl{padding-block:0}
.prow .who{display:flex;flex-direction:column;gap:3px;min-width:0}
.prow .who .pn{font-size:var(--fs-base);font-weight:600;line-height:1.15;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stack{display:flex;flex-direction:column;align-items:flex-end;line-height:1.15}
.oppwrap{display:flex;flex-direction:column;gap:2px;line-height:1.15}
.oppline{display:flex;align-items:baseline;gap:6px}
/* The opponent is context, not a result: smaller and greyer than the numbers beside it. */
.oppname{font-size:var(--fs-xs);font-weight:500;color:var(--ink-3)}
.vgwrap{display:inline-flex;flex-direction:column;align-items:center;gap:2px}
.vgbar{position:relative;width:64px;height:6px;border-radius:3px;background:var(--line)}
.vgbar>i{position:absolute;top:0;bottom:0;border-radius:3px;background:var(--consensus);opacity:.55}
.vgbar>b{position:absolute;top:-2px;width:2px;height:10px;margin-left:-1px;border-radius:1px;background:var(--ink)}
.vgtx{font-size:var(--fs-2xs);color:var(--muted);font-variant-numeric:tabular-nums}
td.vgpart{color:var(--muted);font-style:italic}
.vgtag{display:inline-flex;align-items:center;height:18px;padding:0 6px;border-radius:4px;font-size:var(--fs-2xs);font-weight:600;white-space:nowrap}
.vgtag.floor{background:var(--ob-fa-bg);color:var(--ob-fa-ink)}
.vgtag.vol{background:var(--ob-wv-bg);color:var(--ob-wv-ink)}
.vgtag.bal{background:var(--ob-bg);color:var(--ob-ink)}
/* Opp · SOS: the opponent, and a 5px dot after it only for a lopsided matchup. */
.oppc{display:inline-flex;align-items:center;gap:4px;position:relative}
.oppc .sosd{width:5px;height:5px;border-radius:50%;flex:none;opacity:.8}
.sosd.g{background:var(--good)} .sosd.b{background:var(--bad)}
/* Fixed layout sizes from the colgroup, but a nowrap header still sets a
   minimum the table honours; letting band labels clip keeps a long one from
   widening the table past its container. */
.stack .sv{font-variant-numeric:tabular-nums;font-size:var(--fs-base);font-weight:400}
.stack .ss{font-size:var(--fs-2xs);color:var(--muted);font-variant-numeric:tabular-nums}
.stack .sv.big{font-size:var(--fs-base);font-weight:500}
.scored{font-variant-numeric:tabular-nums;font-weight:600;font-size:var(--fs-name);color:var(--ink)}
.scored.zero{font-weight:400;color:var(--muted)}
.scored.beat{color:var(--good)}
.scored.miss{color:var(--bad)}
/* Column tone (columnsFor's COL_TONE): the headline number of each band in
   full ink at 600; ranks, ranges, floors and the like in the secondary ink. */
td.t-key .stack .sv,td.t-key .scored:not(.zero):not(.beat):not(.miss){font-weight:600;color:var(--ink)}
td.t-aux,td.t-aux .stack .sv{color:var(--ink-2)}
td.t-aux .delta{font-weight:400}
/* Position badges: the position's pastel, solid, with navy ink — small enough
   to lead a name without out-shouting it. A lineup slot is the larger one. */
.pos{--c:var(--p-bn);display:inline-flex;align-items:center;justify-content:center;text-align:center;flex:none;
  font-size:var(--fs-2xs);font-weight:600;letter-spacing:0;line-height:1;border-radius:5px;overflow:hidden;
  min-width:24px;height:18px;padding:0 4px;background:var(--c);color:var(--pos-ink);border:0}
.pos[data-p="QB"]{--c:var(--p-qb)} .pos[data-p="RB"]{--c:var(--p-rb)} .pos[data-p="WR"]{--c:var(--p-wr)}
.pos[data-p="TE"]{--c:var(--p-te)} .pos[data-p="K"]{--c:var(--p-k)} .pos[data-p="DST"]{--c:var(--p-dst)}
.pos[data-p="DEF"]{--c:var(--p-dst)} .pos[data-p="FLEX"]{--c:var(--p-flex)}
.pos[data-p="SF"]{--c:var(--p-sf)} .pos[data-p="BN"]{--c:var(--p-bn)} .pos[data-p="IR"]{--c:var(--p-ir)}
.slot{min-width:28px;height:23px;padding:0 5px;font-size:var(--fs-xs);border-radius:6px;flex:none}
.slotcell{display:flex;align-items:center;gap:6px}
.tmlogo{width:12px;height:12px;object-fit:contain;flex:none;opacity:.9}
/* Inline position label (e.g. in transaction rows). The palette is pastel now,
   so it is a small filled chip — pastel text on white would not read. */
.pos.mini{width:auto;min-width:20px;height:13px;padding-inline:3px;font-size:8.5px;border-radius:3px;letter-spacing:.04em}
.toggles{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
/* The tab strip's rule runs under the controls too, so tabs and switches read
   as one bar instead of a line that stops halfway across the page. */
.tabrow{display:flex;align-items:flex-end;justify-content:space-between;gap:8px 16px;flex-wrap:wrap;border-bottom:1px solid var(--line)}
.tabrow .pgtabs{margin:0;flex:1 1 auto;min-width:0;border-bottom-color:transparent}
.tabrow .toggles{flex:0 0 auto;padding-bottom:6px}
.seg{display:inline-flex;border:1px solid var(--line-strong);border-radius:var(--r-sm);overflow:hidden;height:var(--ctl-h);box-sizing:border-box}
.seg button{all:unset;box-sizing:border-box;cursor:pointer;display:inline-flex;align-items:center;padding:0 12px;font-size:var(--fs-sm);font-weight:500;color:var(--ink-2);background:var(--surface)}
.seg button:hover{background:var(--surface-2);color:var(--ink)}
.seg button+button{border-left:1px solid var(--line-strong)}
.seg button[aria-pressed="true"]{background:var(--consensus-soft);color:var(--consensus);font-weight:600}
.seg button:focus-visible{outline:2px solid var(--consensus);outline-offset:-2px}
/* A starter on bye is a lineup mistake. Only the slot is flagged: the row's
   rest-of-season, trade and buzz numbers are unaffected by one week off. */
table.roster tr.byestart .oppname{color:var(--bad);font-weight:600}
/* Overview: the roster hugs its table and the side panels take the rest of
   the row; without room for them they wrap underneath at full width. */
.teamgrid{display:flex;flex-wrap:wrap;gap:14px 16px;align-items:flex-start}
.teamgrid>.teammain{flex:0 1 auto;width:min-content;max-width:100%;min-width:0;display:flex;flex-direction:column;gap:10px}
.teamgrid>.teamrail{flex:1 1 340px;min-width:0;display:flex;flex-direction:column;gap:14px}
.mvrow{display:flex;align-items:flex-start;gap:10px;padding:8px 14px;border-bottom:1px solid var(--line)}
.ui-list-row:last-child>.mvrow{border-bottom:0}
.mvrow .mvwho{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px}
.mvrow .mvhead{display:flex;align-items:center;gap:6px;min-width:0}
.mvrow .move-team{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mvrow .mvdate{color:var(--muted);font-size:var(--fs-xs);font-variant-numeric:tabular-nums;white-space:nowrap;padding-top:2px}
/* ---- matchup page ---------------------------------------------------
   Two mirrored cards per slot with the badge between them, the way every host
   draws it. Each side is its own card so the row reads as two things being
   compared rather than one wide strip of text. */
.munav{display:flex;align-items:center;gap:8px;margin-bottom:4px}
.mustrip{display:flex;gap:6px;overflow-x:auto;padding:2px;flex:1;scrollbar-width:thin}
.muchip{display:flex;align-items:center;gap:5px;padding:5px 8px;border-radius:var(--r-sm);flex:none;
  border:1px solid var(--line);background:var(--surface);cursor:pointer;color:var(--ink-2)}
.muchip:hover{border-color:var(--line-strong)}
.muchip.on{border-color:var(--consensus);background:var(--consensus-soft);color:var(--ink)}
.muchip.mine{box-shadow:inset 0 -2px 0 var(--consensus)}
.muchip .tav{width:22px;height:22px;border-radius:6px}
.muchip .mc{font-size:var(--fs-xs);font-variant-numeric:tabular-nums;font-weight:600}
.muchip .vs{font-size:var(--fs-2xs);color:var(--muted)}
.muhead{display:grid;grid-template-columns:1fr auto 1fr;gap:14px;align-items:center;padding-bottom:12px}
.muteam{display:flex;align-items:center;gap:11px;min-width:0}
.muteam.b{flex-direction:row;justify-content:flex-end;text-align:right}
.muteam .tav{width:44px;height:44px;border-radius:11px}
.mun{min-width:0;display:flex;flex-direction:column;gap:3px;flex:1;align-items:flex-start}
.muteam.b .mun{align-items:flex-end}
.mun b{font-family:var(--font);font-size:var(--fs-lg);font-weight:600;line-height:1.05;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.musc{text-align:right;flex:none}
.muteam.b .musc{text-align:left}
.musc .p1{font-family:var(--font);font-size:26px;font-weight:600;line-height:1;font-variant-numeric:tabular-nums}
.musc .p2{font-size:var(--fs-xs);color:var(--muted);font-variant-numeric:tabular-nums}
.muvs{font-size:var(--fs-xs);color:var(--muted);letter-spacing:.12em;font-weight:600;text-align:center;white-space:nowrap}
.muband{color:var(--muted);
  padding:10px 0 6px;border-top:1px solid var(--line);margin-top:8px}
.murow{display:grid;grid-template-columns:1fr 48px 1fr;gap:8px;align-items:stretch;margin-bottom:6px}
.muside{display:flex;align-items:center;gap:9px;min-width:0;padding:7px 10px;border-radius:var(--r-sm);
  border:1px solid var(--line);background:var(--surface-2)}
.muside .note{margin:auto}
.muwho{display:flex;align-items:center;gap:8px;min-width:0;flex:1}
.muwho .av{width:32px;height:32px}
.muside.b .muwho{flex-direction:row-reverse;text-align:right}
.munm{min-width:0;display:flex;flex-direction:column;gap:1px}
.munm .l1{display:flex;align-items:center;gap:5px;min-width:0}
.muside.b .munm .l1{justify-content:flex-end}
.munm .l1 b{font-size:var(--fs-base);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.munm .l1 .tm{font-size:var(--fs-2xs);color:var(--muted);font-weight:600;letter-spacing:.04em;flex:none}
.munm .l2{font-size:var(--fs-xs);color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.muval{flex:none;text-align:right;min-width:54px}
.muside.b .muval{text-align:left}
.muval .pv{font-size:var(--fs-lg);font-weight:600;font-variant-numeric:tabular-nums;line-height:1.1}

.heatkey .hu2{background:var(--heat-u2)} .heatkey .hd2{background:var(--heat-d2)} .sbar.prt2{--c:var(--consensus)} .sbar.prt3{--c:var(--market)} .sbar.prt5{--c:var(--bad)}
.posrank{display:flex;flex-direction:column;gap:9px}
.prk{display:grid;grid-template-columns:64px 1fr 64px;align-items:center;gap:12px}
.prk.strong{padding-bottom:9px;border-bottom:1px solid var(--line)}
.prk .pl1{font-weight:600;font-size:var(--fs-sm)}
.prk.strong .pl1{color:var(--consensus)}
.prk .pr1{text-align:right;font-size:var(--fs-sm);color:var(--ink-2)}
.tneeds{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin-top:4px;padding-top:12px;border-top:1px solid var(--line)}
.tneeds .lbl{color:var(--muted);margin-right:4px}
/* every roster, slot by slot */
.agrid{border-collapse:separate;border-spacing:0;font-size:var(--fs-sm);width:auto;min-width:100%}
.agrid th,.agrid td{border-bottom:1px solid var(--line)}
.agrid th.slot,.agrid td.slot{position:sticky;left:0;z-index:2;background:var(--surface);min-width:64px;border-right:1px solid var(--line-strong)}
.agrid thead th{background:var(--surface-2)}
.agrid thead th.slot{background:var(--surface-2);z-index:3}
.agrid .ghead{min-width:128px;max-width:128px;padding:8px}
.agrid .gth{display:flex;align-items:center;gap:7px;min-width:0}
.agrid .gth .tav{width:24px;height:24px;border-radius:6px}
.agrid .gtx{display:flex;flex-direction:column;min-width:0;text-transform:none;letter-spacing:0}
.agrid .gtx b{font-size:var(--fs-xs);font-weight:600;color:var(--ink);overflow:hidden;text-overflow:ellipsis}
.agrid .gtx span{font-size:var(--fs-2xs);font-weight:500;color:var(--muted)}
.agrid th.mineh{box-shadow:inset 0 -3px 0 var(--consensus)}
.agrid td.gcell{padding:6px 9px;border-left:1px solid var(--line);min-width:128px;max-width:128px}
.agrid td.gcell.mine{box-shadow:inset 2px 0 0 var(--consensus),inset -2px 0 0 var(--consensus)}
.gcell .gn{font-weight:600;font-size:var(--fs-xs);overflow:hidden;text-overflow:ellipsis}
.gcell .gs{display:flex;justify-content:space-between;gap:6px;font-size:var(--fs-xs);color:var(--ink-2);font-variant-numeric:tabular-nums}
.gcell .gs b{font-weight:600;color:var(--ink)}
.agrid tr.totrow td{background:var(--surface-2)}
.agrid tr.totrow td.slot{background:var(--surface-2)}
.bar{position:relative;height:5px;border-radius:3px;background:var(--surface-2);overflow:hidden;min-width:54px}
.bar i{position:absolute;inset-block:0;left:0;background:var(--consensus);border-radius:3px}
.bar i.mk{background:var(--market)}
.grade{font-family:var(--font);font-weight:600;font-size:var(--fs-md)}
.note{color:var(--muted);font-size:var(--fs-sm);margin:0}
.note.warn{color:var(--warn)}
.empty{padding:26px 16px;text-align:center;color:var(--muted);font-size:var(--fs-base);display:flex;flex-direction:column;gap:6px;align-items:center}
.empty b{color:var(--ink-2);font-weight:600}
/* league scoreboard: one card per matchup, two rows each */
.sbgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:10px;padding:14px}
.sbcard{border:1px solid var(--line);border-radius:var(--r);background:var(--surface);overflow:hidden}
.sbcard.mine{border-color:var(--consensus);box-shadow:inset 3px 0 0 var(--consensus)}
.sbrow{display:flex;align-items:center;gap:9px;padding:7px 11px;border-bottom:1px solid var(--line)}
.sbrow:last-of-type{border-bottom:0}
.sbn{flex:1;min-width:0;font-size:var(--fs-base);font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sbp{font-size:var(--fs-md);font-weight:600;font-variant-numeric:tabular-nums;color:var(--ink-2);min-width:56px;text-align:right}
.sbp.lead{color:var(--ink);font-weight:600}
.sbj{font-size:var(--fs-xs);color:var(--muted);font-variant-numeric:tabular-nums;min-width:42px;text-align:right}
.sbbye{color:var(--muted);font-size:var(--fs-sm);justify-content:center}
.sbfoot{display:flex;align-items:center;gap:8px;padding:6px 11px;background:var(--surface-2);font-size:var(--fs-xs);color:var(--muted)}
/* Fantasy-team crests: square, uncropped, never zoomed like a headshot. */
.tav{width:30px;height:30px;border-radius:8px;flex:none;overflow:hidden;display:block;
  background:var(--surface-2);border:1px solid var(--line)}
.tav img{width:100%;height:100%;object-fit:contain;display:block}
tr.mine .tav{border-color:var(--gold)}
.seedno{display:inline-flex;align-items:center;justify-content:center;width:24px;height:24px;border-radius:6px;
  font-weight:600;font-size:var(--fs-sm);background:var(--surface-2);color:var(--muted);border:1px solid var(--line)}
.seedno.in{background:var(--good-soft);color:var(--good);border-color:var(--good)}
/* The playoff seed only earns its own mark when it disagrees with the standing. */
.seedalt{display:block;font-size:9px;color:var(--muted);letter-spacing:.04em;margin-top:2px}
.scored.approx:not(.beat):not(.miss){color:var(--ink-2)}
/* A published number and one we derived by redistributing a season total are
   not the same claim, so they do not get the same weight on the page. */
.wkcell.derived{color:var(--ink-2);font-weight:400}
.wkcell.real{font-weight:600}
.wkcell.bye{color:var(--muted);font-weight:400}
td.wknow{background:var(--surface-2)}
table.stand td{padding-block:4px}
/* In vs out of the playoffs is a row FILL, not only a divider: sorting by
   points or by division breaks rank order, and a line drawn at a fixed index
   would then sit in the wrong place while still looking authoritative. */
table tbody tr.inplay:not(.mine):not(:hover){--cell-bg:color-mix(in srgb,var(--good-soft) 45%,transparent)}
tbody tr.outplay td{color:var(--ink-2)}
tbody tr.outplay .tav{opacity:.65}
.stack .sv.prov{color:var(--ink-2)}
.stack .sv.prov::after{content:'*';color:var(--market);font-size:var(--fs-xs);vertical-align:super}
.num.odds{font-weight:600}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:var(--fs-xs);color:var(--muted);align-items:center}
/* league index + setup editor */
.lgcell{display:flex;align-items:center;gap:10px;min-width:0}
.lgcell .nm{display:flex;flex-direction:column;gap:1px;min-width:0}
.lgcell .nm b{font-size:var(--fs-md);font-weight:600}
.hostdot{width:26px;height:26px;border-radius:7px;display:inline-flex;align-items:center;justify-content:center;
  font-weight:600;font-size:var(--fs-sm);flex:none;background:var(--surface-2);color:var(--ink-2);border:1px solid var(--line)}
.hostdot.espn{background:#C8102E22;color:#E2786D;border-color:#C8102E55}
.hostdot.yahoo{background:#6001D222;color:#A78BFA;border-color:#6001D255}
.hostdot.sleeper{background:#00CEB822;color:#3FBFA8;border-color:#00CEB855}
.fgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px 18px}
.fld{display:flex;flex-direction:column;gap:4px;min-width:0}
.fld input[type=text],.fld input[type=number],.fld select{width:100%;max-width:none}
.fld input:focus-visible,.fld select:focus-visible{outline:2px solid var(--consensus);outline-offset:1px}
.fhint{font-size:var(--fs-xs);color:var(--muted)}
.ro{font-size:var(--fs-base);color:var(--ink-2);padding:6px 0}
.ro.mono{font-size:var(--fs-xs);word-break:break-all;color:var(--muted)}
td input[type=text],td input[type=number]{font-family:inherit;font-size:var(--fs-sm);color:var(--ink);background:var(--surface);
  border:1px solid var(--line-strong);border-radius:var(--r-sm);min-height:28px;padding:3px 8px;min-width:170px}
td select{min-height:28px;padding-block:2px}
/* min-width beats max-width in CSS, so the text rule's 170px would win. */
td input[type=number]{min-width:0;width:76px;text-align:right;font-variant-numeric:tabular-nums}
td input[type=checkbox],td input[type=radio]{width:16px;height:16px;accent-color:var(--consensus);cursor:pointer}
.exportbox{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;
  display:flex;flex-direction:column;gap:8px;box-shadow:var(--shadow)}
.exportbox textarea{font-family:ui-monospace,monospace;font-size:var(--fs-xs);width:100%;background:var(--surface-2);
  color:var(--ink);border:1px solid var(--line);border-radius:6px;padding:9px;resize:vertical}
.exportbox button{align-self:flex-start}
/* transaction rows: each side of a move is a stack of player chips */
.mvside{display:flex;flex-direction:column;gap:3px;min-width:0}
.mvp{display:flex;align-items:center;gap:5px;min-width:0}
.mvsign{font-weight:600;font-size:var(--fs-sm);width:9px;flex:none;text-align:center}
.mvsign.add{color:var(--good)} .mvsign.drop{color:var(--bad)}
.mvn{font-size:var(--fs-base);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
td .ss{font-size:var(--fs-xs);color:var(--muted)}
.sw{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:5px;vertical-align:-1px}
:not(tr).mine{box-shadow:inset 3px 0 0 var(--consensus)}
/* ---- players page (Sleeper-style browser) ---- */
.pfilter{display:flex;flex-direction:column;gap:8px;padding:9px 12px}
.prowbar{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center}
.psearch{flex:1;min-width:230px;min-height:34px;font-size:var(--fs-base);padding-inline:12px}
.psearch:focus-visible{outline:2px solid var(--consensus);outline-offset:1px}
.psearch::-webkit-search-cancel-button{-webkit-appearance:none}
.fgroup{display:flex;flex-wrap:wrap;gap:5px;align-items:center}
.fsel{display:inline-flex;align-items:center;gap:6px}
.lucheck{padding:9px 14px;border-radius:var(--r-sm);border:1px solid var(--line);background:var(--surface);font-size:var(--fs-base);color:var(--ink-2)}
.lucheck.warn{border-color:var(--warn);color:var(--ink)}
.lucheck.ok{color:var(--muted)}
.callchip{display:inline-block;padding:1px 7px;border-radius:99px;font-size:var(--fs-2xs);font-weight:600;letter-spacing:.04em}
.callchip.start{background:var(--good-soft);color:var(--good)}
.callchip.sit{background:var(--bad-soft);color:var(--bad)}
.fsel .ftitle{color:var(--muted)}
.fgroup .ftitle{color:var(--muted);margin-right:3px}
.fchip{font-family:inherit;cursor:pointer;border:1px solid var(--line-strong);background:var(--surface);color:var(--ink);
  font-size:var(--fs-num);font-weight:500;height:28px;padding:0 12px;border-radius:99px;display:inline-flex;align-items:center;gap:5px}
.fchip:hover{background:var(--row-hover)}
/* The active filter is the accent, whatever it filters. */
.fchip.on,.fchip.on[data-p]{border-color:var(--gold);color:var(--gold-ink);background:var(--gold);font-weight:600}
.fchip .tml{width:13px;height:13px;object-fit:contain;flex:none}
.iconbtn.watchon{border-color:var(--warn);color:var(--warn);font-weight:600}
.star{all:unset;cursor:pointer;font-size:var(--fs-lg);line-height:1;color:var(--line-strong);width:26px;height:26px;
  border-radius:6px;text-align:center;display:inline-flex;align-items:center;justify-content:center}
.star:hover{color:var(--warn);background:var(--surface-2)}
.star.on{color:var(--warn)}
td.watch{width:34px;padding-inline:3px;text-align:center}
.pcount{font-size:var(--fs-xs);color:var(--muted);font-variant-numeric:tabular-nums}
.pcount.total{color:var(--ink-2);font-weight:600}
td.noteclip{max-width:340px}
.sheetnote{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:340px;color:var(--ink-2);font-size:var(--fs-sm)}
.srcth .stalemark{color:var(--bad);font-style:normal;font-size:8px;margin-left:3px}
th.stalecol{opacity:.7}
td.dim .sv,td.dim .ss{opacity:.42}
td.rolled .sv::after{content:'\2020';color:var(--muted);font-size:9px;margin-left:2px}
.setrow{display:flex;align-items:flex-start;gap:10px;padding:7px 0;font-size:var(--fs-base);border-bottom:1px solid var(--line);cursor:pointer}
.setrow:last-child{border-bottom:0}
.setrow input[type=checkbox]{margin-top:3px;flex:none}
.setrow .note{display:inline}
td.wrapcell{white-space:normal;min-width:220px;max-width:340px}
td.wrapcell .ss{white-space:normal}

/* the FantasyPros start/sit grade as a filled chip: a verdict, not a quantity */
.gradebadge{display:inline-flex;align-items:center;justify-content:center;min-width:30px;height:20px;padding-inline:5px;
  border-radius:5px;font-size:var(--fs-xs);font-weight:600;letter-spacing:.02em;font-variant-numeric:normal}
.gradebadge.good{color:var(--good);background:var(--good-soft)}
.gradebadge.info{color:var(--consensus);background:var(--consensus-soft)}
.gradebadge.mid{color:var(--ink-2);background:var(--surface-2)}
.gradebadge.bad{color:var(--bad);background:var(--bad-soft)}
.gradebadge.muted{color:var(--muted);background:var(--surface-2);font-weight:600}
.abbrin{width:84px;text-transform:uppercase}
.srcgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(380px,1fr));gap:16px;align-items:start}
.srccard .pbody,.pbody .gline{min-width:0}
.gline{display:grid;grid-template-columns:130px 1fr;gap:10px;padding:5px 0;border-bottom:1px solid var(--line);font-size:var(--fs-sm);line-height:1.45}
.gline:last-child{border-bottom:0}
.gline b{color:var(--ink-2);font-weight:600}
.gline span{color:var(--ink);min-width:0}
.bestcell{color:var(--good);font-weight:600}
.wtable{width:auto;min-width:100%}
.wtable th.pcol{border-left:1px solid var(--line);text-align:left;padding-block:8px}
.wtable td{padding:4px 8px}
.wtable td.r,.wtable th.r{text-align:right}
.pname{display:flex;align-items:center;gap:6px}
.pname .txtin{width:132px;min-height:28px;padding:3px 8px}
.wnum{width:64px;min-height:28px;padding:3px 7px;text-align:right;font-variant-numeric:tabular-nums}
.wnum:focus-visible,.pname .txtin:focus-visible{outline:2px solid var(--consensus);outline-offset:1px}
@media (max-width:560px){ .srcgrid{grid-template-columns:1fr} .gline{grid-template-columns:1fr;gap:2px} }
@media (max-width:860px){
  /* minmax(0,…): a bare 1fr is minmax(auto,1fr), so a long row of pages in the
     rail would stretch the whole page past the screen instead of scrolling. */
  .shell{grid-template-columns:minmax(0,1fr)}
  .rail{position:static;height:auto;flex-direction:column;border-right:0;border-bottom:1px solid var(--line)}
  .rail1{width:auto;flex-direction:row;justify-content:center;gap:8px;padding:8px 12px;overflow-x:auto;overflow-y:hidden}
  .brandmark,.rail2-title{display:none}
  #nav button[aria-current="true"]::before{display:none}
  .rail2{flex-direction:row;align-items:center;gap:14px;padding-block:10px;padding-inline:12px;overflow-x:auto;overflow-y:hidden;border-right:0;border-bottom:1px solid var(--line)}
  #nav{flex-direction:row;gap:4px}
  .navsec{flex-direction:row;gap:4px}
  .gtile.first-foot{margin-top:0}
  .shell.solo{grid-template-columns:minmax(0,1fr)}
  #nav button{white-space:nowrap}
  .railswitch{width:200px;flex:none}
  #nav .tag,.rail-foot{display:none}
  .page,.topbar{padding-inline:16px}
  .muhead{grid-template-columns:1fr;gap:8px}
  .vs .side.b{text-align:left;align-items:flex-start}
  .toasts,.shell.solo~.toasts{left:16px;right:16px;width:auto;bottom:16px}
  .cmdk{order:-1;flex-basis:100%;max-width:none}
  .cp-back{padding-top:8vh}
  .term-body{font-size:var(--fs-xs)}
  .tl{grid-template-columns:auto 1fr;gap:8px;padding:0 10px}
  .tl .s{display:none}
  .term input[type=search]{width:130px}
}
/* ---------- header search / command palette ----------
   One box in the top bar finds anything: a page, a league, a player, or a
   command (sync, theme, export). It is a button that opens the palette, not a
   live input, so the top bar never reflows under typing. */
.cmdk{all:unset;box-sizing:border-box;cursor:pointer;display:flex;align-items:center;gap:9px;flex:1 1 280px;max-width:440px;min-width:200px;height:34px;padding:0 10px 0 11px;
  border:1px solid var(--line-strong);border-radius:var(--r-sm);background:var(--surface-2);color:var(--muted);font-size:var(--fs-sm)}
.cmdk:hover{border-color:color-mix(in srgb,var(--consensus) 45%,var(--line-strong));color:var(--ink-2)}
.cmdk:focus-visible{outline:2px solid var(--consensus);outline-offset:1px}
.cmdk svg{width:15px;height:15px;flex:none;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round}
.cmdk span{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
kbd{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:var(--fs-xs);color:var(--muted);background:var(--surface);border:1px solid var(--line-strong);border-bottom-width:2px;border-radius:5px;padding:0 5px;line-height:17px}
.cp-back{position:fixed;inset:0;z-index:1100;background:rgba(3,10,24,.5);display:flex;justify-content:center;align-items:flex-start;padding:12vh 16px 16px}
.cp{width:min(640px,100%);max-height:min(560px,76vh);display:flex;flex-direction:column;background:var(--surface);color:var(--ink);border:1px solid var(--line-strong);border-radius:14px;box-shadow:0 24px 60px rgba(3,10,24,.35);overflow:hidden}
.cp-in{display:flex;align-items:center;gap:10px;padding:0 14px;border-bottom:1px solid var(--line)}
.cp-in svg{width:17px;height:17px;flex:none;fill:none;stroke:var(--muted);stroke-width:2;stroke-linecap:round}
.cp-in input{all:unset;flex:1;min-width:0;height:50px;font-size:var(--fs-md);color:var(--ink)}
.cp-in input::placeholder{color:var(--muted)}
.cp-list{overflow-y:auto;padding:6px;scrollbar-width:thin}
.cp-sec{color:var(--muted);padding:9px 10px 4px}
.cp-item{display:flex;align-items:center;gap:10px;padding:7px 10px;border-radius:8px;cursor:pointer;min-height:38px}
.cp-item[aria-selected="true"]{background:var(--consensus-soft)}
.cp-item[aria-selected="true"] .cp-t{color:var(--consensus)}
.cp-ic{width:26px;height:26px;flex:none;border-radius:7px;background:var(--surface-2);display:grid;place-items:center;color:var(--ink-2);overflow:hidden}
.cp-ic svg{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.cp-ic img{width:100%;height:100%;object-fit:cover}
.cp-ic .hostdot{margin:0}
.cp-tx{flex:1;min-width:0;display:flex;flex-direction:column;line-height:1.25}
.cp-t{font-size:var(--fs-base);font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cp-t mark{background:none;color:inherit;font-weight:600;text-decoration:underline;text-decoration-color:color-mix(in srgb,var(--consensus) 55%,transparent);text-underline-offset:2px}
.cp-s{font-size:var(--fs-xs);color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cp-k{font-size:var(--fs-xs);color:var(--muted);flex:none}
.cp-empty{padding:28px 16px;text-align:center;color:var(--muted);font-size:var(--fs-base)}
.cp-foot{display:flex;gap:14px;align-items:center;padding:7px 14px;border-top:1px solid var(--line);font-size:var(--fs-xs);color:var(--muted);background:var(--surface-2);flex-wrap:wrap}
.cp-foot span{display:inline-flex;gap:5px;align-items:center}

/* ---------- toasts ----------
   Temporary, and anchored to the bottom of the second rail — the drawer the
   eye already returns to — with the rail's own terminal line under them. On a
   single-page option (no second rail) and on a phone they float bottom-left. */
:root{--term-bg:#06122A;--term-bg-2:#0B1C3B;--term-ink:#C9D5EA;--term-dim:#6F80A0;--term-ok:#5FD39C;--term-warn:#F2C25B;--term-err:#FF8A7E;--term-info:#8CB8FF}
.toasts{position:fixed;z-index:1200;left:calc(var(--rail1) + 10px);bottom:46px;width:calc(var(--rail2) - 20px);display:flex;flex-direction:column;gap:6px;pointer-events:none}
.shell.solo~.toasts{width:300px}
.toast{pointer-events:auto;display:flex;gap:8px;align-items:flex-start;background:var(--term-bg);color:var(--term-ink);border:1px solid rgba(255,255,255,.08);border-left:3px solid var(--term-info);
  border-radius:9px;padding:8px 9px 8px 10px;box-shadow:0 10px 28px rgba(3,10,24,.32);font-size:var(--fs-xs);line-height:1.4;animation:toastin .18s ease-out}
.toast.ok{border-left-color:var(--term-ok)} .toast.warn{border-left-color:var(--term-warn)} .toast.error{border-left-color:var(--term-err)}
.toast .tm{flex:1;min-width:0;word-break:break-word;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:var(--fs-xs)}
.toast .tm b{font-family:var(--font);font-weight:600;display:block;font-size:var(--fs-sm);color:#fff;margin-bottom:1px}
.toast button{all:unset;cursor:pointer;font-size:var(--fs-xs);font-weight:600;color:var(--term-info);white-space:nowrap}
.toast button:hover{color:#fff}
.toast button:focus-visible{outline:2px solid var(--gold);outline-offset:2px;border-radius:3px}
.toast.out{opacity:0;transform:translateY(4px);transition:opacity .2s,transform .2s}

<script id="payload" type="application/json">/*__DATA__*/null</script>
<script>
(function(){
"use strict";
const DATA = JSON.parse(document.getElementById('payload').textContent);
/* A league roster is ids plus that league's own live fields (points, slot, game
   state). Everything else about a player - projections, rank, injury, roster %,
   demand - lives on ONE row per player in DATA.pools, and is joined here, so the
   same player is the same object's worth of data on every page. */
DATA.leagues.forEach(l=>{
  const u=String(l.scoring||'PPR').toUpperCase();
  const pool=new Map((DATA.pools[u==='HALF'?'HALF':(u==='STD'?'STD':'PPR')]||[]).map(p=>[p.i,p]));
  l.teams.forEach(t=>{ t.players=t.players.map(r=> Object.assign({}, pool.get(r.i)||{n:'fpId '+r.i}, r)); });
});
const $ = (s,r)=> (r||document).querySelector(s);
const el = (t,c,txt)=>{const e=document.createElement(t); if(c)e.className=c; if(txt!=null)e.textContent=txt; return e;};
/* How every number is written: src/format.js, inlined (the file the tests run).
   The short names below are the page's older formatters, kept as aliases. */
/*__INLINE:format.js__*/
const num = fxNum;
/** League-scored points (matchups, lineups, PF/PA): hosts score to the hundredth, so one decimal misreports them. */
const pts2 = v=> num(v,2);
/* Used where a string is concatenated into innerHTML, so it has to actually escape. */
const esc = s => String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');

/* ---------- theme ---------- */
const store = {
  get(k,f){ try{ const v=localStorage.getItem(k); return v==null?f:v; }catch{ return f; } },
  set(k,v){ try{ localStorage.setItem(k,v); }catch{} }
};
const themeBtn = $('#themeBtn');
const savedTheme = store.get('gd.theme', null);
if(savedTheme) document.documentElement.setAttribute('data-theme', savedTheme);
function toggleTheme(){
  const cur = document.documentElement.getAttribute('data-theme');
  const isDark = cur!=='light';
  const next = isDark ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', next);
  store.set('gd.theme', next);
  return next;
}
themeBtn.addEventListener('click', toggleTheme);
/* The table view is one setting for every table, so a page never mixes card
   rows with packed ones; any table's switch flips them all. */
const TABLE_VIEWS={comfortable:'Comfortable', compact:'Compact'};
function setTableView(v){
  if(!TABLE_VIEWS[v]) v='comfortable';
  document.documentElement.setAttribute('data-tv', v);
  store.set('gd.tv', v);
  document.querySelectorAll('.seg.dens').forEach(seg=>
    seg.querySelectorAll('button').forEach(b=> b.setAttribute('aria-pressed', String(b.dataset.v===v))));
  return v;
}
setTableView(store.get('gd.tv', 'comfortable'));

/* ---------- helpers ---------- */
const POS_ORDER = {QB:1,RB:2,WR:3,TE:4,K:5,DST:6};
const byPos = (a,b)=> (POS_ORDER[a.p]||9)-(POS_ORDER[b.p]||9) || (wkPts(b)??-1)-(wkPts(a)??-1);
const sum = (arr,f)=> arr.reduce((s,x)=> s + (Number(f(x))||0), 0);

/**
 * Injury designation, or nothing.
 *
 * ACTIVE is not a designation — it is the absence of one, and on a roster where
 * almost everyone is active a green pill on almost every row carries no
 * information while costing every row the space. Only a real flag renders.
 */
const INJ_ABBR = {QUESTIONABLE:'Q', DOUBTFUL:'D', PROBABLE:'P', OUT:'OUT', IR:'IR',
  SUSPENDED:'SUSP', PUP:'PUP', DNR:'DNR', NA:'NA'};
function injPill(p){
  if(!p.inj) return null;
  const s = String(p.inj).toUpperCase();
  if(s==='ACTIVE'||s==='HEALTHY') return null;
  const cls = (s==='OUT'||s==='IR'||s==='SUSPENDED'||s==='PUP') ? 'out' : 'q';
  const sp = el('span','st '+cls, INJ_ABBR[s] || s);
  sp.title = [p.inj, p.injT].filter(Boolean).join(' — ');
  return sp;
}
function deltaCell(v){ return cell('delta', v, {flat:0.4}); }
const POS_VAR = {QB:'--p-qb',RB:'--p-rb',WR:'--p-wr',TE:'--p-te',K:'--p-k',DST:'--p-dst',DEF:'--p-dst',BN:'--p-bn'};
/**
 * Multi-position slots are written as the initials of what they accept:
 * WR/RB/TE -> WRT, QB/WR/RB/TE -> QWRT. Each gets one solid colour.
 */
function slotLabel(slot){
  const parts=String(slot||'').toUpperCase().split('/').map(x=>x.trim()).filter(Boolean);
  if(parts.length<2) return String(slot||'—').toUpperCase();
  const order=['QB','WR','RB','TE'];
  const set=new Set(parts);
  return order.filter(x=>set.has(x)).map(x=>x[0]).join('') || 'FLEX';
}
/** SF when a flex slot also takes a QB, otherwise FLEX. */
function slotKind(slot){
  const parts=String(slot||'').toUpperCase().split('/').map(x=>x.trim()).filter(Boolean);
  if(parts.length<2) return null;
  return parts.includes('QB') ? 'SF' : 'FLEX';
}
function posChip(pos, extraClass){
  const key=String(pos||'').toUpperCase();
  const known=['QB','RB','WR','TE','K','DST','DEF','BN','IR'];
  const multi=key.includes('/');
  // A flex slot reads FLX on its badge; a superflex keeps its initials (QWRT).
  const text=multi ? (slotKind(key)==='FLEX'? 'FLX' : slotLabel(key)) : (key==='FLEX'? 'FLX' : (pos||'—'));
  const sp=el('span','pos'+(extraClass?' '+extraClass:''), text);
  sp.setAttribute('data-p', known.includes(key) ? key : (multi ? slotKind(key) : (key||'FLEX')));
  if(multi) sp.title=key;
  return sp;
}

const teamLogo = (t) => 'https://sleepercdn.com/images/team_logos/nfl/'+String(t||'').toLowerCase()+'.png';

/**
 * One lazy <img> that hides itself if the URL 404s.
 *
 * Four places were each re-implementing this — headshots, the team mark under a
 * name, matchup team heads, standings avatars — and only some of them set
 * loading="lazy" or handled the error, so a missing image left a broken-icon
 * box in some tables and nothing in others.
 */
function imgEl(src, cls){
  const i=el('img',cls||null); i.loading='lazy'; i.alt=''; i.decoding='async';
  if(!src){ i.style.visibility='hidden'; return i; }
  i.src=src;
  i.addEventListener('error',()=>{ i.style.visibility='hidden'; });
  return i;
}

/**
 * Headshot on a grey disc with a position badge on its corner; DSTs use the
 * team logo.
 *
 * Three layers rather than one because the image is scaled up inside the disc
 * and the badge has to sit outside its clip: frame (.av) > clipped face (.avf) >
 * image, with the badge a sibling of the face.
 */
function avatarFor(p, o){
  const box=el('span','av');
  const face=el('span','avf');
  const pos = String(p.p||'').toUpperCase();
  const dst=(pos==='DST'||pos==='DEF') && p.t;
  if(dst){
    box.classList.add('logo');
    face.append(imgEl(teamLogo(p.t)));
  } else {
    face.append(imgEl(p.s ? 'https://sleepercdn.com/content/nfl/players/thumb/'+p.s+'.jpg' : null));
  }
  box.append(face);
  // In a table the NFL team rides on the headshot's corner (a defense IS its logo).
  if(o && o.logo && !dst && p.t){ const lg=imgEl(teamLogo(p.t),'lg'); lg.alt=p.t; box.append(lg); }
  return box;
}

/**
 * The one status tag after a name: an injury designation (OUT/IR coral, Q/D
 * amber), else BYE when his team is off this week. Nothing for a healthy
 * player — a tag on every row would carry no information.
 */
function statusTag(p){
  const s=String(p.inj||'').toUpperCase();
  if(s && s!=='ACTIVE' && s!=='HEALTHY'){
    const out=(s==='OUT'||s==='IR'||s==='SUSPENDED'||s==='PUP');
    const t=el('span','st '+(out?'out':'q'), INJ_ABBR[s] || s);
    t.title=[p.inj, p.injT].filter(Boolean).join(' \u2014 ');
    return t;
  }
  if(p.t && DATA.week && isBye(p, DATA.week)){ const t=el('span','st','BYE'); t.title='On bye in week '+DATA.week; return t; }
  return null;
}

/**
 * A player, the one way (docs/components.md §3.6): one line — position badge,
 * 28px headshot with the NFL logo on its corner, name, NFL team, status tag.
 * `roster` leads with the lineup slot instead and keeps a "POS - TEAM" line
 * under the name, as a lineup reads. The name opens the player's card.
 */
function playerIdentity(p, o={}){
  const tag=statusTag(p);
  if(o.layout==='roster'){
    const w=el('div','pid roster'); w.dataset.pid=p.i;
    if(o.slot!==undefined && o.slot!==null) w.append(posChip(o.slot,'slot'));
    // A starter who cannot play is a lineup hole: his row says so before anything else does.
    const out=o.slot && !isBench(o.slot) && tag;
    const av=avatarFor(p,{logo:true}); if(out) av.classList.add('dim');
    w.append(av);
    const who=el('div','who2');
    const l1=el('span','l1'); const nm=plink(p); if(out) nm.classList.add('dim');
    l1.append(nm); if(tag) l1.append(tag);
    who.append(l1);
    // On a lineup the line under the name is position and team; his game is the Opp column's.
    who.append(el('span','prt',[p.p, p.t].filter(Boolean).join(' \u00b7 ')));
    w.append(who);
    return w;
  }
  const w=el('div','pid'); w.dataset.pid=p.i;
  if(p.p) w.append(posChip(p.p,'mini'));
  w.append(avatarFor(p,{logo:true}));
  const who=el('span','who');
  who.append(plink(p));
  if(tag) who.append(tag);
  // Position and team only — rank and owner are columns of their own. The
  // position text stands in for the badge in comfortable ("QB CAR").
  if(p.t || p.p){
    const tm=el('span','prt'); tm.title=[p.p, p.t].filter(Boolean).join(' ');
    if(p.p) tm.append(el('span','tpos',p.p));
    if(p.t) tm.append(el('span','tma',p.t));
    who.append(tm);
  }
  w.append(who);
  return w;
}

/**
 * Every data cell, by kind (docs/components.md §3.6). The kind owns the
 * alignment, the formatting, what a blank looks like and — through `sort` —
 * what the column sorts by, so a page says WHAT a cell is, not how to draw it.
 *
 *   num     a number: `d` decimals, or `text` already formatted. With `stack`,
 *           a value over a smaller `sub` line.
 *   delta   a signed change, green/red past ±`flat`.
 *   blank   the dash, with the reason in `tip`.
 *   player  playerIdentity; `layout`, `slot` as there.

 *           { logo, name, sub }.
 *   text    plain text, left-aligned; `text` or `v`.
 *   bar     a strength bar: `v` is 0–1 of the column's best, `cls` its tier.

  } else if(kind==='slot'){
    td=el('td'); const c=Object.assign(el('span','pos slot'),{textContent:v}); c.setAttribute('data-p',slotKey(v)); td.append(c);
  } else if(kind==='blank'){
    td=el('td','r'); const d=el('span','delta flat',FX_BLANK); if(o.tip) d.title=o.tip; td.append(d);
  } else if(kind==='delta'){
    td=el('td','r');

    else { const f=o.flat??0; td.append(el('span','delta '+(v>f?'up':(v<-f?'dn':'flat')), fxDelta(v, o.d??1))); }
  } else if(o.stack){
    td=el('td','r'+(o.sep?' tsep':''));
    const d=el('div','stack');
    d.append(Object.assign(el('div','sv'+(o.big?' big':'')),{textContent:o.text!==undefined? fxRankText(o.text) : fxNum(v,o.d)}));

  }
  if(o.title) td.title=o.title;
  if(o.sort!=null) td.dataset.v=String(o.sort);
  return td;
}

/**
 * Two-tier header: a band row grouping columns, then the column labels.

 * exactly their sum. A fixed-layout table at width:100% hands the spare room
 * out to every column, so a 3-character rank column ends up as wide as a name;

/**

/* ---------- lineup construction ---------- */
const SLOT_ELIG = {
  QB:['QB'], RB:['RB'], WR:['WR'], TE:['TE'], K:['K'], DST:['DST','DEF'], DEF:['DST','DEF'],
  'W/R':['WR','RB'], 'W/T':['WR','TE'], 'R/T':['RB','TE'],
  'W/R/T':['WR','RB','TE'], 'WR/RB/TE':['WR','RB','TE'], FLEX:['WR','RB','TE'],
  OP:['QB','WR','RB','TE'], SUPERFLEX:['QB','WR','RB','TE'], 'Q/W/R/T':['QB','WR','RB','TE']
};
function slotEligible(slot){
  const k=String(slot||'').toUpperCase().trim();
  if(SLOT_ELIG[k]) return SLOT_ELIG[k];
  if(k.includes('/')) return k.split('/').map(x=>x.trim()).filter(Boolean);
  return [k];
}
const isBench = s => /^(BN|BE|BENCH|IR|TAXI)$/i.test(String(s||'').trim());

/**
 * The real lineup when MyPlaybook serves it; otherwise a best-fit lineup built
 * from the league's slot template and week projections. The two are labelled
 * differently — a computed lineup is not what the manager actually set.
 */
function lineupFor(l, team){
  const M = l.adv && l.adv.matchup;
  if(M && M.ok && team && team.mine){
    const side = [M.team1,M.team2].find(t=> t && String(t.id)===String(l.myTeamId)) || M.team1;
    if(side){
      const byId = new Map(team.players.map(p=>[p.i,p]));
      const map = s => Object.assign({}, byId.get(s.fpId)||{i:s.fpId,n:s.name,t:s.team,p:s.pos}, {slot:s.slot, live:s.proj, gameTime:s.time, gameStatus:s.game});
      return { source:'actual', starters: side.starters.map(map), bench: side.bench.map(x=>Object.assign(map(x),{slot:'BN'})) };
    }
  }
  const slots = (l.rosterSlots||[]).filter(x=>x);
  if(!slots.length || !team) return { source:'none', starters:[], bench:(team?team.players:[]).map(p=>Object.assign({slot:'BN'},p)) };
  const pool = team.players.slice().sort((a,b)=> (wkPts(b)??-1)-(wkPts(a)??-1));
  const used = new Set();
  const starters = [];
  slots.filter(sl=>!isBench(sl)).forEach(sl=>{
    const elig = slotEligible(sl);
    const pick = pool.find(p=> !used.has(p.i) && elig.includes(String(p.p||'').toUpperCase()));
    if(pick) used.add(pick.i);
    starters.push(Object.assign({slot:sl}, pick||{}));
  });
  const bench = pool.filter(p=>!used.has(p.i)).map(p=>Object.assign({slot:'BN'},p));
  return { source:'computed', starters, bench };
}

/* ---------- shared cells ---------- */
/** Player cell: headshot, name, then a coloured position badge + team + bye. */
/** A player's name as the button that opens his modal. */
function plink(p){
  const b=el('button','plink',p.n||('fpId '+p.i)); b.type='button';
  b.title='Open '+(p.n||'player')+'\u2019s profile';

/* ---------- column sorting for tables that have no sorter of their own ----------
   Reads the cells back out of the DOM, so it works on every table built by
   table()/table2() without each page describing its sort. A cell sorts by its
   `data-v` when it has one (used where the text lies: a chart, a signed change),
   otherwise by the first number in its text, otherwise as text. Group headers and
   total rows stay where they are; rows sort within their own group. Blanks always
   go last. A click cycles first direction, the other, then back to the original
   order. The choice is remembered per set of column labels, so a table rebuilt by
   a search or filter keeps its sort. */
const sortMemo=new Map();
const NUM_LEAD=/^\D{0,4}(-?\d+(?:\.\d+)?)/;
function sortCell(td){
  if(td.dataset.v!=null && td.dataset.v!==''){
    const n=Number(td.dataset.v);
    return Number.isNaN(n)? {num:false, v:td.dataset.v.toLowerCase()} : {num:true, v:n};
  }
  const src=td.querySelector('.plink,.pn,.nm b');
  const raw=((src||td).textContent||'').replace(/\u2212/g,'-').trim();
  if(!raw || /^[\u2014\u2013-]$/.test(raw)) return null;
  const m=raw.match(NUM_LEAD);
  return m? {num:true, v:parseFloat(m[1])} : {num:false, v:raw.toLowerCase()};
}
function makeSortable(t, memoKey){
  const thead=t.tHead, tb=t.tBodies[0];

  const hr=thead.rows[thead.rows.length-1];
  if(hr.querySelector('th.sortable')) return t;
  const ths=Array.from(hr.cells), n=ths.length;
  const isData=tr=> tr.cells.length===n && !tr.classList.contains('totrow') && !tr.classList.contains('grouphdr');
  Array.from(tb.rows).filter(isData).forEach((tr,i)=>{ tr.dataset.o=i; });
  const rows=Array.from(tb.rows).filter(isData);
  const firstDir={};
  const state={col:-1, dir:0};

  const cmp=(a,b)=>{
    if(state.col<0) return a.dataset.o-b.dataset.o;
    const x=sortCell(a.cells[state.col]), y=sortCell(b.cells[state.col]);
    if(!x && !y) return a.dataset.o-b.dataset.o;
    if(!x) return 1;
    if(!y) return -1;
    const d = x.num&&y.num? x.v-y.v : String(x.v).localeCompare(String(y.v));
    return d? d*state.dir : a.dataset.o-b.dataset.o;
  };

    ths.forEach((th,ci)=>{
      const arrow=th.querySelector('.arrow');
      if(!arrow) return;
      const on=state.col===ci;
      arrow.replaceWith(sortIcon(on? (state.dir>0? 'asc' : 'desc') : null));
      th.classList.toggle('sorted',on);
      th.setAttribute('aria-sort', on? (state.dir>0?'ascending':'descending') : 'none');
    });
    let seg=[];
    const flush=()=>{
      if(!seg.length) return;
      const after=seg[seg.length-1].nextSibling;
      seg.slice().sort(cmp).forEach(r=> tb.insertBefore(r,after));
      seg=[];
    };
    Array.from(tb.rows).forEach(tr=>{ if(isData(tr)) seg.push(tr); else flush(); });
    flush();
    sortMemo.set(memoKey,{col:state.col, dir:state.dir});
  };

  ths.forEach((th,ci)=>{
    if(!th.textContent.trim() && !th.firstElementChild) return;
    const vals=rows.map(tr=>sortCell(tr.cells[ci])).filter(Boolean);
    if(vals.length<2) return;
    const numeric=vals.filter(v=>v.num).length>=vals.length/2;
    const label=th.textContent.trim();
    // Numbers open biggest-first, except ranks, where the best is the smallest.
    firstDir[ci] = numeric && !/^(rk|#|pr|posrk|ecr|adp|rank|opp)/i.test(label)? -1 : 1;

    th.tabIndex=0;
    th.setAttribute('aria-sort','none');

      else if(state.dir===firstDir[ci]) state.dir=-firstDir[ci];
      else { state.col=-1; state.dir=0; }
      apply();
    };
    th.onclick=pick;
    th.onkeydown=ev=>{ if(ev.key==='Enter' || ev.key===' '){ ev.preventDefault(); pick(); } };
  });
  const saved=sortMemo.get(memoKey);
  if(saved && saved.col>=0 && ths[saved.col] && ths[saved.col].classList.contains('sortable')){
    state.col=saved.col; state.dir=saved.dir; apply();
  }
  return t;
}
const tableKey = cols=> cols.map(c=>c.label||'').join('|');

function table(cols, rows){
  const wrap = el('div','scroll');
  const t = el('table');
  const thead = el('thead'); const tr = el('tr');
  cols.forEach(c=> tr.append(headCell(c)));
  thead.append(tr); t.append(thead);
  const tb = el('tbody');
  rows.forEach(r=> tb.append(r));
  t.append(tb); makeSortable(t, tableKey(cols)); wrap.append(t); return wrap;

/* ---------- DataGrid ----------

   all", and sorting that reads each column's declared value instead of the
   text in its cells.

const dgState=new Map();
function dgCell(c, r){

/**

    }

  const tb=el('tbody');
  shown.forEach((r,ri)=>{
    const div=o.divider? o.divider(r, ri) : null;
    if(div){ div.cells[0] && (div.cells[0].colSpan=cols.length); tb.append(div); }
    const tr=el('tr', o.rowClass? o.rowClass(r)||null : null);
