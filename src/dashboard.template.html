/* ======================================================================
   The log, toasts, the server bridge, and the pages built on them.

   One log for everything that happens: DATA.runlog is the tail of
   data/runlog.jsonl as of the build (every line every sync printed, CLI or
   dashboard); under `npm run serve` the page tails the same file live; and
   what this page itself does (a save, a league switched off, a command that
   needs a terminal) is kept in this browser. A toast is a log line that also
   showed itself for a few seconds; the Log page is where they all stay.
   ====================================================================== */

const fmtClock = t=> new Date(t).toLocaleTimeString([], {hour:'2-digit', minute:'2-digit', second:'2-digit'});
const tidy = m=> String(m||'').trim().replace(/\s{2,}/g,' ');
/** Age from a timestamp, read now — not the build's frozen "4m". */
function ago(iso){
  if(!iso) return 'never';
  const m=Math.round((Date.now()-new Date(iso).getTime())/60000);
  if(!Number.isFinite(m)) return 'never';
  if(m<1) return 'just now';
  if(m<60) return m+'m';
  if(m<1440) return Math.floor(m/60)+'h '+(m%60)+'m';
  return Math.floor(m/1440)+'d';
}
const ageMin = iso=> iso? (Date.now()-new Date(iso).getTime())/60000 : Infinity;
const ordinal = n=> n+(['th','st','nd','rd'][((n%100)-20)%10]||['th','st','nd','rd'][n%100]||'th');

const LOG=(()=>{
  const KEY='gd.log', CLEAR='gd.log.clearedAt', CAP=400;
  let local=[];
  try{ local=JSON.parse(localStorage.getItem(KEY)||'[]'); if(!Array.isArray(local)) local=[]; }catch{ local=[]; }
  const server=new Map();
  (DATA.runlog||[]).forEach(e=>{ if(e && e.seq) server.set(e.seq,e); });
  let lastSeq = DATA.runlog && DATA.runlog.length ? DATA.runlog[DATA.runlog.length-1].seq : null;
  let n=0;
  const subs=new Set();
  const persist=()=>{ try{ localStorage.setItem(KEY, JSON.stringify(local.slice(-CAP))); }catch{ /* private window */ } };
  const notify=()=> subs.forEach(f=>{ try{ f(); }catch{ /* a dead view */ } });
  const api={
    all(){
      const cut=store.get(CLEAR,'');
      return [...server.values(), ...local].filter(e=> !cut || e.t>cut).sort((a,b)=> a.t<b.t? -1 : a.t>b.t? 1 : 0);
    },
    latest(){ const a=api.all(); return a[a.length-1] || null; },
    /** A line from this page. `o.toast:false` keeps it out of the toast stack. */
    add(level, msg, src, o){
      o=o||{};
      const e={t:new Date().toISOString(), seq:'c'+Date.now().toString(36)+(n++), level:level||'info', src:src||'page', msg:String(msg)};
      local.push(e);
      if(local.length>CAP) local=local.slice(-CAP);
      persist(); notify();
      if(o.toast!==false) toast(e.msg, {level:e.level, title:o.title, action:o.action, timeout:o.timeout});
      return e;
    },
    /** Server lines, deduped on their sequence id. Returns the ones not seen before. */
    ingest(entries){
      const fresh=[];
      (entries||[]).forEach(e=>{ if(e && e.seq && !server.has(e.seq)){ server.set(e.seq,e); fresh.push(e); lastSeq=e.seq; } });
      if(fresh.length) notify();
      return fresh;
    },
    lastSeq: ()=> lastSeq,
    clearView(){ store.set(CLEAR, new Date().toISOString()); notify(); },
    restoreView(){ store.set(CLEAR, ''); notify(); },
    cleared: ()=> !!store.get(CLEAR,''),
    subscribe(f){ subs.add(f); return ()=> subs.delete(f); },
  };
  return api;
})();

/**
 * A temporary message at the foot of the second rail. Errors stay longer, and
 * a toast under the pointer does not leave while you are reading it.
 */
function toast(msg, o){
  o=o||{};
  const host=$('#toasts'); if(!host) return null;
  const t=el('div','toast '+(o.level||'info'));
  const m=el('div','tm');
  if(o.title) m.append(el('b',null,o.title));
  m.append(document.createTextNode(msg));
  t.append(m);
  let timer=null;
  const close=()=>{ clearTimeout(timer); t.classList.add('out'); setTimeout(()=>t.remove(),200); };
  if(o.action){
    const b=el('button',null,o.action.label); b.type='button';
    b.onclick=()=>{ close(); o.action.run(); };
    t.append(b);
  }
  const x=el('button',null,'×'); x.type='button'; x.setAttribute('aria-label','Dismiss'); x.onclick=close;
  t.append(x);
  host.append(t);
  while(host.children.length>4) host.firstChild.remove();
  const arm=()=>{
    const ms = o.timeout!=null? o.timeout : (o.level==='error'? 9000 : (o.action? 7000 : 4200));
    if(ms>0) timer=setTimeout(close, ms);
  };
  t.addEventListener('mouseenter',()=> clearTimeout(timer));
  t.addEventListener('mouseleave',arm);
  arm();
  return {close};
}

async function copyText(text){
  try{ await navigator.clipboard.writeText(text); return true; }
  catch{
    try{
      const ta=el('textarea'); ta.value=text; ta.style.position='fixed'; ta.style.opacity='0';
      document.body.append(ta); ta.select(); const ok=document.execCommand('copy'); ta.remove(); return ok;
    }catch{ return false; }
  }
}

/* ---------- the server bridge ----------
   Everything here degrades to "copy the command": opened as a file, the page
   has no backend, and a button that silently does nothing is worse than one
   that hands you the line to paste. */
const SRV={ up:null, state:null };
const SYNC={ running:false, step:null, startedAt:null, last:null };
const canServe = /^https?:$/.test(location.protocol);

async function api(path, body){
  let res;
  const opts = body===undefined ? {cache:'no-store'} : {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(body)};
  try{ res=await fetch(path, opts); }
  catch{ SRV.up=false; throw new Error('No server answered — run `npm run serve` and open http://localhost:4173.'); }
  const j=await res.json().catch(()=>null);
  if(!res.ok){ const e=new Error((j&&(j.error||j.message))||('HTTP '+res.status)); e.status=res.status; throw e; }
  return j;
}
async function probe(){
  if(!canServe){ SRV.up=false; renderTermLine(); return false; }
  try{
    SRV.state=await api('/api/state');
    SRV.up=true;
    if(SRV.state.running){ SYNC.running=true; SYNC.step=SRV.state.running.step; SYNC.startedAt=Date.parse(SRV.state.running.startedAt)||Date.now(); }
    await pollLog();
  }catch{ SRV.up=false; }
  renderTermLine();
  if(page==='sync'||page==='leagues'||page==='log') render();
  else schedulePoll();
  return SRV.up;
}

let pollTimer=null;
async function pollLog(){
  if(!SRV.up) return;
  try{
    const r=await api('/api/log?after='+encodeURIComponent(LOG.lastSeq()||''));
    const fresh=LOG.ingest(r.entries);
    // A step finishing is worth a toast; its narration is not.
    if(SYNC.running) fresh.forEach(e=>{ if(e.src==='sync' && /^\s*(done|FAIL)\b/.test(e.msg)) toast(tidy(e.msg), {level:e.level, timeout:3200}); });
    const wasRunning=SYNC.running;
    SYNC.step = r.running? r.running.step : null;
    // A run started from another tab.
    if(r.running && !wasRunning){ SYNC.running=true; SYNC.startedAt=Date.parse(r.running.startedAt)||Date.now(); if(page==='sync') render(); }
    if(!r.running && wasRunning && !SYNC.mine){ SYNC.running=false; if(page==='sync') render(); }
  }catch{ /* the next poll will try again */ }
  renderTermLine();
}
function schedulePoll(){
  clearTimeout(pollTimer);
  if(!SRV.up) return;
  const ms = SYNC.running? 1000 : ((page==='log'||page==='sync') && !document.hidden ? 4000 : 0);
  if(ms) pollTimer=setTimeout(async()=>{ await pollLog(); schedulePoll(); }, ms);
}
document.addEventListener('visibilitychange', schedulePoll);

/** The CLI line that does what a sync button does, for when there is no server. */
function syncCmd(body){
  body=body||{};
  const f=[];
  if(body.only) f.push('--only '+body.only);
  if(body.force) f.push('--force');
  if(body.dryRun) f.push('--dry-run');
  return 'npm run sync'+(f.length? ' -- '+f.join(' ') : '');
}

async function runSync(body, label){
  body=body||{}; label=label||'Sync';
  if(!SRV.up){
    const cmd=syncCmd(body), ok=await copyText(cmd);
    LOG.add('warn', (ok? 'Copied to the clipboard: ' : 'Run in a terminal: ')+cmd, 'page', {title:'No server is running this page'});
    return null;
  }
  if(SYNC.running){ toast('A sync is already running.', {level:'warn', action:{label:'Log', run:()=>go('log')}}); return null; }
  SYNC.running=true; SYNC.mine=true; SYNC.step=null; SYNC.startedAt=Date.now();
  toast(label+' started', {action:{label:'Log', run:()=>go('log')}});
  if(page==='sync') render();
  schedulePoll(); renderTermLine();
  try{
    const r=await api('/api/sync', body);
    const results=r.results||[];
    SYNC.last={label, body, results, at:Date.now()};
    await pollLog();
    const failed=results.filter(x=>x.status==='failed');
    const fetched=results.filter(x=>x.status==='ok' && !x.always).length;
    if(body.dryRun){
      const would=results.filter(x=>x.status==='would run' && !x.always).map(x=>x.name);
      toast(would.length? 'Would fetch: '+would.join(', ') : 'Every source is fresh — nothing would fetch.', {title:'Dry run', level:'ok', timeout:7000});
    } else {
      toast(fetched+' source'+(fetched===1?'':'s')+' fetched'+(failed.length? ', '+failed.length+' failed ('+failed.map(x=>x.name).join(', ')+')' : '')+'. The page was rebuilt.',
        {title:label+(failed.length? ' finished with errors' : ' finished'), level:failed.length? 'error':'ok', timeout:0, action:{label:'Reload', run:()=>location.reload()}});
    }
  }catch(e){
    LOG.add('error', label+' could not run: '+e.message, 'page');
  }finally{
    SYNC.running=false; SYNC.mine=false; SYNC.step=null;
    try{ SRV.state=await api('/api/state'); }catch{ /* keep the last one */ }
    if(page==='sync') render();
    schedulePoll(); renderTermLine();
  }
  return SYNC.last;
}

/** The rail's terminal line: the newest log line, or what the running sync is on. */
function renderTermLine(){
  const b=$('#termLine'); if(!b) return;
  const e=LOG.latest();
  b.querySelector('i').className = SYNC.running? 'run' : (e? e.level : '');
  b.querySelector('span').textContent = SYNC.running
    ? 'syncing · '+(SYNC.step||'starting')+'…'
    : (e? fmtClock(e.t)+' '+tidy(e.msg) : 'nothing logged yet');
}
LOG.subscribe(renderTermLine);

/** Navigate. The one place a page change happens, for the rail, the palette and every link. */

}

/* ---------- Log page ---------- */
let logLevel = store.get('gd.log.level','all')==='problems'? 'problems' : 'all';
let logSrc='', logQuery='', logFollow=true;

function pageLog(){
  const out=[];
  const h=el('div','head'); h.append(el('h1',null,'Log'));
  h.append(el('p',null,'Every line every sync has printed — from the terminal or from the Sync page — and what this page did: saves, league switches, commands that needed a terminal. The toasts are the temporary half of this.'));

/**
 * The terminal view of the log. `full` adds the filters; the short one is the
 * Sync page's live tail. Either redraws itself when a line arrives, until it is
 * no longer on the page.
 */
function terminal(o){
  o=o||{};
  const box=el('section','term');
  const bar=el('div','term-bar');
  const dots=el('span','dots'); dots.append(el('i'),el('i'),el('i')); bar.append(dots);
  bar.append(el('b',null,'runlog'));
  const status=el('span');
  bar.append(status);
  bar.append(el('span','spacer'));
  const body=el('div','term-body'+(o.full?'':' short'));
  body.setAttribute('role','log'); body.setAttribute('aria-label','Run log');

  const filtered=()=>{
    const q=logQuery.trim().toLowerCase();
    return LOG.all().filter(e=>
      (!o.full || logLevel==='all' || e.level==='error' || e.level==='warn')
      && (!o.full || !logSrc || e.src===logSrc)
      && (!o.full || !q || (e.msg+' '+e.src).toLowerCase().includes(q)));
  };

  if(o.full){
    bar.append(segmented([{label:'All',value:'all'},{label:'Problems',value:'problems'}], logLevel, v=>{ logLevel=v; store.set('gd.log.level',v); render(); }));
    const srcs=[...new Set(LOG.all().map(e=>e.src))].sort();
    const sel=el('select'); sel.setAttribute('aria-label','Source');
    [['','every source'],...srcs.map(s=>[s,s])].forEach(([v,lbl])=>{ const op=el('option',null,lbl); op.value=v; sel.append(op); });
    sel.value=logSrc; sel.onchange=()=>{ logSrc=sel.value; draw(); };
    bar.append(sel);
    const q=el('input'); q.type='search'; q.placeholder='Filter lines…'; q.value=logQuery; q.setAttribute('aria-label','Filter lines');
    q.oninput=()=>{ logQuery=q.value; draw(); };
    bar.append(q);
    const fol=el('button','tbtn','Follow'); fol.type='button'; fol.setAttribute('aria-pressed',String(logFollow));
    fol.title='Keep the newest line in view';
    fol.onclick=()=>{ logFollow=!logFollow; fol.setAttribute('aria-pressed',String(logFollow)); if(logFollow) body.scrollTop=body.scrollHeight; };
    bar.append(fol);
    const cp=el('button','tbtn','Copy'); cp.type='button';
    cp.onclick=async()=>{
      const txt=filtered().map(e=> e.t+'  '+e.src.padEnd(12)+' '+e.msg).join('\n');
      toast((await copyText(txt))? 'Copied '+filtered().length+' lines.' : 'Copy was blocked by the browser.', {level:'ok'});
    };
    bar.append(cp);
    const clr=el('button','tbtn', LOG.cleared()? 'Show all' : 'Clear'); clr.type='button';
    clr.title= LOG.cleared()? 'Show the lines hidden by Clear' : 'Hide everything so far from this view (the file on disk is untouched)';
    clr.onclick=()=>{ if(LOG.cleared()) LOG.restoreView(); else LOG.clearView(); render(); };
    bar.append(clr);
  } else {
    const all=el('button','tbtn','Open log'); all.type='button'; all.onclick=()=>go('log');
    bar.append(all);
  }

  function draw(){
    status.textContent = SRV.up
      ? (SYNC.running? ' · live · syncing '+(SYNC.step||'')+'' : ' · live from localhost')
      : ' · as of '+new Date(DATA.generatedAt).toLocaleString()+' (static file)';
    const atEnd = body.scrollHeight - body.scrollTop - body.clientHeight < 40;
    let rows=filtered();
    if(o.limit) rows=rows.slice(-o.limit);
    body.innerHTML='';
    if(!rows.length){
      body.append(el('div','term-empty', o.full && (logQuery||logSrc||logLevel!=='all')
        ? 'No line matches.' : 'Nothing logged yet. Every `npm run sync` and every run from the Sync page writes here.'));
      return;
    }
    let day=null;
    const frag=document.createDocumentFragment();
    rows.forEach(e=>{
      const d=new Date(e.t).toDateString();
      if(o.full && d!==day){ day=d; frag.append(el('div','tl day', new Date(e.t).toLocaleDateString([], {weekday:'long', month:'short', day:'numeric'}))); }
      const mark=/^[▶■]/.test(e.msg.trim());
      const ln=el('div','tl '+e.level+(mark?' mark':''));
      ln.append(el('span','t',fmtClock(e.t)), el('span','s',e.src), el('span','m',e.msg));
      frag.append(ln);
    });
    body.append(frag);
    if(logFollow || !o.full || atEnd) body.scrollTop=body.scrollHeight;
  }
  box.append(bar, body);
  draw();
  requestAnimationFrame(()=>{ body.scrollTop=body.scrollHeight; });
  const off=LOG.subscribe(()=>{ if(!box.isConnected){ off(); return; } draw(); });
  return box;
}

/** One row per fetch step: both clocks, its refresh limit, and a button that runs just it. */
function stepsPanel(){
  const F=freshBy();
  const steps=(DATA.steps||[]).filter(s=>!s.always);
  const lastRes=new Map(((SYNC.last&&SYNC.last.results)||[]).map(r=>[r.name,r]));
  let staleN=0;
  const rows=steps.map(s=>{
    const f=F.get(s.name);
    const age=ageMin(f&&f.fetchedAt), limit=s.maxAgeMin||60;
    const stale=age>=limit; if(stale) staleN++;
    const tr=el('tr','steprow'+(SYNC.running&&SYNC.step===s.name?' running':''));
    const nc=el('td'); const nm=el('div','stl'); nm.append(el('b',null,s.label), el('span','cmdline',s.name)); nc.append(nm); tr.append(nc);
    const fa=el('td','r num'); fa.textContent=ago(f&&f.fetchedAt); if(f&&f.fetchedAt) fa.title=new Date(f.fetchedAt).toLocaleString(); tr.append(fa);
    const sa=el('td','r num');
    if(f&&f.sourceAt){ sa.textContent=ago(f.sourceAt); sa.title='The site’s own last-recomputed time: '+new Date(f.sourceAt).toLocaleString(); }
    else { sa.append(el('span','note','—')); sa.title='This source publishes no update time; its age is ours alone.'; }
    tr.append(sa);
    tr.append(el('td','r num', limit>=60? (limit/60)+'h' : limit+'m'));
    tr.append(el('td','r num', f&&f.items!=null? String(f.items) : '—'));
    const st=el('td');
    const lr=lastRes.get(s.name);
    if(lr && lr.status==='failed') st.append(Object.assign(el('span','pill out','failed'),{title:tidy(lr.error)}));
    else if(!f) st.append(el('span','pill gh','never'));
    else if(f.failed) st.append(Object.assign(el('span','pill q',f.failed+' part'+(f.failed===1?'':'s')+' failed'),{title:'Some of this source’s boards failed on the last pull — see the Log'}));
    else st.append(el('span','pill '+(stale?'q':'ok'), stale? 'stale' : 'fresh'));
    tr.append(st);
    const rc=el('td','r');
    const b=el('button','btn sm','Run'); b.type='button'; b.disabled=SYNC.running;
    b.title=SRV.up? 'Fetch '+s.name+' now, then rebuild' : 'Copies: '+syncCmd({only:s.name});
    b.onclick=()=> runSync({only:s.name}, s.label);
    rc.append(b); tr.append(rc);
    return tr;
  });
  const p=panel('Sources', staleN? staleN+' past their refresh limit' : 'everything inside its refresh limit',
    table([{label:'Source'},{label:'Fetched',r:1},{label:'Site said',r:1},{label:'Limit',r:1},{label:'Rows',r:1},{label:'State'},{label:'',r:1}], rows));
  p.append(Object.assign(el('p','note pfoot'),{textContent:'After any fetch, every run joins the sources onto rosters, rebuilds this page and audits each source\u2019s scale and week. \u201cSite said\u201d is when the source itself last recomputed, where it publishes that.'}));
  return p;
}

/* ---------- All Leagues ----------
   One row per team of yours, across every league, ranked by how well it is
   doing: standing against the playoff cut, record, points, the odds, where
   it is projected to finish and how strong the roster is. Leagues switched
   off stay listed, with the switch, because a league that disappears when you
   turn it off cannot be turned back on. */
let lgHost=store.get('gd.lgHost','all');

function directory(){
  const byKey=new Map((DATA.directory||[]).map(d=>[d.key,d]));
  leagues.forEach(l=>{ if(!byKey.has(l.key)) byKey.set(l.key,{key:l.key, name:l.name, host:l.host, scoring:l.scoring, active:true, scraped:true}); });
  return [...byKey.values()];
}

/**
 * One of your teams, measured: its standings row, where the playoff cut sits,
 * its points-for rank, MyPlaybook's projection and odds, FantasyPros' roster
 * strength, and its matchup — this week's when the host serves a live board,
 * otherwise the latest stored week (the board Standings reads too).
 *
 * `status` is against the cut: in, bubble (out but within a win of the last
 * team in), or out. Null when the league has no playoff size to measure by.
 */
function teamStanding(l, t, rows, sb){
  const id=String(t.id);
  const r=rows? rows.find(x=>String(x.id)===id)||null : null;
  const n=rows? rows.length : l.teams.length;
  const inRows=rows? rows.filter(x=>x.inPlayoffs) : [];
  const cut=inRows.length;
  let status=null;
  if(r && r.inPlayoffs!=null && cut){
    if(r.inPlayoffs) status='in';
    else {
      const last=inRows.slice().sort((a,b)=>b.rank-a.rank)[0];
      status = last && (last.effWins-r.effWins)<=1 ? 'bubble' : 'out';
    }
  }
  const pfRank = r && r.pointsFor!=null ? 1+rows.filter(x=>x.pointsFor!=null && x.pointsFor>r.pointsFor).length : null;
  const A=l.analysis && l.analysis.ros;
  const an=A? A.teams.find(x=>String(x.teamId)===id)||null : null;
  const S=l.adv && l.adv.standings && l.adv.standings.ok ? l.adv.standings.standings : [];
  const proj=S.find(x=>String(x.teamId)===id)||null;
  let mu=null;
  ((sb && sb.ok && sb.rows) || []).some(m=>{
    const i=(m.sides||[]).findIndex(s=> s && String(s.id)===id);
    if(i<0) return false;
    const wp = m.winProb==null? null : (i===0? m.winProb : 1-m.winProb);
    mu={m, me:m.sides[i], opp:m.sides[1-i]||null, wp, week:sb.week, live:sb.live};
    return true;
  });
  // A stored "final" with nobody on the board scoring is a capture with no
  // points in it, not a 0–0 tie.
  if(mu) mu.scored = !mu.m.pre && ((mu.me.pts||0)+((mu.opp&&mu.opp.pts)||0))>0;
  return {l, t, r, n, cut, status, pfRank, an, anN: A? A.teams.length : null, proj, mu};
}
function myStandings(){
  const out=[];
  leagues.forEach(l=>{
    let sb=null, rows=null;
    try{ sb=standingsBoard(l); rows=standingsRows(l, sb); }catch{ rows=null; }
    const mine=myTeams(l);
    if(!mine.length) out.push({l, t:null, n:l.teams.length});
    mine.forEach(t=> out.push(teamStanding(l, t, rows, sb)));
  });
  return out;
}

const STATUS = {in:['In','ok','In playoff position'], bubble:['Bubble','q','Out, within a win of the last playoff spot'], out:['Out','out','Outside the playoff spots']};

const sortTd = (cls, v)=>{ const td=el('td',cls); if(v!=null) td.dataset.v=v; return td; };
/** Two lines in one cell: the number, and what it is out of. */
const duo = (td, big, small)=>{ const d=el('div','stack'); d.append(el('div','sv',big)); if(small) d.append(el('div','ss',small)); td.append(d); return td; };

/** Where you sit among N, with the playoff zone shaded and the cut marked. */
function rankTrack(s){
  const w=el('div','rtrack '+(s.status||'none'));

function standingRow(s, d){
  const {l, t, r}=s;
  const tr=el('tr','lgrow'+(s.status? ' st-'+s.status : '')+(d && d.active===false? ' off':''));
  tr.onclick=()=> go('myteam',{league:l, tab:'lineup'});

  const tc=el('td');

  }

  const st=sortTd('lgstand', r.rank);
  const top=el('div','lgrank');
  top.append(el('b',null,ordinal(r.rank)), el('span',null,'of '+s.n));
  if(s.status){ const [lbl,cls,tip]=STATUS[s.status]; top.append(Object.assign(el('span','pill '+cls,lbl),{title:tip})); }
  st.append(top, rankTrack(s));
  tr.append(st);

  const rec=sortTd('r num', r.games? (r.effWins+r.effTies/2)/Math.max(1,r.effWins+r.effLosses+r.effTies) : null);
  duo(rec, recordOf(r), r.gb>0? r.gb+' GB' : (r.rank===1? 'leads' : 'tied for 1st'));
  tr.append(rec);

  const pf=sortTd('r num', r.pointsFor);
  duo(pf, r.pointsFor!=null? pts2(r.pointsFor) : '—', s.pfRank? ordinal(s.pfRank)+' most' : null);
  tr.append(pf);

  const od=sortTd('r', r.oddsPct);
  if(r.oddsPct!=null){
    const b=el('div','oddsbar '+(r.oddsPct>=70?'hi':(r.oddsPct>=35?'mid':'lo')));
    b.append(el('b',null,r.oddsPct+'%'));
    const tk=el('span'); const f=el('i'); f.style.width=r.oddsPct+'%'; tk.append(f); b.append(tk);
    od.append(b);

    s.proj && s.proj.winsProjected!=null? s.proj.winsProjected+'–'+s.proj.lossesProjected+' proj' : null);
  tr.append(pj);

  const sg=sortTd('r', s.an && s.an.rank);
  if(s.an){ duo(sg, '#'+s.an.rank, 'of '+s.anN); const tc2=tierChip(s.an.tier); tc2.classList.add('mini'); sg.firstChild.firstChild.append(tc2); }
  else sg.append(el('span','note','—'));
  tr.append(sg);

  const wk=sortTd('lgwk', s.mu && s.mu.opp && s.mu.scored ? (s.mu.me.pts??0)-(s.mu.opp.pts??0) : null);
  const mu=s.mu;
  if(mu && mu.opp){
    const m=mu.m, a=m.pre? mu.me.proj : mu.me.pts, b=m.pre? mu.opp.proj : mu.opp.pts;
    const res = !mu.scored? null : ((a??0)>(b??0)? 'W' : ((a??0)<(b??0)? 'L' : 'T'));
    const line=el('div','wkline');
    line.append(el('span','wkres '+(res==='W'?'w':res==='L'?'l':'p'), res || '—'));
    line.append(el('span','num',pts2(a)+' – '+pts2(b)));

  } else wk.append(el('span','note','—'));
  tr.append(wk);

  const sw=el('td','r');
  if(edits.count(l.key)) sw.append(Object.assign(el('span','pill q', edits.count(l.key)+' unsaved'),{title:'League Setup edits not saved yet'}));
  if(d) sw.append(activeSwitch(d));
  tr.append(sw);
  return tr;
}

function pageLeagues(){
  const out=[];
  const h=el('div','head'); h.append(el('h1',null,'All Leagues'));
  h.append(el('p',null,'How each of your teams is doing, best first. Click a row for the team, its matchup cell for the game. A league switched off is skipped by every sync but stays listed so it can be switched back on.'));
  out.push(h);

  const dir=directory(), dirBy=new Map(dir.map(d=>[d.key,d]));
  const all=myStandings();
  const ranked=all.filter(s=>s.r);

  // The headline: how the whole portfolio is doing.
  const W=ranked.reduce((a,s)=>a+s.r.effWins,0), Lo=ranked.reduce((a,s)=>a+s.r.effLosses,0), T=ranked.reduce((a,s)=>a+s.r.effTies,0);
  const inN=ranked.filter(s=>s.status==='in').length, bub=ranked.filter(s=>s.status==='bubble').length, measured=ranked.filter(s=>s.status).length;
  const odds=ranked.filter(s=>s.r.oddsPct!=null);
  let up=0, down=0, allLive=true, scored=0;
  all.forEach(s=>{
    if(!s.mu || !s.mu.opp || !s.mu.scored) return;
    scored++;
    if(!s.mu.live) allLive=false;
    const a=s.mu.me.pts??0, b=s.mu.opp.pts??0;
    if(a>b) up++; else if(a<b) down++;
  });
  const strip=el('div','strip');
  strip.append(statTile('In playoff position', measured? inN+' of '+measured : '—', bub? bub+' more on the bubble' : 'teams with a playoff spot today', inN? 'good' : null));
  strip.append(statTile('Combined record', W+'–'+Lo+(T? '–'+T : ''), ranked.length? Math.round(W/Math.max(1,W+Lo+T)*100)+'% wins across '+ranked.length+' team'+(ranked.length===1?'':'s') : 'nothing stored yet'));
  strip.append(statTile('Playoff odds', odds.length? Math.round(odds.reduce((a,s)=>a+s.r.oddsPct,0)/odds.length)+'%' : '—', odds.length? 'average, MyPlaybook’s projection' : 'not published'));
  strip.append(scored
    ? statTile(allLive? 'This week' : 'Latest week', up+'\u2013'+down, allLive? 'winning \u2013 losing' : 'won \u2013 lost, latest stored week')
    : statTile('This week', '\u2014', 'no scored matchup stored yet'));
  out.push(strip);

  const hosts=[...new Set(leagues.map(l=>l.host).filter(Boolean))].sort();
  const bar=el('div','syncbar');
  if(hosts.length>1){
    if(lgHost!=='all' && !hosts.includes(lgHost)) lgHost='all';
    bar.append(segmented([{label:'All hosts',value:'all'},...hosts.map(x=>({label:x,value:x}))], lgHost, v=>{ lgHost=v; store.set('gd.lgHost',v); render(); }));
  }
  bar.append(el('span','spacer'));
  bar.append(syncBtn('Sync leagues', {only:'leagues'}, 'sm'));
  bar.append(syncBtn('Sync live scores', {only:'live'}, 'sm'));
  out.push(bar);

  // Best standing first: in before bubble before out, then by rank as a share of the league.
  const order={in:0, bubble:1, out:2};
  const shown=all.filter(s=> lgHost==='all' || s.l.host===lgHost)
    .sort((a,b)=> (a.r?0:1)-(b.r?0:1) || (order[a.status]??3)-(order[b.status]??3) || (a.r&&b.r? a.r.rank/a.n - b.r.rank/b.n : 0));
  if(!shown.length){
    out.push(panel('Your teams',null,emptyState('No league on '+lgHost,'Pick another host.')));
  } else {
    const rows=shown.map(s=> standingRow(s, dirBy.get(s.l.key)));
    const cols=[
      {label:'Team'},
      {label:'Standing', title:'Rank in the league; the shaded part of the track is the playoff spots'},
      {label:'Record', r:1, title:'Completed games; GB is games behind the leader'},
      {label:'Points for', r:1, title:'Season points scored, and where that ranks in the league'},
      {label:'Playoff odds', r:1, title:'MyPlaybook’s projected chance of making the playoffs'},
      {label:'Proj finish', r:1, title:'MyPlaybook’s projected final rank and record'},
      {label:'Roster', r:1, title:'FantasyPros’ rest-of-season strength rank of the whole roster'},
      {label:'Matchup'},
      {label:'Sync', r:1, title:'Switch a league off to skip it in every sync'},
    ];
    out.push(panel('Your teams', shown.length+' team'+(shown.length===1?'':'s')+' · best standing first', table2(cols, rows)));
  }

  const off=dir.filter(d=>!d.scraped && (lgHost==='all' || d.host===lgHost));
  if(off.length){
    const body=el('div');
    off.forEach(d=>{
      const r=el('div','lrow-off');
      r.append(hostDot(d));
      const nm=el('div','lc-name');
      nm.append(el('b',null,d.name));
      nm.append(el('span',null,[d.host, d.scoring, d.active? 'on — arrives with the next league sync' : 'switched off'].filter(Boolean).join(' · ')));
      r.append(nm);
      r.append(activeSwitch(d));
      body.append(r);
    });
    out.push(panel('Not synced', off.length+' league(s) with no data on this page', body));
  }
  return out;
}

   ====================================================================== */

const CP_ICONS={

  log:'<rect x="3.5" y="4.5" width="17" height="15" rx="2.5"/><path d="M7.5 10l3 2.5-3 2.5M12.5 15.5h4"/>',
  copy:'<rect x="8" y="8" width="12" height="12" rx="2"/><path d="M16 8V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h2"/>',
  save:'<path d="M5 4h11l3 3v13H5z"/><path d="M8 4v5h7V4M8 20v-6h8v6"/>',
  reload:'<path d="M4 12a8 8 0 0 1 14-5.3L20 9"/><path d="M20 4v5h-5"/><path d="M20 12a8 8 0 0 1-14 5.3L4 15"/>',
  page:'<path d="M7 3.5h7l4 4v13H7z"/><path d="M14 3.5v4h4"/>',
};
const svgIcon = path=> '<svg viewBox="0 0 24 24" aria-hidden="true">'+path+'</svg>';

/**
 * Every word of the query must match; each scores higher at the start of a
 * word. `exact` turns off the subsequence fallback — used for descriptions,
 * where a loose match finds "d…r…y" in any long enough sentence.
 */
function cpScore(text, q, exact){
  const t=String(text||'').toLowerCase();
  let total=0;
  for(const w of q.split(/\s+/).filter(Boolean)){
    const i=t.indexOf(w);
    if(i===0) total+=100;
    else if(i>0) total+= /[\s(\-·:/]/.test(t[i-1])? 80 : 55;
    else {
      if(exact) return 0;
      let from=0, last=-1, gaps=0;
      for(const ch of w){ const k=t.indexOf(ch,from); if(k<0) return 0; if(last>=0) gaps+=k-last-1; last=k; from=k+1; }
      if(gaps>w.length*3) return 0;
      total+=Math.max(5, 35-gaps*2);
    }
  }
  return total - t.length*0.05;
}
function cpHighlight(text, q){
  const frag=document.createDocumentFragment();
  const words=q.split(/\s+/).filter(Boolean).sort((a,b)=>b.length-a.length);
  const lower=text.toLowerCase();
  const marks=[];
  words.forEach(w=>{ const i=lower.indexOf(w); if(i>=0 && !marks.some(m=> i<m[1] && i+w.length>m[0])) marks.push([i,i+w.length]); });
  marks.sort((a,b)=>a[0]-b[0]);
  let at=0;
  marks.forEach(([a,b])=>{ frag.append(document.createTextNode(text.slice(at,a))); frag.append(el('mark',null,text.slice(a,b))); at=b; });
  frag.append(document.createTextNode(text.slice(at)));
  return frag;
}

function cpCommands(){
  const c=[];
  const cmd=(title, sub, icon, run, kw)=> c.push({group:'Commands', title, sub, icon:svgIcon(CP_ICONS[icon]||CP_ICONS.page), run, kw:kw||''});
  const via = body=> SRV.up? syncCmd(body) : 'copies: '+syncCmd(body);
  cmd('Sync stale sources', via({}), 'sync', ()=>runSync({}, 'Sync'), 'refresh update fetch pull');
  SYNC_PRESETS.forEach(p=> cmd('Sync: '+p.label, p.hint, 'sync', ()=>runSync({only:p.only}, p.label), 'refresh '+p.only));
  cmd('Dry run — what would sync', via({dryRun:true}), 'sync', ()=>runSync({dryRun:true}, 'Dry run'), 'check stale');
  cmd('Force sync everything', via({force:true}), 'sync', ()=>runSync({force:true}, 'Forced sync'), 'refresh all full');
  (DATA.steps||[]).filter(s=>!s.always).forEach(s=> cmd('Sync one: '+s.label, via({only:s.name}), 'sync', ()=>runSync({only:s.name}, s.label), s.name));
  cmd('Toggle comfortable / compact tables', 'now '+document.documentElement.getAttribute('data-tv'), 'theme', ()=>{ const v=setTableView(document.documentElement.getAttribute('data-tv')==='compact'? 'comfortable' : 'compact'); LOG.add('info','Tables: '+v,'page',{toast:false}); }, 'density table view compact comfortable rows');
  cmd('Toggle light / dark theme', 'now '+(document.documentElement.getAttribute('data-theme')||'following the system'), 'theme', ()=>{ const t=toggleTheme(); LOG.add('info','Theme: '+t,'page',{toast:false}); }, 'dark mode light mode appearance');
  cmd('Open the log', 'every line every sync printed', 'log', ()=>go('log'), 'terminal history output errors');
  cmd(LOG.cleared()? 'Show every log line again' : 'Clear the log view', 'the file on disk is untouched', 'log', ()=>{ if(LOG.cleared()) LOG.restoreView(); else LOG.clearView(); if(page==='log') render(); }, 'reset');
  cmd('Copy the ESPN / Yahoo scores bookmarklet', SRV.up? 'for past weeks MyPlaybook cannot fetch' : 'copies: node src/cli.js scores:script', 'copy', async()=>{
    if(!SRV.up){ const ok=await copyText('node src/cli.js scores:script'); LOG.add('warn',(ok?'Copied: ':'Run: ')+'node src/cli.js scores:script','page'); return; }
    try{ const {href}=await api('/api/scores-bookmarklet'); await copyText(href); LOG.add('ok','Bookmarklet copied — paste it as a bookmark’s URL.','scores'); }catch(e){ LOG.add('error',e.message,'scores'); }
  }, 'past weeks');
  const nEd=Object.keys(edits.all()).length;
  if(nEd){
    cmd('Save League Setup edits', nEd+' league(s) changed in this browser', 'save', ()=>{ if(SRV.up) saveEditsToServer(el('button')); else { go('manage'); exportEdits(); } }, 'export overrides');
  }
  cmd('Copy a link to this view', location.href.replace(/^https?:\/\//,'').slice(0,60), 'copy', async()=>{ toast((await copyText(location.href))? 'Link copied.' : 'Copy was blocked.',{level:'ok'}); }, 'share url');
  cmd('Reload the page', 'picks up a rebuilt dashboard', 'reload', ()=>location.reload(), 'refresh');
  return c;
}
function cpPages(){
  return PAGES.map(p=>{
    const g=GROUPS.find(x=>x.id===p.group);
    return {group:'Pages', title:p.label, sub: p.group==='league'? leagueLabel(L())+' · '+(p.section||'') : g.label,
      icon:svgIcon(g.icon), run:()=>go(p.id), kw:g.label+' '+(p.section||''), current:p.id===page};
  });
}
function cpLeagues(){
  return leagues.map(l=>({group:'Leagues', title:leagueLabel(l), sub:[l.host,l.scoring,l.teams.length+' teams', l===current? 'current' : null].filter(Boolean).join(' · '),
    node:()=> hostDot(l), run:()=> go(groupOf(page)==='league'? page : 'myteam', {league:l}), kw:l.host+' '+l.name+' league switch'}));
}
function cpPlayers(q){
  const pool=universe(scoringKey(L())), own=rosterIndex(L());
  const hits=[];
  // Names are matched on whole substrings: across ~500 players a fuzzy
  // subsequence turns "jef" into Joe Flacco and Jared Goff.
  const words=q.split(/\s+/).filter(Boolean);
  pool.forEach(p=>{
    const n=String(p.n||'').toLowerCase();
    if(!words.every(w=> n.includes(w))) return;
    const s=cpScore(p.n, q);
    if(s>0) hits.push({p, s: s - (p.rk? Math.min(p.rk,400)/40 : 10)});
  });
  return hits.sort((a,b)=>b.s-a.s).slice(0,8).map(({p})=>{
    const o=own.get(p.i);
    return {group:'Players', title:p.n||('fpId '+p.i),
      sub:[p.p, p.t, wkPts(p)!=null? 'wk '+fmt(wkPts(p))+' pts' : null, o? (o.mine? 'your team' : o.name) : 'free agent in '+leagueLabel(L())].filter(Boolean).join(' · '),
      node:()=> imgEl(p.s? 'https://sleepercdn.com/content/nfl/players/thumb/'+p.s+'.jpg' : (String(p.p).toUpperCase()==='DST' && p.t? teamLogo(p.t) : null)),
      run:()=> openPlayer(p.i), score:1};
  });
}
function cpBuild(raw){
  const q=String(raw||'').trim().toLowerCase();
  const mode = q.startsWith('>')? 'cmd' : (q.startsWith('@')? 'player' : 'all');
  const qq = mode==='all'? q : q.slice(1).trim();
  if(!qq){
    if(mode==='player') return [];
    const cmds=cpCommands();
    if(mode==='cmd') return cmds;
    return [...cmds.slice(0,5), ...cpPages().filter(p=>!p.current), ...cpLeagues()];
  }
  const rank=list=> list.map(it=>({it, s:Math.max(cpScore(it.title,qq), cpScore(it.title+' '+(it.kw||'')+' '+(it.sub||''),qq,true)*0.7)}))
    .filter(x=>x.s>0).sort((a,b)=>b.s-a.s).map(x=>x.it);
  if(mode==='cmd') return rank(cpCommands());
  if(mode==='player') return qq.length>=2? cpPlayers(qq) : [];
  const out=[];
  const pages=rank(cpPages()).slice(0,6), lgs=rank(cpLeagues()).slice(0,5), cmds=rank(cpCommands()).slice(0,6);
  const players = qq.length>=2? cpPlayers(qq) : [];
  // The group that matched best leads.
  const groups=[['Pages',pages],['Leagues',lgs],['Players',players],['Commands',cmds]].filter(g=>g[1].length);
  const best=g=> g[0]==='Players'? cpScore(g[1][0].title,qq)+1 : cpScore(g[1][0].title,qq);
  groups.sort((a,b)=> best(b)-best(a)).forEach(g=> out.push(...g[1]));
  return out;
}

function openPalette(initial){
  if(CP.open){ const i=CP.back.querySelector('input'); if(i){ i.focus(); i.select(); } return; }
  CP.open=true; CP.from=document.activeElement; CP.q=initial||''; CP.sel=0;
  const back=el('div','cp-back'); CP.back=back;
  back.addEventListener('mousedown',e=>{ if(e.target===back) closePalette(); });
  const dlg=el('div','cp'); dlg.setAttribute('role','dialog'); dlg.setAttribute('aria-modal','true'); dlg.setAttribute('aria-label','Search and commands');
  const inp=el('div','cp-in');
  inp.insertAdjacentHTML('beforeend','<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4.5 4.5"/></svg>');
  const input=el('input'); input.type='text'; input.value=CP.q; input.spellcheck=false; input.autocomplete='off';
  input.placeholder='Search players, pages, leagues — or > for commands';
  input.setAttribute('role','combobox'); input.setAttribute('aria-expanded','true'); input.setAttribute('aria-controls','cp-list'); input.setAttribute('aria-autocomplete','list');
  inp.append(input, el('kbd',null,'esc'));
  const list=el('div','cp-list'); list.id='cp-list'; list.setAttribute('role','listbox');
  const foot=el('div','cp-foot');
  [['↑↓','move'],['↵','open'],['>','commands'],['@','players']].forEach(([k,t])=>{ const s=el('span'); s.append(el('kbd',null,k), document.createTextNode(t)); foot.append(s); });
  foot.append(el('span','spacer'));
  foot.append(serverPill());
  dlg.append(inp, list, foot);
  back.append(dlg);
  document.body.append(back);

  const draw=()=>{
    CP.items=cpBuild(input.value);
    if(CP.sel>=CP.items.length) CP.sel=Math.max(0,CP.items.length-1);
    list.innerHTML='';
    if(!CP.items.length){
      list.append(el('div','cp-empty', input.value.trim().startsWith('@') && input.value.trim().length<3 ? 'Type a player’s name.' : 'Nothing matches “'+input.value.trim()+'”.'));
      input.removeAttribute('aria-activedescendant');
      return;
    }
    const q=input.value.trim().replace(/^[>@]/,'').trim().toLowerCase();
    let group=null;
    CP.items.forEach((it,i)=>{
      if(it.group!==group){ group=it.group; list.append(el('div','cp-sec',group)); }
      const row=el('div','cp-item'); row.id='cp-o'+i; row.setAttribute('role','option'); row.setAttribute('aria-selected',String(i===CP.sel));
      const ic=el('span','cp-ic');
      if(it.node) ic.append(it.node()); else if(it.icon) ic.innerHTML=it.icon;
      row.append(ic);
      const tx=el('div','cp-tx');
      const t=el('span','cp-t'); t.append(q? cpHighlight(it.title,q) : document.createTextNode(it.title));
      tx.append(t);
      if(it.sub) tx.append(el('span','cp-s',it.sub));
      row.append(tx);
      if(it.current) row.append(el('span','cp-k','current'));
      row.addEventListener('mousemove',()=>{ if(CP.sel!==i) select(i, false); });
      row.addEventListener('click',()=> runItem(i));
      list.append(row);
    });
    input.setAttribute('aria-activedescendant','cp-o'+CP.sel);
  };
  const select=(i, scroll)=>{
    const prev=list.querySelector('[aria-selected="true"]'); if(prev) prev.setAttribute('aria-selected','false');
    CP.sel=i;
    const row=document.getElementById('cp-o'+i);
    if(row){ row.setAttribute('aria-selected','true'); if(scroll!==false) row.scrollIntoView({block:'nearest'}); }
    input.setAttribute('aria-activedescendant','cp-o'+i);
  };
  const runItem=(i)=>{
    const it=CP.items[i]; if(!it) return;
    closePalette(true);
    Promise.resolve().then(()=> it.run());
  };
  input.addEventListener('input',()=>{ CP.sel=0; draw(); });
  input.addEventListener('keydown',e=>{
    if(e.key==='ArrowDown'){ e.preventDefault(); if(CP.items.length) select((CP.sel+1)%CP.items.length); }
    else if(e.key==='ArrowUp'){ e.preventDefault(); if(CP.items.length) select((CP.sel-1+CP.items.length)%CP.items.length); }
    else if(e.key==='Enter'){ e.preventDefault(); runItem(CP.sel); }
    else if(e.key==='Escape'){ e.preventDefault(); e.stopPropagation(); closePalette(); }
    else if(e.key==='Tab'){ e.preventDefault(); }
  });
  draw();
  input.focus(); input.select();
}
function closePalette(leaving){
  if(!CP.open) return;
  CP.open=false;
  if(CP.back) CP.back.remove();
  CP.back=null;
  if(!leaving && CP.from && CP.from.isConnected) CP.from.focus();
  CP.from=null;
}
const isTyping = t=> t && (t.isContentEditable || /^(INPUT|TEXTAREA|SELECT)$/.test(t.tagName));
document.addEventListener('keydown',e=>{
  if((e.metaKey||e.ctrlKey) && !e.altKey && String(e.key).toLowerCase()==='k'){ e.preventDefault(); if(CP.open) closePalette(); else openPalette(); return; }
  if(e.key==='/' && !CP.open && !isTyping(e.target) && !e.metaKey && !e.ctrlKey){ e.preventDefault(); openPalette(); }
});
$('#cmdBtn').addEventListener('click',()=> openPalette());
$('#cmdKey').textContent = /Mac|iPhone|iPad/.test(navigator.platform||navigator.userAgent)? '⌘K' : 'Ctrl K';

function crumb(){

}

  const h=readHash();

  if(h.hz) horizonKey=parseHz(h.hz).key;
  renderChrome(); render();
});
writeHash();

renderTermLine();
probe();
