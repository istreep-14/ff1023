/* ---------- local edits ----------
 *
 * This page is a static file with no server, so an edit has nowhere to go but
 * the browser. It goes to localStorage, layered OVER the overrides the build
 * baked in from data/league-overrides.json, and Export writes the merged result
 * back out as a file for `league:import`.
 *
 * The layering matters: a value you changed here and a value already committed
 * to the file must be distinguishable, or "Export" would silently re-assert
 * every default as if you had chosen it. Only genuinely changed keys are kept.
 */
const edits = (()=>{
  const KEY='gd.leagueEdits';
  let mem={};
  try{ mem=JSON.parse(localStorage.getItem(KEY)||'{}')||{}; }catch{ mem={}; }
  const persist=()=>{ try{ localStorage.setItem(KEY, JSON.stringify(mem)); }catch{ /* private window */ } };
  return {
    all: ()=>mem,
    forLeague: (key)=> mem[key] || {},
    /** How many fields this league has pending, for the nav badge. */
    count: (key)=>{
      const e=mem[key]; if(!e) return 0;
      let n=0;
      for(const [k,v] of Object.entries(e)){
        if(v==null) continue;
        if(k==='teams'||k==='scoring') n+=Object.keys(v).length;
        else if(k==='playoffs'||k==='waivers') n+=Object.values(v).filter(x=>x!=null&&x!=='').length;
        else if(Array.isArray(v)) n+= v.length?1:0;
        else n++;
      }
      return n;
    },
    set(key, patch){
      const cur=mem[key]||{};
      mem[key]={...cur, ...patch,
        playoffs:{...(cur.playoffs||{}), ...(patch.playoffs||{})},
        waivers:{...(cur.waivers||{}), ...(patch.waivers||{})},
        teams:{...(cur.teams||{}), ...(patch.teams||{})}};
      persist();
    },
    setTeam(key, teamId, patch){
      const cur=mem[key]||{}; const teams={...(cur.teams||{})};
      teams[String(teamId)]={...(teams[String(teamId)]||{}), ...patch};
      mem[key]={...cur, teams}; persist();
    },
    clear(key){ delete mem[key]; persist(); },
    clearAll(){ mem={}; persist(); },
  };
})();

/** The effective override for a league: what was built in, plus local edits. */
/** Per-team, field by field — a team's nickname, abbreviation and division are edited independently. */
function mergeTeamEdits(base, edits){
  const out={...(base||{})};
  for(const [id,f] of Object.entries(edits||{})) out[id]={...(out[id]||{}), ...f};
  return out;
}
function ovFor(l){
  const base=l.overrides||{}, e=edits.forLeague(l.key);

    ...base, ...e,

    waivers:{...(base.waivers||{}), ...(e.waivers||{})},
    scoring:{...(base.scoring||{}), ...(e.scoring||{})},
    teams: mergeTeamEdits(base.teams, e.teams),
    divisions: e.divisions || base.divisions || [],

}

  if(id==='manage') return edits.count(l.key)? String(edits.count(l.key)) : '';
  // How old each site's pull is, so a stale source shows in the rail before it is opened.
  const site=siteOfPage(id);
  if(site){ const f=freshOf(site.feeds[0].ledger); return f? ago(f.fetchedAt).split(' ')[0] : '—'; }
  if(id==='sources'){ const n=new Set(FEED_SITES.flatMap(s=>s.feeds.map(f=>f.ledger))); const st=[...n].filter(k=>{ const f=freshOf(k); return f && f.stale; }).length; return st? st+' stale' : ''; }
  return '';
}

/**

/** "wk 2\u201318", the weeks a rest-of-season number spans. */
const rosSpan = ()=> 'wk '+DATA.week+'\u2013'+LAST_WEEK;

/* ---------- ranges and the trade market ---------- */
/** A column that opens a group: draws the divider on its header and every cell. */
function sepCol(c){
  const inner=c.cell, tot=c.total;
  c.sep=1;
  c.cell=p=>{ const td=inner(p); td.classList.add('tsep'); return td; };
  if(tot) c.total=l=>{ const td=tot(l); td.classList.add('tsep'); return td; };

const dashCell=(tip)=> cell('blank', null, {tip});

/** FantasyPros' own rank on the board this window reads: weekly, or rest of season. */
function ecrOf(p,h){ return hzMode(h)==='ros'? p.rosRk : p.rk; }
function ecrCell(p,h){
  const v=ecrOf(p,h), td=el('td','r num');
  td.textContent = v==null? '—' : String(v);
  return td;
}
function tradeDates(){ const t=DATA.trade && DATA.trade[scoringKey(L())]; return t? (t.dates||[]) : []; }
const tmNums = p=> (p.tm && p.tm.s)? p.tm.s.filter(x=>x!=null) : [];
/** Latest minus earliest priced day in the window, or null with fewer than two days. */
function tmChange(p){ const v=tmNums(p); return v.length<2? null : v[v.length-1]-v[0]; }
const UNPRICED='Not priced on the trade market: FantasyPros gives no value for kickers, defenses or fringe players';

function tmValueCell(p){
  if(!p.tm || p.tm.v==null){ return dashCell(UNPRICED); }
  const td=stackCell(String(p.tm.v), p.tm.pr!=null? (p.p||'')+p.tm.pr : '', {});
  td.title='Trade value '+p.tm.v+(p.tm.rk!=null? ' — #'+p.tm.rk+' overall' : '')+(p.tm.pr!=null? ', '+(p.p||'')+p.tm.pr+' at his position' : '')
    +(p.tm.x!=null? '. Experts value him '+(p.tm.x<0? Math.abs(p.tm.x)+' less' : p.tm.x+' more')+' than the market does' : '');
  return td;
}
function tmChangeCell(p){
  if(!p.tm) return dashCell(UNPRICED);
  const d=tmChange(p);
  if(d==null) return dashCell('Fewer than two days of trade history');
  const td=el('td','r'); td.dataset.v=String(d);
  const sp=el('span','delta '+(d>0?'up':d<0?'dn':'flat'), d===0? '0' : (d>0?'▲':'▼')+Math.abs(d));
  const n=(p.tm.n||[]).filter(x=>x!=null).reduce((a,b)=>a+b,0);
  sp.title='Trade value '+(d>0?'rose':d<0?'fell':'did not move')+' by '+Math.abs(d)+' over '+tmNums(p).length+' days'+(p.tm.n? '; '+n+' trades involved him' : '');
  td.append(sp); return td;
}
const SVGNS='http://www.w3.org/2000/svg';
/** A bare line: no axes, no fill. It answers "up, down or flat", nothing more. */
function sparkline(vals, dates){
  const W=70,H=20,pad=2, pts=vals.map((v,i)=>[i,v]).filter(x=>x[1]!=null);
  const svg=document.createElementNS(SVGNS,'svg');
  svg.setAttribute('viewBox','0 0 '+W+' '+H); svg.setAttribute('width',W); svg.setAttribute('height',H);
  svg.setAttribute('class','spark'); svg.setAttribute('aria-hidden','true');
  if(pts.length<2) return svg;
  const lo=Math.min(...pts.map(x=>x[1])), hi=Math.max(...pts.map(x=>x[1])), span=hi-lo;
  const X=i=> pad+(vals.length>1? i/(vals.length-1) : 0)*(W-2*pad);
  // A flat series is drawn along the middle rather than stretched to fill.
  const Y=v=> span===0? H/2 : H-pad-((v-lo)/span)*(H-2*pad);
  const path=document.createElementNS(SVGNS,'path');
  path.setAttribute('d', pts.map((x,k)=>(k?'L':'M')+X(x[0]).toFixed(1)+' '+Y(x[1]).toFixed(1)).join(' '));
  svg.append(path);
  const last=pts[pts.length-1], dot=document.createElementNS(SVGNS,'circle');
  dot.setAttribute('cx',X(last[0]).toFixed(1)); dot.setAttribute('cy',Y(last[1]).toFixed(1)); dot.setAttribute('r','2');
  svg.append(dot);
  const dir=pts[pts.length-1][1]-pts[0][1];
  svg.setAttribute('class','spark '+(dir>0?'up':dir<0?'dn':'flat'));
  return svg;
}
function tmSparkCell(p){
  if(!p.tm || !p.tm.s) return dashCell(p.tm? 'No daily history for him' : UNPRICED);
  const td=el('td','r'); td.append(sparkline(p.tm.s, tradeDates()));
  const dates=tradeDates();
  td.title=p.tm.s.map((v,i)=> (dates[i]||('day '+(i+1)))+': '+(v==null? '—' : v)).join('\n');
  const ch=tmChange(p); if(ch!=null) td.dataset.v=String(ch);
  return td;
}

/**
 * The one list of projection columns, for every table that shows players against
 * the sources: My Team (lineup and by-position), All Rosters, matchup rosters and
 * the Players page. Each descriptor carries its own header, width, band, cell and
 * (where it means anything) total, so a page cannot show a column another page
 * lacks or order the same groups differently. Which groups appear is `colGroups`.
 *
 *   Consensus   the agreed number (metric 'agreed'): position rank and points
 *   sources     each source's own number for the window, as published
 *   Info        opponent, and on Players the trend and grade; the % rostered
 *   Buzz        adds, drops, starts and roster % from Sleeper and Yahoo
 *   Actual      points scored that week — the league's own number when a
 *               lineup has it, otherwise Sleeper's published points
 */
function columnsFor(scope, o){
  o=o||{};
  const h=hzOf(scope), mode=hzMode(h);
  const ranked = h.kind==='ros' || mode==='week';
  const consBand='Consensus';
  const cols=[];
  // `o.groups` pins the column groups for a tab that decides its own; otherwise the shared chips do.
  const on=g=> o.groups? o.groups.includes(g) : colGroups.has(g);
  if(h.kind==='overview') return overviewColumns(o, on);
  if(h.kind==='log') return toneCols(logColumns(h, o, on));

  // The core set, always on: rank (with its outlook), the headline number,
  // and — for a single week — the matchup. Sources, info, trade and buzz are
  // opt-in groups after it, so the default table is four or five numbers wide.
  if(on('cons')){
    const wkNow=h.kind==='week' && h.from===DATA.week;
    const rkLab=h.kind==='ros'? 'ROS rank' : h.kind==='week'? (wkNow? 'Wk rank' : 'Wk '+h.from+' rank') : 'Rank';
    cols.push({key:'consrk', label:rkLab, w:112, r:1, sep:1, band:consBand, tone:'key',
      title:'His position rank on the agreed board (FantasyPros and Draft Sharks, one vote per site). The marks beside it: how far FantasyPros’ experts spread around that rank, and Draft Sharks’ floor and ceiling around its projection — green reaches up, red down.',
      cell:p=> rankOutlookCell(p,h), total:()=> el('td','r tsep')});
    if(h.kind==='ros'){
      // Keyed 'cons' so the default sort (consOrder: League Value here) is marked on this header.
      cols.push({key:'cons', label:'Value', w:72, r:1, band:consBand, tone:'key', kind:'num',
        title:'League Value: rest-of-season points over a replacement player in this league, at the agreed position rank',
        get:p=> rosValue(p),
        cell:p=>{ const v=rosValue(p), td=stackCell(v==null? null : fxValue(v), null, {}); const x=v==null? null : lvFor(L()).players.get(p.i);
          if(x) td.title=fxValue(x.value)+' pts over a replacement '+(p.p||'')+' ('+fxValue(x.replacement)+' pts over his '+(x.games??'')+' games) · #'+x.rank+' in this league';
          return td; },
        total:list=> stackCell(fxValue(sum(list,p=> rosValue(p)??0)),'',{big:1})});
      cols.push({key:'conspts', label:'Pts', w:64, r:1, band:consBand, tone:'aux', kind:'num',
        title:'Agreed rest-of-season points: the per-game points at his agreed rank, times his games left',
        get:p=>{ const m=metric(p,'agreed',h); return m? m.v : null; },
        cell:p=>{ const m=metric(p,'agreed',h); return stackCell(fmt(m&&m.v), null, {}); },
        total:list=> stackCell(fmt(sum(list,p=>{ const m=metric(p,'agreed',h); return m? m.v : 0; })),'',{})});
    } else {
      const lab=h.kind==='season'? 'Season' : 'Proj';
      cols.push({key:'cons', label:lab, w:64, r:1, band:consBand, kind:'num',
        title:'Agreed points: FantasyPros and Draft Sharks, one vote per site, ranked within position and priced off their own points curve',
        get:p=>{ const m=metric(p,'agreed',h); return m? m.v : null; },
        cell:p=> consPtsCell(p,h),
        total:list=> stackCell(fmt(sum(list,p=>{ const m=metric(p,'agreed',h); return m? m.v : 0; })),'',{big:1})});
    }
    if(mode==='week') cols.push({key:'opp', label:'Opp · SOS', w:96, r:1, band:'',
      title:'This week’s opponent, with Draft Sharks’ strength-of-schedule rating for the matchup — positive is easier, negative is tougher',
      cell:p=> oppCell(p,h)});
  }

  if(on('fp')){
    const fpBand='FantasyPros';
    cols.push({key:'fp', label:'Pts', w:PROJW, r:1, sep:1, band:fpBand, kind:'num',
      title:'FantasyPros’ own number for the window, as published',
      get:p=>{ const m=metric(p,'fp',h); return m? m.v : null; },
      cell:p=>{ const m=metric(p,'fp',h); return stackCell(fmt(m&&m.v), null, {sep:1}); },
      total:list=> stackCell(fmt(sum(list,p=>{ const m=metric(p,'fp',h); return m? m.v : 0; })),'',{sep:1})});
    if(ranked) cols.push({key:'ecr', label:'ECR', w:48, r:1, band:fpBand,
      title:'FantasyPros expert consensus rank (overall). Its expert range is in the rank column’s outlook.',
      cell:p=> ecrCell(p,h), total:()=> el('td','r')});
  }

  if(on('src')){
    cols.push(Object.assign(srcCol('ds'), {
      key:'s-ds', label:'Pts', node:null, band:'Draft Sharks', sep:1, kind:'num',
      get:p=>{ const m=metric(p,'ds',h); return m? m.v : null; },
      cell:p=> srcCell(p,'ds',h,true),
      total:list=> stackCell(fmt(sum(list, p=>{ const m=metric(p,'ds',h); return m? m.v : 0; })),'',{}),
    }));
  }

  if(on('info')){
    const info=(c)=> cols.push(Object.assign({band:'Info', r:1}, c));
    if(o.players && mode==='week') info({key:'trend', label:'Trend', w:56, title:'Change in the expert consensus rank since the last update', cell:trendCell});
    if(o.players) info({key:'grade', label:'Grade', w:56, title:'FantasyPros start/sit grade', cell:gradeBadgeCell});
    info({key:'own', label:'FP %', w:PROJW, title:'Rostered across FantasyPros leagues (the weekly board)',
      cell:p=> stackCell(p.own==null?'—':Math.round(p.own)+'%','',{}) });
    const lead=cols.find(c=>c.band==='Info');
    if(lead){
      lead.sep=1;
      const inner=lead.cell;
      lead.cell=p=>{ const td=inner(p); td.classList.add('tsep'); return td; };
    }
  }

  if(on('mkt')){
    const nd=tradeDates().length;
    const band='Trade market';
    cols.push(sepCol({key:'tm', label:'Value', w:84, r:1, band,
      title:'What managers actually trade for on FantasyPros, on a ~1000 scale (the most valued player is about 1000). Blank means unpriced.',
      cell:tmValueCell, total:()=> el('td','r')}));
    cols.push({key:'tmd', label:nd? nd+'d' : 'Chg', w:52, r:1, band,
      title:'Change in trade value over the window'+(nd? ' ('+nd+' days)' : ''), cell:tmChangeCell, total:()=> el('td','r')});
    cols.push({key:'tms', label:'Chart', w:78, r:1, band,
      title:'Daily trade value across the window', cell:tmSparkCell, total:()=> el('td','r')});
  }

  if(on('buzz')) buzzColumns().forEach(c=> cols.push(c));
  if(on('vg') && h.kind==='week' && h.from===Number(DATA.week)) vegasCols().forEach(c=> cols.push(c));

  // Any single week, including a past one. `mode==='week'` is only the live
  // week; a finished week is a span to the projection columns, but it still
  // has a score.
  if(h.kind==='week' && !o.noActual){
    const at=cols.findIndex(c=>c.key==='cons');
    if(at>=0) cols.splice(at+1, 0, scoreCol(h.from));
    else cols.push(sepCol(scoreCol(h.from)));
  }
  return toneCols(cols);
}
/**
 * Tone: each band's headline number leads and its context recedes, the same
 * hierarchy as a name over its subtext. Twelve equal-weight numbers in a row
 * left the eye nothing to land on.
 */
function toneCols(cols){
  cols.forEach(c=>{
    const tone=c.tone||COL_TONE[c.key];
    if(!tone || c.toned) return;
    c.tone=tone; c.toned=1;
    const inner=c.cell;
    c.cell=p=>{ const td=inner(p); td.classList.add('t-'+tone); return td; };
  });
  return cols;
}

/** A source's own rest-of-season position rank, as a plain column: FantasyPros' board or Draft Sharks'. */
function siteRankCol(key, band, rankOf, title){
  return {key, label:'Rank', w:64, r:1, band, tone:'aux', title,
    cell:p=>{ const v=rankOf(p); const td=cell('num', null, {text:v==null? FX_BLANK : (p.p||'')+v}); if(v!=null) td.dataset.v=String(v); return td; },
    total:()=> el('td','r')};
}
const fpRosRank = p=> p.rosPr!=null? Number(String(p.rosPr).replace(/\D/g,''))||null : null;
const dsRosRank = p=> p.ds && p.ds.rosPrk!=null? p.ds.rosPrk : null;

/**
 * The default view: what a player is worth from here on, with this week in
 * brief. Agreed ROS rank (with its outlook) and League Value, each site's own
 * ROS rank beside them, then this week's agreed projection and opponent — the
 * week pair says BYE rather than disappearing. Opt-in groups read rest of season.
 */
function overviewColumns(o, on){
  const ros=parseHz('ros'), wk=parseHz('w-'+DATA.week);
  const cols=[];
  if(on('cons')){
    // The agreed ROS rank, then the two ranks it is built from, then what it is worth here.
    const rosCols=columnsFor(ros,{groups:['cons']});
    cols.push(rosCols.find(c=>c.key==='consrk'));
    cols.push(Object.assign(siteRankCol('fprk','FantasyPros', fpRosRank, 'FantasyPros\u2019 rest-of-season expert consensus rank (ECR), within position'), {head:'ECR'}));
    cols.push(Object.assign(siteRankCol('dsrk','Draft Sharks', dsRosRank, 'Draft Sharks\u2019 own rest-of-season position rank'), {head:'DS'}));
    cols.push(sepCol(Object.assign({}, rosCols.find(c=>c.key==='cons'))));
    const wkPt=p=>{ const m=metric(p,'agreed',wk); return m? m.v : null; };
    cols.push(sepCol({key:'wkproj', label:'Wk '+DATA.week, w:64, r:1, band:'', kind:'num',
      title:'This week\u2019s agreed projection (FantasyPros and Draft Sharks, one vote per site)',
      get:wkPt,
      cell:p=> isBye(p,DATA.week)? dashCell('On bye this week') : stackCell(fmt(wkPt(p)), null, {}),
      total:list=> stackCell(fmt(sum(list,p=> wkPt(p)??0)),'',{})}));
    if(weekLive(DATA.pools[scoringKey(L())])) cols.push(Object.assign(scoreCol(DATA.week), {key:'wkpts'}));
    const opp=columnsFor(wk,{groups:['cons'], noActual:true}).find(c=>c.key==='opp');
    if(opp) cols.push(Object.assign({}, opp, {label:'Opp'}));
    // Form and timing: recent points per game against the projection, and the bye still to come.
    if((Number(DATA.week)||1)>1){
      const l3=parseHz('l3'), ppg=p=>{ const x=logOf(p,l3); return x? x.ppg : null; };
      cols.push(sepCol({key:'l3', label:'L3', w:56, r:1, band:'', tone:'aux', kind:'num',
        title:'Points per game over the last 3 completed weeks (wk '+l3.from+'\u2013'+l3.to+')',
        get:ppg, cell:p=>{ const v=ppg(p); return v==null? dashCell('No games in the last 3 weeks') : stackCell(fmt(v), null, {}); },
        total:()=> el('td','r')}));
    }
    cols.push({key:'bye', label:'Bye', w:48, r:1, band:'', tone:'aux',
      title:'His bye week, while it is still to come',
      cell:p=>{ const b=Number(p.bye ?? (p.sch && p.sch.bye)); const up=Number.isFinite(b) && b>=(Number(DATA.week)||1);
        const td=cell('num', null, {text:up? String(b) : FX_BLANK}); td.dataset.v=String(up? b : 99); return td; },
      total:()=> el('td','r')});
  }
  const more=[...(o.groups||[...colGroups])].filter(g=> g!=='cons' && g!=='vg');
  if(more.length) cols.push(...columnsFor(ros, Object.assign({}, o, {groups:more})));
  // VegasEdge has no rest of season; its columns read this week.
  if(on('vg')) cols.push(...vegasCols());
  return toneCols(cols);
}

/**
 * VegasEdge, this week: its points (dimmed when a prop is missing — the
 * number is then built off part of a market), its position rank among
 * complete markets, the p10–p90 range as a bar with the median marked,
 * boom/bust share, and the skew. Never an input to the agreed number.
 */
const VG_SCALE = 45;
const VG_TAG = {'High Floor':'floor', 'Volatile':'vol', 'Balanced':'bal'};
const VG_TAG_BLURB = {
  'High Floor':'This week’s markets price his range narrower than his position peers’ — steadier, less downside.',
  'Volatile':'This week’s markets price his range wider than his position peers’ — a higher ceiling, and a higher risk of a dud.',
  'Balanced':'This week’s markets price his range as typical for his position — neither a safety play nor a swing.',
};
function vgRangeCell(p){
  const v=p.vg;
  if(!v || v.fl==null || v.ce==null) return dashCell(v && v.ds && v.ds!=='ok'? 'Not simulated: '+String(v.ds).replace(/_/g,' ') : 'No VegasEdge distribution');
  const td=el('td','r vgr'), w=el('div','vgwrap'), bar=el('div','vgbar'), seg=el('i'), tick=el('b');
  const x=n=> Math.max(0, Math.min(100, n/VG_SCALE*100));
  seg.style.left=x(v.fl)+'%'; seg.style.width=Math.max(2, x(v.ce)-x(v.fl))+'%';
  tick.style.left=x(v.md)+'%';
  bar.append(seg, tick);
  w.append(bar, el('span','vgtx', fmt(v.fl,0)+'\u2013'+fmt(v.ce,0)));

/**

 * rest of season by League Value, then the agreed position rank (K and DST
 * have no value, so their rank orders them).
 */
function consOrder(p,h){
  const c=metric(p,'agreed',h);
  // A game log ranks the qualified first: one big game is not a top rank.
  if(hzMode(h)==='log') return !c? -1e4 : c.a? c.v : c.v-1e3;
  if(hzMode(h)!=='ros' || h.kind==='season') return c? c.v : -1;
  const v=rosValue(p);
  return (v??-1)*1e4 - (c&&c.a? c.a.posRank : 9999);

/**
 * How lopsided the opinion behind a rank is, for one window: FantasyPros'
 * experts (best and worst rank against their average) and Draft Sharks
 * (ceiling and floor against its projection — per game for ROS, as it
 * publishes them), written into the rank's hover. Null for a window neither
 * covers (a past or future single week).
 */
function outlookOf(p,h){
  const ros=hzMode(h)==='ros', wkNow=h.kind==='week' && h.from===DATA.week;
  if(!ros && !wkNow) return null;
  const lo=ros? p.rosMin : p.rmin, hi=ros? p.rosMax : p.rmax, av=ros? p.rosAve : p.rave;
  const fp= lo!=null && hi!=null && av!=null? {up:Math.max(0,av-lo), dn:Math.max(0,hi-av), base:Math.max(av,6), lo, hi, av} : null;
  const d=p.ds||{}, live=ros || !d.bye;
  const mid=live? (ros? d.rosW : d.wk) : null, fl=live? (ros? d.rosFloor : d.floor) : null, ce=live? (ros? d.rosCeiling : d.ceiling) : null;
  const ds= mid!=null && fl!=null && ce!=null && mid>0? {up:Math.max(0,ce-mid), dn:Math.max(0,mid-fl), base:mid, fl, ce, mid} : null;
  return fp || ds? {fp, ds, ros} : null;
}
function outlookTip(o, pos){

  if(o.fp) out.push('FantasyPros experts: '+pos+o.fp.lo+'\u2013'+pos+o.fp.hi+' (average '+fmt(o.fp.av,1)+')'+lean(o.fp,'leans up','leans down'));

  return out.join('\n');
}

/** Points Sleeper (or FantasyPros) stored for this player in one week. */
function weekActual(p, w){
  const a=p&&p.act;
  if(!a) return null;
  const v=a[w]!=null? a[w] : a[String(w)];
  return v==null? null : Number(v);
}
/**
 * This week's line for a player on the league's matchup boards: the league
 * board (every team's starters) under your own matchup, which is fetched
 * live and so wins. The roster's own game state is a sync older: it still
 * read "Not Started" for a Thursday game the matchup had as Final, so the
 * score never showed.
 */
const liveBoards=new WeakMap();
function liveLine(p){
  const l=L(), M=l && l.adv && l.adv.matchup, B=l && l.matchups;
  if(!l) return null;
  if(!liveBoards.has(l)){
    const m=new Map();
    if(B && B.ok && Number(B.week)===Number(DATA.week)) (B.rows||[]).forEach(r=> (r.sides||[]).forEach(s=> [...(s.starters||[]), ...(s.bench||[])].forEach(x=> m.set(x.i, {pts:x.pts, game:x.game}))));
    if(M && M.ok) [M.team1, M.team2].forEach(t=> t && [...(t.starters||[]), ...(t.bench||[])].forEach(x=> m.set(x.fpId, {pts:x.pts, game:x.game})));
    liveBoards.set(l, m);
  }
  return liveBoards.get(l).get(p.i) || null;
}
const gameOn = g=> !!(g && !['Not Started','Bye','BYE','FA'].includes(g));
/**
 * League scoring wins when the live board has him and the game has started.
 * Otherwise the weekly stat file is the number — a missing lineup is not
 * "no points". A kickoff that has not happened is not a zero.
 */
function shownPoints(p, wk){
  wk=Number(wk);
  const cur=Number(DATA.week)||1;
  const stat=weekActual(p, wk);
  if(wk===cur){
    const s=liveLine(p);
    if(s && gameOn(s.game) && s.pts!=null) return {v:s.pts, src:'league', game:s.game, final:/^Final/.test(s.game)};
    const onBoard=!!s || p.lslot!=null || p.lgame!=null;
    const game=s? s.game : p.lgame;
    if(onBoard && !gameOn(game)) return {v:null, src:'pre', game};
    if(onBoard && p.lp!=null) return {v:p.lp, src:'league', game, final:/^Final/.test(game||'')};
  }
  if(stat!=null) return {v:stat, src:'stats', final:wk<cur};
  return {v:null, src:'none'};
}

  const m=wk===Number(DATA.week) && r.final? metric(p,'agreed',parseHz('w-'+wk)) : null;
  const vs=m && m.v!=null && v!=null? (v>=m.v? ' beat' : ' miss') : '';
  const d=el('div','scored'+(show==='\u2014'||Number(v)===0? ' zero':'')+(r.src==='league'? '':' approx')+vs);
  d.textContent=show;

  else if(r.src==='pre') td.title=(r.game||'Not started')+' \u00b7 projected '+fmt(p.lproj);

/**
 * The window — this week, rest of season, full season. Shared by Players and
 * All Rosters so a number means the same thing everywhere. Parsing, labelling
 * and the option list are src/weekhorizon.js, inlined (the same file the tests
 * run); only what needs this page's `DATA` is here.
 */
/*__INLINE:weekhorizon.js__*/
const parseHz = raw=> parseHorizon(raw, {now: DATA.week||1});
const labelHz = h=> labelHorizon(h, {now: DATA.week||1});
const hzOptions = ()=> horizonOptions({now: DATA.week||1});
/** week: the current week; ros: rest of season, the full season or the overview; log: points already scored. */
const hzMode = h=> !h? 'week' : (h.kind==='ros'||h.kind==='season'||h.kind==='overview')? 'ros' : h.kind==='log'? 'log' : 'week';
/** The overview's numbers are the rest-of-season ones; it only adds this week beside them. */
const hzBase = h=> h && h.kind==='overview'? parseHz('ros') : h;
function hz(){ return parseHz(horizonKey); }
function setHorizon(v){
  horizonKey=parseHz(v).key;
  store.set('gd.horizon', horizonKey);
  writeHash(); render();
}
function horizonSelect(){
  const wrap=el('label','lbl');
  wrap.style.display='inline-flex'; wrap.style.alignItems='center'; wrap.style.gap='8px';
  wrap.append(document.createTextNode('Window'));
  const s=el('select','hz');
  const groups=new Map();
  hzOptions().forEach(o=>{
    const opt=document.createElement('option');
    opt.value=o.value; opt.textContent=o.label;
    if(!o.group){ s.append(opt); return; }
    if(!groups.has(o.group)){ const g=document.createElement('optgroup'); g.label=o.group; groups.set(o.group,g); s.append(g); }
    groups.get(o.group).append(opt);
  });
  s.value=horizonKey;
  s.onchange=()=>setHorizon(s.value);
  wrap.append(s);
  return wrap;
}

/** The window picker — the one thing that decides what every projection column means. */
function viewControls(){
  const w=el('span'); w.style.display='inline-flex'; w.style.gap='16px'; w.style.flexWrap='wrap'; w.style.alignItems='center';
  w.append(horizonSelect());
  return w;
}

function teamAbbr(t){
  const x=String(t||'').toUpperCase().replace(/[^A-Z]/g,'');
  return ({JAX:'JAC', WSH:'WAS', LA:'LAR', SD:'LAC', OAK:'LV'})[x] || x;
}
function schedFor(p, w){
  const rec=DATA.schedule && DATA.schedule.teams && DATA.schedule.teams[teamAbbr(p.t)];
  if(!rec) return null;
  if(rec.bye===w) return {bye:true, opp:null, home:null, date:null};
  const cell=rec.weeks && (rec.weeks[w]||rec.weeks[String(w)]);
  return cell? {bye:false, opp:cell.opp, home:!!cell.home, date:cell.date||null} : null;
}
/** Kickoff day and time, e.g. "Sun 1:00 PM". */
function kickoffLabel(p, w){
  const s=schedFor(p,w);
  if(!s || s.bye || !s.date) return null;
  const d=new Date(s.date);
  if(Number.isNaN(d.getTime())) return null;
  return d.toLocaleString(undefined,{weekday:'short', hour:'numeric', minute:'2-digit'});
}
function isBye(p, w){
  const s=schedFor(p,w);
  if(s) return !!s.bye;
  if(p.sch && p.sch.bye===w) return true;
  return false;
}
function oppLabel(p, w){
  if(isBye(p,w)) return 'BYE';
  const s=schedFor(p,w);
  if(s && s.opp) return s.home? s.opp : '@'+s.opp;
  if(w===DATA.week && p.opp) return p.opp;
  if(w===DATA.week && p.ds && p.ds.opp) return p.ds.opp;
  return '—';
}
/** Opponent, the matchup's strength as a meter under it, then kickoff as a small subtext line. */
function oppCell(p,h){
  const td=el('td','r num opp');
  const wrap=el('div','oppwrap');
  const line=el('div','oppline');
  const sos=hzMode(h)==='week' && p.ds && h.from===DATA.week? p.ds.sos : null;
  line.append(oppChip(oppLabel(p,h.from), sos));
  wrap.append(line);
  const kickoff = h.from===DATA.week? kickoffLabel(p,h.from) : null;
  if(kickoff){ wrap.append(Object.assign(el('div','ss'),{textContent:kickoff})); td.title=kickoff; }
  td.append(wrap);
  return td;
}
/**
 * The opponent in plain muted text, and only a clearly lopsided matchup
 * (Draft Sharks' strength of schedule past ±10) marks it: a small dot after
 * it, green easier, red tougher. The rating itself is on hover. A five-pip
 * meter, a tinted chip and a signed number on every row were each louder
 * than the projection beside them.
 */
function oppChip(label, sos){
  const c=el('span','oppc');
  const chip=el('span','oppname', label||'\u2014');
  c.append(chip);
  if(sos==null || label==='BYE') return c;
  const val=Math.round(sos);
  if(val>=10 || val<=-10) c.append(el('i','sosd '+(val>0? 'g' : 'b')));
  c.title='Draft Sharks\u2019 strength of schedule: '+(val>0?'+':'')+val+'% \u2014 positive is an easier matchup, negative a tougher one';
  return c;
}
const ROS_OF = {
  fp: p=> p.ros,
  ds: p=> p.ds && p.ds.ros,
};
const WEEK_OF = {
  fp: p=> p.wk,
  ds: p=> p.ds && !p.ds.bye && p.ds.wk,
};
const round2 = v=> Math.round(v*100)/100;

/** fpId -> the FantasyPros Sources-table row for one scoring format. */
const fpTableCache={};
function fpTableFor(sc){
  if(fpTableCache[sc]) return fpTableCache[sc];
  const rows=(DATA.sourceTables && DATA.sourceTables[sc] && DATA.sourceTables[sc].fp) || [];
  return fpTableCache[sc]=new Map(rows.map(r=>[r.i,r]));
}

/**
 * Points already scored this season. Rostered players carry it; a pool row
 * gets it from the FantasyPros source table.
 */
function playedPts(p){
  if(p.act){
    const vals=Object.values(p.act).filter(v=>v!=null);
    if(vals.length) return Math.round(vals.reduce((a,b)=>a+Number(b),0)*100)/100;
  }
  if(p.pts!=null) return p.pts;
  const row=fpTableFor(scoringKey(L())).get(p.i);
  return row && row.wkAct!=null? row.wkAct : 0;
}

/**
 * A source over a window: its current-week number, its rest-of-season figure
 * as published, or (full season) that plus what has been scored. Nothing is
 * spread or summed across weeks — a cell is what the site said, or empty.
 */
function horizonValue(p, src, h){
  h=hzBase(h||hz());
  if(h.kind==='log') return {v:null};
  if(h.kind==='season' || h.kind==='ros'){
    const f=ROS_OF[src], v=f && f(p);
    if(v==null || v===false) return {v:null};
    return {v:round2(Number(v)+(h.kind==='season'? playedPts(p) : 0)), real:true};
  }
  if(isBye(p,h.from)) return {v:null, bye:true};
  const f=WEEK_OF[src], v=f && f(p);
  return v!=null && v!==false? {v, real:true} : {v:null};
}

/* ---------- projections ----------
   Tables read one number through metric(): agreed (lvConsensus) for the main
   column, each site's published number for its own column. Sources tabs keep
   every field in its file. Ranks are computed once per table, over every
   player, and only looked up afterwards — so a rank never depends on the
   sort, the filter or the page. */

/** fpId -> the one row for that player, for one scoring format. */
const universeCache={};
function universe(sc){ return universeCache[sc] || (universeCache[sc]=new Map((DATA.pools[sc]||[]).map(p=>[p.i,p]))); }
const posOfFor = sc => id=>{ const p=universe(sc).get(id); return p? p.p : null; };

/**
 * FantasyPros' own number over a window: {v, rk, pr, pos}, or null.
 * `rk`/`pr` are FantasyPros' own overall/positional ranks — already computed
 * on the row, so there is nothing to rank here.
 */
/**
 * The agreed number: one position rank and one points figure per window,
 * this week and rest of season, from FantasyPros and Draft Sharks with one
 * vote per site (src/valuescale.js). Built like League Value — within-position
 * ranks only, priced off the sites' own points curve (leaguevalue.js
 * `lvConsensus`) — so no two sites' points are ever averaged player by player.
 * Every player table's main column reads it, through metric('agreed').
 */
const AGREED_POS=['QB','RB','WR','TE','K','DST'];
const agreedCache=new Map();
function agreedBoard(sc, ros){
  const k=sc+(ros? '|ros' : '|wk');
  if(!agreedCache.has(k)) agreedCache.set(k, lvConsensus(DATA.pools[sc]||[], vsSignals(ros? VS_SOURCES : VS_WEEK_SOURCES), AGREED_POS, ros? {games:vsGames} : {}));
  return agreedCache.get(k);
}
function agreed(p, ros){
  const x=p && agreedBoard(scoringKey(L()), ros).players.get(p.i);
  if(!x || x.points==null) return null;
  // Rest of season in a league, the rank is League Value's — the order of the
  // Value column — so "ROS rank", Value and "#" never disagree.
  const l=ros && L(), lv=l && l.teams? lvFor(l).players.get(p.i) : null;
  const posRank=lv && lv.posRank!=null? lv.posRank : x.posRank;
  return {v:x.points, posRank, pr:(p.p||'')+posRank, n:x.n, spread:x.spread, inputs:x.inputs};
}

function consFor(p, h){
  h=hzBase(h||hz());
  if(h.kind==='log'){ const x=logOf(p,h); return x && x.ppg!=null? {v:x.ppg, rk:null, pr:x.posRank!=null? (p.p||'')+x.posRank : null, pos:p.p, a:x.posRank!=null? {posRank:x.posRank} : null, log:x} : null; }
  if(h.kind==='ros'){ const a=agreed(p,true); return a? {v:a.v, rk:null, pr:a.pr, pos:p.p, a} : null; }
  if(h.kind==='week' && h.from===DATA.week){ const a=agreed(p,false); return a? {v:a.v, rk:null, pr:a.pr, pos:p.p, a} : null; }
  // A full season is what has been scored plus what is left.
  if(h.kind==='season'){
    const r=consFor(p, parseHz('ros'));
    return r? Object.assign({}, r, {v:r.v+playedPts(p), rk:null, pr:null}) : null;
  }
  return null;
}

/**
 * One number for a table cell, from the catalog id, for this window.
 *   agreed  lvConsensus — FantasyPros + Draft Sharks, one vote per site
 *   fp      FantasyPros as published (merged week points / ROS)
 *   ds      Draft Sharks as published (bye is empty, not 0)
 */
function metric(p, id, h){
  h=hzBase(h||hz());
  if(id==='agreed') return consFor(p,h);
  if(id==='fp'){
    let v=null;
    if(h.kind==='ros') v=p.ros;
    else if(h.kind==='week' && h.from===DATA.week) v=p.wk;
    else if(h.kind==='season' && p.ros!=null) v=round2(Number(p.ros)+playedPts(p));
    if(v==null) return null;
    const ros=h.kind==='ros'||h.kind==='season';
    return {v, rk: ros? p.rosRk??null : p.rk??null, pr: ros? p.rosPr??null : p.pr??null, pos:p.p};
  }
  if(id==='ds'){
    const r=horizonValue(p,'ds',h);
    if(r.v==null) return null;
    const ros=h.kind==='ros'||h.kind==='season';
    const prk=p.ds && (ros? p.ds.rosPrk : p.ds.prk);
    return {v:r.v, pr: prk!=null? (p.p||'')+prk : null, pos:p.p};
  }
  return null;
}
/**
 * A player's game log over a window of completed weeks: games, total, points
 * per game, and his position rank by points per game. Read off the row's own
 * weekly points (`weekActual`), so it is the same number every page shows for
 * those weeks. A player is ranked once he has played half the window's weeks
 * (at least one) — one big game in a five-week window is not a WR1.
 */
const logCache=new Map();
function logBoard(sc, h){
  const k=sc+'|'+h.key;
  if(logCache.has(k)) return logCache.get(k);
  const weeks=[]; for(let w=h.from; w<=h.to; w++) weeks.push(w);
  const need=Math.max(1, Math.ceil(weeks.length/2));
  const out=new Map();
  (DATA.pools[sc]||[]).forEach(p=>{
    const pts=weeks.map(w=> weekActual(p,w));
    const played=pts.filter(v=>v!=null);
    const total=played.reduce((a,b)=>a+b,0);
    out.set(p.i, {weeks, pts, g:played.length, total:played.length? round2(total) : null, ppg:played.length? round2(total/played.length) : null, posRank:null, ok:played.length>=need});
  });
  const byPos=new Map();
  (DATA.pools[sc]||[]).forEach(p=>{ const x=out.get(p.i); if(x.ok && x.ppg!=null){ if(!byPos.has(p.p)) byPos.set(p.p,[]); byPos.get(p.p).push([p.i,x]); } });
  byPos.forEach(list=> list.sort((a,b)=> b[1].ppg-a[1].ppg).forEach(([,x],i)=>{ x.posRank=i+1; }));
  logCache.set(k,out);
  return out;
}
const logOf = (p,h)=> logBoard(scoringKey(L()), h).get(p.i) || null;

/** This week's agreed points: what lineups, totals and sorts read. */
const wkPts = p=>{ const m=metric(p,'agreed', parseHz('w-'+DATA.week)); return m? m.v : null; };

/**
 * A source's number for a window, read the same way on every page: FantasyPros'
 * own rank/points for `fp`, Draft Sharks' current-week/ROS cell for `ds`.
 */
function srcValue(p, key, h){
  const m=metric(p, key, h);
  return m && m.v!=null? {v:m.v, real:true} : {v:null};
}

/** The Week by week tab: every remaining week, this one to the end of the season, per source or as the consensus. */
/**
 * My Team is one page with tabs. Every tab reads ONE fixed scope, so there is no
 * window to adjust: Lineup shows this week with the rest-of-season worth beside
 * it, and Sources, Rest of season, Trade value, Buzz and Schedule each take one view.
 * (The Window picker still drives Players and All Rosters, where a look-ahead is
 * the point.)
 */
function teamTabBar(){
  const tabs=el('div','pgtabs'); tabs.setAttribute('role','tablist'); tabs.setAttribute('aria-label','My Team views');
  const pick=k=>{ teamTab=k; writeHash(); render(); const b=document.querySelector('.pgtabs [aria-selected="true"]'); if(b) b.focus(); };
  TEAM_TABS.forEach(([k,label])=>{
    const b=el('button',null,label); b.type='button'; b.setAttribute('role','tab');
    b.setAttribute('aria-selected', String(k===teamTab));
    b.tabIndex = k===teamTab? 0 : -1;
    b.onclick=()=>pick(k);
    tabs.append(b);
  });
  tabs.addEventListener('keydown',e=>{
    if(e.key!=='ArrowRight' && e.key!=='ArrowLeft') return;
    e.preventDefault();
    const i=TEAM_TABS.findIndex(x=>x[0]===teamTab), n=TEAM_TABS.length;
    pick(TEAM_TABS[(i+(e.key==='ArrowRight'?1:n-1))%n][0]);
  });
  return tabs;
}

/** Keep only these columns of a set, optionally re-banded — how a tab picks its slice of the shared columns. */
function pickCols(cols, keys, band){
  return cols.filter(c=>keys.includes(c.key)).map(c=> band? Object.assign({}, c, {band}) : c);
}
/**
 * League Value as a roster column: what he is worth in THIS league from here
 * on — points over replacement at his consensus position rank
 * (src/leaguevalue.js). The same number as the Values page and the player
 * card, where its inputs are; it sits beside the ROS sources it came from.
 * The total is the lineup's, which is what a contender is measured by.
 */
function lvCols(l){
  const lv=lvFor(l), of=p=> lv.players.get(p.i);
  return [{key:'lv', label:'Value', w:88, r:1, sep:1, band:'League', tone:'key',
    title:'League Value: rest-of-season points over replacement in this league, at the sources’ consensus position rank. Beside it: that position rank; his rank across all positions is on hover.',
    cell:p=>{
      const x=of(p);
      if(!x || x.value==null) return dashCell(LV_POSITIONS.includes(p.p)? 'No source ranks him' : 'K and DST are not priced — their replacement is the waiver wire every week');
      const td=stackCell(fxValue(x.value), fxPosRank(p.p, x.posRank), {sep:1});
      td.classList.add('t-key');
      td.title=fxRank(x.rank)+' in this league \u00b7 '+fxValue(x.value)+' pts over a replacement '+(p.p||'')+' ('+fxValue(x.replacement)+' pts) · '+x.n+' sources rank him'+(x.spread!=null? ', '+x.spread+' spots apart' : '');
      return td;
    },
    total:list=> stackCell(fxValue(sum(list, p=>{ const x=of(p); return x&&x.value!=null? x.value : 0; })),'',{sep:1,big:1}),
  }];
}

/**
 * The columns of each tab, laid out the way the hosts lay a team page out:
 * matchup, the agreed number, each source, the result, then what he is worth.
 * Every tab returns its scope with its columns; League Value is the one
 * lvCols definition on all of them, never the ROS consensus column.
 */
function teamColumns(tab){
  const wk=parseHz('w-'+DATA.week), ros=parseHz('ros');
  const LV=lvCols(L()).map(c=>Object.assign(c,{head:'League value'}));
  const wkCols=columnsFor(wk,{groups:['cons','fp','src']}), pick=k=> Object.assign({}, wkCols.find(c=>c.key===k));
  const rosCols=columnsFor(ros,{groups:['cons']});
  switch(tab){
    case 'lineup': {
      // ESPN's and Sleeper's lineup row: Opp, Proj, Score side by side. The
      // start/sit call rides the slot badge (lineupTableView), not a column.
      return {scope:wk, check:true, cols:[
        pick('opp'),
        Object.assign(pick('cons'), {sep:1}),
        pick('pts'),
        Object.assign(pick('consrk'), {sep:0, head:'Wk rank'}),
        sepCol(Object.assign({}, rosCols.find(c=>c.key==='consrk'), {head:'ROS rank'})),
        ...LV.map(c=>Object.assign(c,{sep:0})),
      ]};
    }
    case 'sources': {
      // Each site's own week number beside the agreed one: FantasyPros, then Draft Sharks.
      const ds=p=> p.ds && !p.ds.bye? p.ds : null;
      const dsNum=(key,label,f,title)=>({key, label, w:56, r:1, band:'Draft Sharks', tone:'aux', kind:'num', title,
        get:p=>{ const d=ds(p); return d? d[f] : null; },
        cell:p=>{ const d=ds(p); return stackCell(fmt(d&&d[f]), null, {}); }, total:()=> el('td','r')});
      return {scope:wk, cols:[
        pick('opp'),
        Object.assign(pick('cons'), {sep:1}),
        pick('pts'),
        Object.assign(pick('consrk'), {sep:0, head:'Wk rank'}),
        pick('fp'), pick('ecr'),
        {key:'grade', label:'Grade', w:56, r:1, band:'FantasyPros', title:'FantasyPros start/sit grade', cell:gradeBadgeCell, total:()=> el('td','r')},
        pick('s-ds'),
        dsNum('dsfl','Floor','floor','Draft Sharks’ floor for this week'),
        dsNum('dsce','Ceiling','ceiling','Draft Sharks’ ceiling for this week'),
        ...vegasCols(),
      ]};
    }
    case 'ros': {
      const ovw=columnsFor(parseHz('ovw'),{groups:['cons']}), ov=k=> Object.assign({}, ovw.find(c=>c.key===k));
      const std=parseHz('std'), avg=p=>{ const x=logOf(p,std); return x? x.ppg : null; };
      // The position rank is what a rest-of-season view is read by; the season
      // total behind it says little a rank does not, so it is not a column.
      const cols=[
        ov('consrk'), ov('fprk'), ov('dsrk'),
        ...LV,
      ];
      if((Number(DATA.week)||1)>1){
        cols.push(sepCol({key:'avg', label:'Avg', w:56, r:1, band:'', tone:'aux', kind:'num',
          title:'Points per game this season, in the weeks he played',
          get:avg, cell:p=>{ const v=avg(p); return v==null? dashCell('No games yet') : stackCell(fmt(v), null, {}); },
          total:()=> el('td','r')}));
        cols.push(Object.assign(ov('l3'), {sep:0}));
      }
      cols.push(ov('bye'));
      return {scope:ros, cols};
    }
    case 'trade': {
      const mkt=columnsFor(wk,{groups:['mkt'], noActual:true});
      const lv=lvFor(L());
      // League Value's position rank against the market's: positive, this
      // league rates him above what managers trade for him (hold or buy);
      // negative, the market pays more than he is worth here (sell).
      const gap=p=>{ const x=lv.players.get(p.i); return x && x.posRank!=null && p.tm && p.tm.pr!=null? p.tm.pr-x.posRank : null; };
      return {scope:ros, cols:[
        ...LV,
        ...mkt.map((c,i)=> Object.assign(c,{head:['Market value', c.label, 'Chart'][i]})),
        sepCol({key:'gap', label:'Gap', w:60, r:1, band:'', title:'Market position rank minus League Value position rank: positive means this league rates him above the market (hold or buy), negative means the market pays more (sell)',
          cell:p=>{
            const v=gap(p);
            if(v==null) return dashCell('Needs both a League Value and a market price');
            const td=cell('delta', v, {d:0});
            td.className+=fxHeatClass(fxHeat(v,[3,8,15]));
            td.title=(v>0? 'This league rates him '+v+' spots above the market' : v<0? 'The market rates him '+(-v)+' spots above this league' : 'Same position rank in both');
            return shadeCell(td);
          }, total:()=> el('td','r')}),
      ]};
    }
    case 'schedule': {
      // Opponents only: the schedule, not a projection for those weeks.
      const cols=[Object.assign({}, rosCols.find(c=>c.key==='consrk'), {head:'ROS rank'})];
      for(let w=Number(DATA.week)||1; w<=LAST_WEEK; w++){
        const wkN=w;
        cols.push({key:'sch'+wkN, label:'Wk '+wkN, w:56, r:1, sep:wkN===(Number(DATA.week)||1)? 1 : 0, band:'',
          title:'Opponent in week '+wkN+(wkN===DATA.week? ' (this week)' : ''),
          cell:p=>{ const t=oppLabel(p,wkN); const td=cell('text', null, {cls:'r num opp'+(t==='BYE'? ' bye' : '')+(wkN===(Number(DATA.week)||1)? ' tsep' : ''), text:t}); return td; },
          total:list=>{ const n=list.filter(p=>isBye(p,wkN)).length; return cell('text', null, {cls:'r num'+(n? ' bye' : ''), text:n? n+' bye' : '', title:n? list.filter(p=>isBye(p,wkN)).map(p=>p.n).join(', ') : ''}); }});
      }
      return {scope:ros, cols};
    }
  }
  return {scope:wk, cols:[]};
}

/**
 * This week's lineup decision, the way a host site's "optimize" button reads
 * it: the best lineup from the agreed week projections (powerrank.js
 * `prLineup`, the slot-filling Power Rankings use), against the one set. A
 * player on bye, Out or on IR projects 0; a player whose game has started is
 * locked where he is. `call` maps fpId -> 'start' (bench him in) / 'sit'.
 */
let LU_CHECK=null;
function lineupCheck(l, lu){
  const slots=prSlots(l.rosterSlots||[]);
  if(!slots.length || !lu.starters.length) return null;
  const wkH=parseHz('w-'+DATA.week);
  const starters=lu.starters.filter(p=>p && p.i), all=[...starters, ...lu.bench.filter(p=>p && p.i)];
  const isStarter=new Set(starters.map(p=>p.i));
  const locked=p=>{ const st=p.gameStatus||p.lgame; return !!(st && st!=='Not Started'); };
  const proj=p=>{
    if(isBye(p,DATA.week) || ['O','IR'].includes(injClass(p))) return 0;
    const m=metric(p,'agreed',wkH); return m? m.v : 0;
  };
  const value=p=> locked(p)? (isStarter.has(p.i)? 1e6 : -1) : proj(p);
  const best=prLineup(all.map(p=>({id:p.i, pos:p.p, value:value(p)})), slots);
  const bestIds=new Set(best.lineup.map(x=>x.id).filter(x=>x!=null));
  const start=all.filter(p=> bestIds.has(p.i) && !isStarter.has(p.i));
  const sit=starters.filter(p=> !bestIds.has(p.i));
  const call=new Map([...start.map(p=>[p.i,'start']), ...sit.map(p=>[p.i,'sit'])]);
  const gain=round2(sum(all.filter(p=>bestIds.has(p.i)), proj)-sum(starters, proj));
  return {start, sit, call, gain, proj};
}
/** The verdict above a lineup: what to change and what it is worth, or that it is already the best. */
function lineupCheckNote(chk){
  const n=el('div','lucheck'+(chk.start.length? ' warn' : ' ok'));
  if(!chk.start.length){ n.textContent='Lineup check: this is your best lineup on the agreed week-'+DATA.week+' projections.'; return n; }
  n.append(el('b',null,'Lineup check: +'+fmt(chk.gain)+' pts available. '));
  n.append(document.createTextNode('Start '+chk.start.map(p=>p.n+' ('+fmt(chk.proj(p))+')').join(', ')
    +' over '+chk.sit.map(p=>p.n+' ('+fmt(chk.proj(p))+')').join(', ')+'.'));
  return n;
}

/** The lineup / roster table for one tab, with the starters-or-position switch above it. */
function teamRosterTable(l, t, scope, cols, title, sub, o={}){
  const out=[];
  if(!anyScored(t)) cols=cols.filter(c=>c.key!=='pts');
  if(teamView==='lineup'){
    const lu=lineupFor(l,t);
    const src = lu.source==='actual' ? 'lineup as set' : (lu.source==='computed' ? 'best-fit lineup (computed)' : 'no slot template');
    // Only a lineup you actually set has a decision in it; a computed one is already the best fit.
    LU_CHECK = lu.source==='actual' && o.check? lineupCheck(l, lu) : null;
    if(LU_CHECK) out.push(lineupCheckNote(LU_CHECK));
    out.push(panel(title, sub? sub+' · '+src : src, lineupTableView(lu, scope, cols)));
    if(lu.source==='computed'){
      out.push(Object.assign(el('p','note'),{textContent:
        'This league is not active on FantasyPros, so the lineup you actually set is not available. Slots are filled best-first by projection using the league’s slot template — treat it as a suggestion, not your saved lineup.'}));
    }
  } else {
    LU_CHECK=null;
    out.push(panel(title, (sub? sub+' · ' : '')+t.players.length+' players', positionTableView(t.players, scope, cols)));
  }
  return out;
}

/**
 * My Team's view for a STORED (past) week. Projections no longer mean anything
 * for a week that already happened, so this renders the league's own scoreboard
 * numbers for the picked week instead — per player, and who was actually in the
 * stored starting lineup. The captures are as accurate as the last sync was:
 * a game still in progress when it ran reads low or empty, and the panel says
 * so rather than implying it is a final score.
 */
let storedWeekSort={key:null, flip:false};
function storedWeekPanel(l, t){
  const out=[];
  const b=(l.scoreBoard||{})[String(viewWeek)];
  const pp=(b&&b.playerPts)||{};
  const mineIds=new Set(myTeams(l).map(x=>String(x.id)));
  const mine=(b&&b.matchups||[]).find(m=>m.sides.some(s=>mineIds.has(String(s.id))));
  const side=mine&&mine.sides.find(s=>mineIds.has(String(s.id)));
  const opp=mine&&mine.sides.find(s=>!mineIds.has(String(s.id)));
  const started=new Set((side&&side.starters||[]).map(ln=>Number(ln.i)).filter(Boolean));
  const lineupKnown=(side&&(((side.starters||[]).length+(side.bench||[]).length)>0));

  const groups=new Map();
  t.players.slice().sort(byPos).forEach(p=>{
    const k=String(p.p||'—').toUpperCase();
    if(!groups.has(k)) groups.set(k,[]);
    groups.get(k).push(p);
  });

  const rows=[];
  let sum=0, n=0;
  [...groups.entries()].forEach(([pos,list])=>{
    list.forEach(p=>{
      const leagueV=pp[p.i];
      const stat=weekActual(p, viewWeek);
      const v=leagueV!=null? leagueV : stat;
      const startedHim=lineupKnown && started.has(p.i);
      rows.push({p, pos, value:v, fromLeague:leagueV!=null, started:lineupKnown? startedHim : null});
      if(v!=null){ sum+=v; n++; }
    });
  });
  const columns=[
    {key:'player', label:'Player', band:'', sort:r=>r.p.n||'', dir:'asc', cell:r=>cell('player', r.p)},
    {key:'points', label:'Pts', band:'Week '+viewWeek+' actuals', r:1, sort:r=>r.value, title:'League-scored points for week '+viewWeek+', as stored', cell:r=>{
      const td=el('td','r');
      const d=el('div','wkcell '+(r.value==null?'real':'real act'));
      d.textContent=r.value==null? '—' : fmt(r.value);
      td.append(d);
      td.title=r.fromLeague? 'This league\u2019s scoring, as captured at sync time'
        : (r.value==null? 'No score for week '+viewWeek : 'Sleeper\u2019s published points for this format — the stored matchup has no line for him');
      return td;
    }},
    {key:'start', label:'Start', band:'Week '+viewWeek+' actuals', r:1, sort:r=>r.started, title:'In the stored starting lineup for that week', cell:r=>{
      const td=el('td','r');
      td.append(el('span','pill '+(r.started?'ok':'gh'), lineupKnown? (r.started? 'started' : 'bench') : '\u2014'));
      if(!lineupKnown) td.title='The stored board has no lineup, so who started is unknown';
      return td;
    }},
  ];
  const key=storedWeekSort.key;
  const selected=columns.find(c=>c.key===key);
  const sorted=key? [...groups.keys()].flatMap(pos=> rows.filter(r=>r.pos===pos)
    .map((r,i)=>({r,i})).sort((a,b)=>{
      const x=selected.sort(a.r), y=selected.sort(b.r);
      if(x==null || x==='') return y==null || y===''? a.i-b.i : 1;
      if(y==null || y==='') return -1;
      const d=typeof x==='number' && typeof y==='number'? x-y : String(x).localeCompare(String(y));
      return d? d*(storedWeekSort.flip?1:-1) : a.i-b.i;
    }).map(x=>x.r)) : rows;
  const onSort=k=>{
    if(storedWeekSort.key===k) storedWeekSort.flip=!storedWeekSort.flip;
    else storedWeekSort={key:k, flip:columns.find(c=>c.key===k).dir==='asc'};
    render();
  };
  const footer=el('tr','totrow');
  footer.append(el('td',null,'Roster total'));
  footer.append(el('td','r',fmt(n?sum:null)));
  footer.append(el('td','r',''));
  const groupSizes=new Map([...groups].map(([pos,list])=>[pos,list.length]));
  const divider=(r,i)=>{
    if(i>0 && sorted[i-1].pos===r.pos) return null;
    const tr=el('tr','grouphdr'), td=el('td');
    td.colSpan=columns.length;
    const wrap=el('div','slotcell'); wrap.append(posChip(r.pos,'mini')); wrap.append(el('span',null,r.pos+' · '+groupSizes.get(r.pos)));
    td.append(wrap); tr.append(td);
    return tr;
  };

  const sub=[];
  if(side&&opp){
    const win=(side.pts||0)>(opp.pts||0), lose=(side.pts||0)<(opp.pts||0);
    sub.push(mine.final? (win?'W':'L')+' \u00b7 '+pts2(side.pts)+' \u2013 '+pts2(opp.pts)+' vs '+opp.name : 'vs '+opp.name+' — '+pts2(side.pts)+' to '+pts2(opp.pts)+' as captured');
  }
  sub.push(n+'/'+t.players.length+' players have a stored score for this week');
  out.push(panel('Week '+viewWeek+' \u00b7 stored scores', sub.join(' · '), smallTable({
    id:'stored-week-scores', cols:columns, rows:sorted, divider, footer:[footer], lean:true, nopos:true,
    sort:{key:storedWeekSort.key, flip:storedWeekSort.flip}, onSort,
  })));
  out.push(Object.assign(el('p','note'),{textContent:
    'A player the stored lineup captured uses this league\u2019s scoring. Everyone else uses Sleeper\u2019s published points for this format, so a missing lineup is not a blank. Pick Live to return to the current week.'}));
  return out;
}
