/**
 * The whole league's week, on one board.
 *
 * MyPlaybook's matchup endpoint accepts any teamId, so this works on ESPN and
 * Yahoo as well as Sleeper — neither of which exposes a league scoreboard
 * anywhere else reachable from here. Your own game is marked, not isolated:
 * what a scoreboard is for is seeing everyone else's at once.
 */
function scoreboard(l, board){
  if(!board || !board.ok) return null;
  const all=board.rows||[];
  const mineIds=new Set(myTeams(l).map(t=>String(t.id)));
  const byId=new Map(l.teams.map(t=>[String(t.id),t]));
  const rows=all.slice().sort((a,b)=>{
    const am=a.sides.some(s=>mineIds.has(String(s.id))), bm=b.sides.some(s=>mineIds.has(String(s.id)));
    return (bm?1:0)-(am?1:0) || (a.final?1:0)-(b.final?1:0);
  });
  const grid=el('div','sbgrid');
  rows.forEach(m=>{
    const card=el('div','sbcard');
    if(m.sides.some(s=>mineIds.has(String(s.id)))) card.classList.add('mine');
    const lead=Math.max(...m.sides.map(s=>s.pts??0));
    const tied=m.sides.length>1 && m.sides[0].pts===m.sides[1].pts;
    m.sides.forEach(s=>{
      const r=el('div','sbrow');
      const t=byId.get(String(s.id));
      r.append(teamAvatar(t? t.logo : s.logo));
      r.append(Object.assign(el('div','sbn'),{textContent: t? teamLabel(l,t) : (s.name||'—')}));
      const pv=el('div','sbp'+((s.pts??0)>=lead && !tied ? ' lead':''));
      pv.textContent=pts2(s.pts);
      r.append(pv);
      const pj=el('div','sbj'); pj.textContent = s.proj==null? '' : pts2(s.proj);
      pj.title='projected final';
      r.append(pj);
      card.append(r);
    });
    if(m.sides.length===1) card.append(Object.assign(el('div','sbrow sbbye'),{textContent:'bye'}));
    const foot=el('div','sbfoot');
    foot.append(el('span','pill '+(m.final?'gh':(m.pre?'gh':'q')), m.final? 'final' : (m.pre? 'not started' : (m.minutesLeft!=null? m.minutesLeft+'m left' : 'live'))));
    if(tied && !m.final) foot.append(el('span',null,'tied'));
    card.append(foot);
    grid.append(card);
  });
  const done=all.filter(m=>m.final).length;
  const stored=board.week&&board.week!==(Number(DATA.week)||1);
  return panel( stored? 'Week '+board.week+' scoreboard · stored' : 'Week '+DATA.week+' scoreboard',
    all.length+' matchups · '+done+' final · every team, from the per-team matchup endpoint'
      +(stored? ' \u00b7 as captured when the sync last ran' : ''), grid);
}

/**
 * Any matchup in the league, not just yours.
 *
 * This used to render one pairing — whichever one MyPlaybook answered for your
 * own teamId — and only for the single league FantasyPros has marked active.
 * The league-wide board already fetches every pairing with every lineup slot
 * (matchups.js asks per team, and the endpoint answers for any of them), so
 * there is no reason the page can only show one. You arrive on yours; the
 * selector and the arrows walk the rest of the league.
 *
 * Points here are the LEAGUE's own: MyPlaybook applies the league's scoring
 * table, so a Sleeper league taking -2 for an interception is already counted.
 * The previous version read actuals out of WinWithOdds' generic PPR file, which
 * is why a quarterback could read high by exactly the interceptions he threw.
 */
function muKey(m){ return m.sides.map(s=>String(s.id)).join('-'); }

function pickMatchup(board){
  const rows=(board && board.ok)? board.rows : [];
  if(!rows.length) return null;
  if(muPick){
    const hit=rows.find(m=> muKey(m)===muPick || m.sides.some(s=>String(s.id)===muPick));
    if(hit) return hit;
  }
  const mine=new Set(myTeams(L()).map(t=>String(t.id)));
  return rows.find(m=> m.sides.some(s=>mine.has(String(s.id)))) || rows[0];
}

/** Order the board reads in: yours first, then live, then finished. */
function muOrder(board){
  const rows=(board && board.ok)? board.rows.slice() : [];
  const mine=new Set(myTeams(L()).map(t=>String(t.id)));
  return rows.sort((a,b)=>{
    const am=a.sides.some(s=>mine.has(String(s.id))), bm=b.sides.some(s=>mine.has(String(s.id)));
    return (bm?1:0)-(am?1:0) || (a.final?1:0)-(b.final?1:0);
  });
}

function pageMatchup(){
  const l=L(), out=[];
  const viewPast=viewingPast(l);
  const h=el('div','head'); h.append(el('h1',null, viewPast? 'Week '+viewWeek+' Matchup \u00b7 stored scores' : 'Week '+DATA.week+' Matchup'));
  out.push(h);

  const wpick=weekPicker(l);
  if(wpick) out.push(wpick);

  const board=boardFor(l);
  const rows=muOrder(board);
  if(!rows.length){
    if(viewPast){
      out.push(panel('Matchup', null, emptyState('No stored board for week '+viewWeek,
        'This league has no stored matchups for that week — run `matchups:sync` during it to capture them.')));
      return out;
    }
    const M=l.adv&&l.adv.matchup;
    if(M && M.inactive) out.push(panel('Matchup', l.host, inactiveNote(l,'Matchups')));
    else if(l.detail && l.detail.supported) return out.concat(sleeperMatchupFallback(l));
    else out.push(panel('Matchup', l.host, emptyState('No league board yet','Run `node src/cli.js matchups:sync` to pull every pairing in this league.')));
    return out;
  }

  const cur=pickMatchup(board);
  const idx=rows.indexOf(cur);
  const go=(m)=>{ muPick=muKey(m); writeHash(); render(); };

  /* --- pick a pairing ------------------------------------------------- */
  const nav=el('div','munav');
  const prev=el('button','iconbtn','‹'); prev.type='button'; prev.title='Previous matchup';
  prev.onclick=()=>go(rows[(idx-1+rows.length)%rows.length]);
  const next=el('button','iconbtn','›'); next.type='button'; next.title='Next matchup';
  next.onclick=()=>go(rows[(idx+1)%rows.length]);
  nav.append(prev);
  const strip=el('div','mustrip');
  const mineIds=new Set(myTeams(l).map(t=>String(t.id)));
  const byId=new Map(l.teams.map(t=>[String(t.id),t]));
  rows.forEach(m=>{
    const b=el('button','muchip'+(m===cur?' on':'')); b.type='button';
    if(m.sides.some(s=>mineIds.has(String(s.id)))) b.classList.add('mine');
    m.sides.forEach((s,i)=>{
      if(i) b.append(el('span','vs','·'));
      const t=byId.get(String(s.id));
      b.append(teamAvatar(t? t.logo : s.logo));
      b.append(Object.assign(el('span','mc'),{textContent:pts2(s.pts)}));
    });
    b.title=m.sides.map(s=>{ const t=byId.get(String(s.id)); return (t? teamLabel(l,t) : s.name)+' '+pts2(s.pts); }).join('  vs  ');
    b.onclick=()=>go(m);
    strip.append(b);
  });
  nav.append(strip); nav.append(next);
  out.push(nav);

  out.push(matchupPanel(l, cur));
  out.push(scoreboard(l, board));
  return out.filter(Boolean);
}

/** Header, starters and bench for one pairing. */
function matchupPanel(l, m){
  const byId=new Map(l.teams.map(t=>[String(t.id),t]));
  const mineIds=new Set(myTeams(l).map(t=>String(t.id)));
  const [A,B]=m.sides;
  const body=el('div','pbody');

  /* --- head to head --------------------------------------------------- */
  const sideHead=(s,cls)=>{
    const d=el('div','muteam'+(cls?' '+cls:''));
    const t=s? byId.get(String(s.id)) : null;
    const crest=teamAvatar(t? t.logo : (s&&s.logo));
    const nm=el('div','mun');
    nm.append(el('b',null, t? teamLabel(l,t) : (s&&s.name)||'—'));
    if(t && mineIds.has(String(t.id))) nm.append(el('span','pill ok','you'));
    const sc=el('div','musc');
    sc.append(Object.assign(el('div','p1'),{textContent:pts2(s? s.pts : null)}));
    const pj=el('div','p2');
    pj.textContent = s&&s.proj!=null? pts2(s.proj) : '';
    pj.title='projected final';
    sc.append(pj);
    if(cls==='b'){ d.append(sc); d.append(nm); d.append(crest); }
    else { d.append(crest); d.append(nm); d.append(sc); }
    return d;
  };
  body.append(compare({
    left:sideHead(A),
    center:el('div','muvs', m.final? 'FINAL' : (m.pre? 'VS' : (m.minutesLeft!=null? m.minutesLeft+'m' : 'LIVE'))),
    right:sideHead(B,'b'),
    className:'muhead',
  }));

  // Win probability stays here — it is the one page where a matchup-level
  // number belongs. It was only ever wrong sitting in a standings table.
  if(m.winProb!=null){
    const wp=Math.round(m.winProb*100);
    const w=el('div','wp');
    const bar=el('div','wpbar');
    const a=el('i'); a.style.width=wp+'%'; a.style.background='var(--good)';
    const b=el('i'); b.style.flex='1'; b.style.background='var(--bad)';
    bar.append(a); bar.append(b);
    const nums=el('div','wpnums');
    nums.append(el('span',null,wp+'%'));
    nums.append(el('span',null,'win probability'));
    nums.append(el('span',null,(100-wp)+'%'));
    w.append(bar); w.append(nums);
    body.append(w);
  }

  const panelEl=panel(
    m.final? 'Final' : (m.pre? 'Not started' : 'Live'),
    (m.status||'')+(m.minutesLeft!=null&&!m.final? ' · '+m.minutesLeft+' game minutes left' : ''),
    body);

  if(!B){ body.append(Object.assign(el('p','note'),{textContent:'Bye week — no opponent this week.'})); }
  const starters=muRows(l, A, B, 'starters');
  if(starters) body.append(starters);
  else {
    const fb=muRosterFallback(l, A, B);
    if(fb) body.append(fb);
  }
  const bench=muRows(l, A, B, 'bench');
  if(bench) body.append(bench);
  return panelEl;
}

/**
 * Both teams' current rosters with that week's points, used when the stored
 * board has team scores and no lineup slots. append(null) would print the
 * text "null" on the page, which is why a missing lineup returns nothing
 * from muRows and lands here instead.
 */
function muRosterFallback(l, A, B){
  const byId=new Map(l.teams.map(t=>[String(t.id),t]));
  const list=side=>{
    const t=side&&byId.get(String(side.id));
    return ((t&&t.players)||[]).slice().sort(byPos);
  };
  const a=list(A), b=list(B);
  if(!a.length && !b.length) return null;
  const wrap=el('div','muslots');
  wrap.append(Object.assign(el('div','muband'),{textContent:'Roster points \u00b7 no lineup was stored'}));
  const cell=(p,cls)=>{
    const d=el('div','muside'+(cls?' '+cls:''));
    if(!p){ d.append(el('span','note','\u2014')); return d; }
    const who=el('div','muwho');
    if(p.i!=null) who.dataset.pid=p.i;
    who.append(avatarFor(p));
    const nm=el('div','munm');
    const line1=el('div','l1');
    line1.append(p.i!=null? plink(p) : el('b',null,p.n||'\u2014'));
    if(p.t) line1.append(el('span','tm',p.t));
    nm.append(line1);
    nm.append(Object.assign(el('div','l2'),{textContent:p.p||''}));
    who.append(nm);
    const val=el('div','muval');
    const stat=weekActual(p, viewWeek);
    const pv=el('div','pv'+(stat==null?' dim':''));
    pv.textContent=stat==null? '\u2014' : pts2(stat);
    if(stat!=null) pv.title='Sleeper\u2019s published points for this format. The stored board has no lineup, so this is not confirmed as a starter and is not a custom league scoring table.';
    val.append(pv);
    if(cls==='b'){ d.append(val); d.append(who); }
    else { d.append(who); d.append(val); }
    return d;
  };
  const n=Math.max(a.length,b.length);
  for(let i=0;i<n;i++){
    const mid=el('div','mumid');
    mid.append(posChip((a[i]&&a[i].p)||(b[i]&&b[i].p)||'\u2014','slot'));
    wrap.append(compare({left:cell(a[i]), center:mid, right:cell(b[i],'b'), className:'murow'}));
  }
  return wrap;
}

/**
 * The slot-by-slot rows, laid out as the hosts lay them out: player, his game,
 * his points, the slot badge down the middle, then the same mirrored.
 *
 * The projection sits under the points in the colour of the gap, so a row
 * answers "is he beating his number" without a second column to read.
 */
function muRows(l, A, B, which){
  const a=(A&&A[which])||[], b=(B&&B[which])||[];
  if(!a.length && !b.length) return null;
  const wrap=el('div','muslots'+(which==='bench'?' bench':''));
  if(which==='bench') wrap.append(Object.assign(el('div','muband'),{textContent:'Bench'}));

  const byFp=new Map();
  l.teams.forEach(t=> t.players.forEach(p=> byFp.set(p.i,p)));

  const cell=(p,cls)=>{
    const d=el('div','muside'+(cls?' '+cls:''));
    if(!p){ d.append(el('span','note','—')); return d; }
    const en=byFp.get(p.i) || universe(scoringKey(l)).get(p.i) || {i:p.i, n:p.n, t:p.t, p:p.pos, s:null};
    const who=el('div','muwho'); if(p.i!=null) who.dataset.pid=p.i;
    who.append(avatarFor({p:p.pos||en.p, t:p.t||en.t, s:en.s}));
    const nm=el('div','munm');
    const line1=el('div','l1');
    line1.append(p.i!=null? plink({i:p.i, n:p.n||'—'}) : el('b',null,p.n||'—'));
    if(p.t) line1.append(el('span','tm',p.t));
    const ip=injPill({inj:p.inj}); if(ip) line1.append(ip);
    nm.append(line1);
    const line2=el('div','l2');
    line2.textContent = p.score || p.game || p.opp || '';
    nm.append(line2);
    who.append(nm);

    const val=el('div','muval');
    // The lineup slot is the league's number. When the stored board has the
    // player but no points — a past week captured as team scores only — the
    // weekly stat file still knows what he scored.
    let pts=p.pts;
    let fromStats=false;
    if(pts==null && !p.pre){
      const stat=weekActual(en, viewWeek);
      if(stat!=null){ pts=stat; fromStats=true; }
    }
    const played = pts!=null && !p.pre;
    const pv=el('div','pv'+(played?'':' dim'));
    pv.textContent = played? pts2(pts) : '—';
    if(fromStats) pv.title='Sleeper\u2019s published points for this format — the stored lineup has no score for him';
    val.append(pv);
    /**
     * The second line is the projection the points should be read against —
     * and which projection that is depends on whether the game has been played.
     *
     * Once it is over, the live-adjusted number has converged on the actual, so
     * printing it puts the same figure twice on the row. What is worth knowing
     * then is what he was PROJECTED before kickoff, coloured by the gap. While
     * a game is running the live projected final is the useful one.
     */
    const sub=el('div','pj');
    const done = p.over || (pts!=null && (p.min===0 || fromStats));
    const shown = done? (p.proj0!=null? p.proj0 : p.proj) : p.proj;
    if(shown!=null){
      sub.textContent=pts2(shown);
      if(done && pts!=null){
        const gap=pts-shown;
        sub.style.color = gap>=0? 'var(--good)' : 'var(--bad)';
        sub.title='projected '+pts2(shown)+' pre-game · '+(gap>=0?'+':'')+pts2(gap);
      } else {
        sub.title='projected final';
      }
    }
    val.append(sub);

    if(cls==='b'){ d.append(val); d.append(who); }
    else { d.append(who); d.append(val); }
    return d;
  };

  const n=Math.max(a.length,b.length);
  for(let i=0;i<n;i++){
    const L=a[i], R=b[i];
    const mid=el('div','mumid');
    mid.append(posChip((L&&L.slot)||(R&&R.slot)||(which==='bench'?'BN':'—'),'slot'));
    wrap.append(compare({left:cell(L), center:mid, right:cell(R,'b'), className:'murow'}));
  }

  if(which==='starters'){
    /**
     * The totals are the HOST's, not the sum of the rows above them.
     *
     * On most leagues they are the same number. On one Yahoo league they are
     * not: MyPlaybook's per-player scoring comes out 1–3 points above what
     * Yahoo itself reports for the team, on five teams out of twelve. The team
     * score is the host's own live figure and the one the scoreboard and
     * standings use, so it is the one that belongs here — and where the parts
     * disagree with it, the row says so rather than quietly printing a third
     * number the league has never seen.
     */
    const mk=(side,list,cls)=>{
      const d=el('div','muside'+(cls?' '+cls:''));
      const v=el('div','muval');
      const host = side? side.pts : null;
      v.append(Object.assign(el('div','pv'),{textContent:pts2(host)}));
      v.append(Object.assign(el('div','pj'),{textContent: side&&side.proj!=null? pts2(side.proj) : ''}));
      const scored=list.filter(p=>p.pts!=null&&!p.pre);
      const parts = sum(scored, p=>p.pts);
      if(host!=null && scored.length && Math.abs(parts-host)>0.05){
        const flag=Object.assign(el('div','ss'),{textContent:'rows sum '+pts2(parts)});
        flag.style.color='var(--warn)';
        flag.title='MyPlaybook\u2019s per-player scoring for this league sums to '+pts2(parts)
          +', '+pts2(Math.abs(parts-host))+' '+(parts>host?'above':'below')+' the '+l.host
          +' team score. The team score is the host\u2019s own and is what the scoreboard and standings use.';
        v.append(flag);
      }
      if(cls==='b'){ d.append(v); } else { d.append(el('span','grow')); d.append(v); }
      return d;
    };
    const mid=el('div','mumid'); mid.append(el('span','wk','STARTERS'));
    wrap.append(compare({left:mk(A,a), center:mid, right:mk(B,b,'b'), className:'murow mutot'}));
  }
  return wrap;
}

/* Sleeper still fills in when MyPlaybook has no active-league access. */
function sleeperMatchupFallback(l){
  const out=[];
  const t=myTeam();
  const norm=s=>String(s||'').toLowerCase().replace(/[^a-z0-9]/g,'');
  const mine=t? l.detail.standings.find(s=>norm(s.name)===norm(t.name)) : null;
  const mu=mine? l.detail.matchups.find(m=>m.sides.some(s=>s.rosterId===mine.rosterId)) : l.detail.matchups[0];
  if(!mu||mu.sides.length<2){ out.push(panel('Matchup',null,emptyState('No pairing posted','Sleeper has not published a week '+DATA.week+' matchup.'))); return out; }
  const projOf=name=>{ const team=l.teams.find(x=>norm(x.name)===norm(name)); return team? sum(team.players,wkPts) : null; };
  const body=el('div','pbody');
  const side=(s,cls)=>{
    const d=el('div','muteam'+(cls?' '+cls:''));
    const crest=teamAvatar(s.avatar||null);
    const nm=el('div','mun'); nm.append(el('b',null,s.team));
    const sc=el('div','musc');
    sc.append(Object.assign(el('div','p1'),{textContent:pts2(s.points)}));
    const pj=projOf(s.team);
    sc.append(Object.assign(el('div','p2'),{textContent: pj==null? 'live' : pts2(pj)}));
    if(cls==='b'){ d.append(sc); d.append(nm); d.append(crest); } else { d.append(crest); d.append(nm); d.append(sc); }
    return d;
  };
  body.append(compare({left:side(mu.sides[0]), center:el('div','muvs','VS'), right:side(mu.sides[1],'b'), className:'muhead'}));
  body.append(Object.assign(el('p','note'),{textContent:'Sleeper\u2019s own live scoring. Run `node src/cli.js matchups:sync` for the full slot-by-slot board and every other pairing in the league.'}));
  out.push(panel('Head to head','Sleeper live scoring',body));
  mu.sides.forEach(s=>{ const team=l.teams.find(x=>norm(x.name)===norm(s.team)); if(team) out.push(panel(s.team,'projected '+num(sum(team.players,wkPts)),rosterTable(team.players))); });
  return out;
}

/**
 * One standings table, whatever the host is.
 *
 * Every column below is filled from whichever source has it, and a column
 * nobody has is dropped rather than rendered empty.
 *
 *   logo, name      the rosters payload, which carries a logo for ALL THREE
 *                   hosts.
 *   record, rank    MyPlaybook projected-standings — works for every host.
 *   playoff odds    same source, same coverage.
 *   PF / PA         every FINISHED matchup this app has stored, with the game
 *                   count carried so a row over one game never reads as a
 *                   season.
 *   this week       the live board, for every host, with the projected final.
 *   waiver / FAAB   Sleeper only. Nothing else exposes it.
 *
 * WHAT COUNTS TOWARDS THE RECORD
 *
 * `standMode` decides, and it defaults to `done`:
 *
 *   done   the host's official record, plus any matchup THIS WEEK that has
 *          actually finished. A game in progress moves nothing — the table
 *          does not reorder itself while you watch a game.
 *   proj   also counts unfinished games to whoever is ahead, and games not
 *          yet kicked off to whoever is projected higher. "Assume the
 *          favourites hold."
 *
 * Either way the rank is the standard one: record first, then points for. The
 * league's seeding rule colours which rows are in, it does not renumber them —
 * a seed is an answer to a different question than "who is first".
 */
/**
 * Which matchup board the standings should read for the "this week" columns and
 * for counting a week's results. Prefers the live board; when the league was
 * synced at a time its host served nothing (mid-week, pre-kickoff), falls back
 * to the most recent stored week that has any real pairings, so the table never
 * reads a whole league as winless. Rows keep the stored matchups' shape.
 */
function standingsBoard(l){
  const live=(l.matchups && l.matchups.ok && l.matchups.rows.some(m=>m.sides.length>1));
  if(live) return { ok:true, week:Number(DATA.week)||1, rows:l.matchups.rows||[], live:true };
  const weeks=Object.keys(l.scoreBoard||{}).map(Number).filter(w=>w>0 && w<DATA.week).sort((a,b)=>b-a);
  for(const w of weeks){
    const b=(l.scoreBoard||{})[String(w)];
    if(!b || !b.matchups || !b.matchups.length || !b.matchups.some(m=>m.sides.length>1)) continue;
    return { ok:true, week:w, rows:b.matchups, live:false };
  }
  return { ok:false, week:Number(DATA.week)||1, rows:[], live:true };
}

function standingsRows(l, sb){
  const P = l.adv && l.adv.standings;
  const proj = (P && P.ok) ? P.standings : [];
  const projById = new Map(proj.map(r=>[String(r.teamId), r]));
  /**
   * Sleeper is the only host whose weekly detail carries an OFFICIAL season
   * record and points-for/against through its API — because unlike ESPN and
   * Yahoo it publishes them. When that exists it is the record of record, and
   * the live/ledger counters must not add to it (that would double-count).
   */
  const hostCur = !!(l.detail && l.detail.supported);
  const detail = hostCur ? (l.detail.standings||[]) : [];
  const norm = (x)=> String(x||'').toLowerCase().replace(/[^a-z0-9]/g,'');
  const detailByName = new Map(detail.map(d=>[norm(d.name), d]));
  // Sleeper's rosterId IS the id MyPlaybook hands back as this team's teamId
  // (it passes Sleeper's own roster ordinal straight through) — matching on
  // that is exact where matching on name is not: a co-owned team, a Sleeper
  // user with no custom team_name, or a name MyPlaybook cached before a
  // rename all defeat the normalized-name match and used to read as an empty
  // Standings row for a team that Sleeper actually has full data for.
  const detailById = new Map(detail.filter(d=>d.rosterId!=null).map(d=>[String(d.rosterId), d]));

  // This week's score, keyed both ways so a bye still resolves.
  const liveById = new Map();
  if(sb && sb.ok){
    sb.rows.forEach(m=>{
      const [a,b]=m.sides;
      const put=(self,opp)=>{ if(self && self.id!=null) liveById.set(String(self.id), {self,opp,m}); };
      put(a,b); put(b,a);
    });
  }

  const rows = l.teams.map(t=>{
    const id=String(t.id);
    const pr = projById.get(id) || null;
    const dt = detailById.get(id) || detailByName.get(norm(t.name)) || detailByName.get(norm(t.nameScraped)) || null;
    const live = liveById.get(id) || null;
    const acc = t.totals || null;

    const wins = hostCur? (dt?.wins ?? 0) : (pr?.winsCurrent ?? dt?.wins ?? 0);
    const losses = hostCur? (dt?.losses ?? 0) : (pr?.lossesCurrent ?? dt?.losses ?? 0);
    const ties = hostCur? (dt?.ties ?? 0) : (pr?.tiesCurrent ?? dt?.ties ?? 0);

    // The counter that adds this week's live results only runs when the host
    // does not already publish official numbers; with a host record the count
    // IS the record and adding a game would double-count it.
    const recordLive = !hostCur;
    let wkResult = null, addW = 0, addL = 0, addT = 0, provisional = false;
    if(live && live.opp){
      const gap = (live.self.pts??0) - (live.opp.pts??0);
      // Pre-game has no points to compare, so the favourite is the projection.
      const pgap = (live.self.proj??live.self.pts??0) - (live.opp.proj??live.opp.pts??0);
      wkResult = { final: live.m.final, pre: live.m.pre, gap, win: gap>0, tie: gap===0,
                   pts: live.self.pts, proj: live.self.proj,
                   oppPts: live.opp.pts, oppProj: live.opp.proj, opp: live.opp.name, m: live.m };
      if(recordLive && live.m.final){
        if(gap>0) addW=1; else if(gap<0) addL=1; else addT=1;
      } else if(recordLive && standMode==='proj'){
        const g = live.m.pre? pgap : gap;
        if(g>0) addW=1; else if(g<0) addL=1; else addT=1;
        provisional = true;
      }
    } else if(live){
      wkResult = { final: live.m.final, pre: live.m.pre, bye:true, pts: live.self.pts, proj: live.self.proj, m: live.m };
    }

    /**
     * Points for and against.
     *
     * The host's official season total is preferred when this host publishes
     * one (Sleeper) — it is complete, which weekly syncing never is. Otherwise
     * the ledger — every finished matchup this app has stored — is used for
     * ESPN and Yahoo, then MyPlaybook's own figure. A host total of exactly
     * zero with no games played is absent data wearing a number's clothes, so
     * it is read as absent.
     */
    const hostTot = (hostCur && dt && (dt.pointsFor!=null || dt.pointsAgainst!=null)) ? dt : null;
    const useAcc = !hostCur && acc && acc.games>0;
    let pointsFor = useAcc? acc.pointsFor : (hostTot? hostTot.pointsFor : (pr?.pointsFor ?? null));
    let pointsAgainst = useAcc? acc.pointsAgainst : (hostTot? hostTot.pointsAgainst : (pr?.pointsAgainst ?? null));
    let games = useAcc? acc.games : (hostTot? (wins+losses+ties) : null);
    // In `proj` mode the record already counts the game in progress, so the
    // points columns have to count it too — a record and a points total that
    // disagree about which games happened is worse than either alone. Never on
    // a host record, which is already complete.
    if(recordLive && standMode==='proj' && live && !live.m.final && !live.m.pre){
      pointsFor = (pointsFor||0) + (live.self.pts||0);
      if(live.opp) pointsAgainst = (pointsAgainst||0) + (live.opp.pts||0);
      games = (games||0) + 1;
    }

    return {
      team: t, id,
      name: teamLabel(l,t),
      // Under a nickname, the subtext is what the host actually calls the team;
      // the owner's username follows it where the host gives one.
      sub: [ (ovFor(l).teams[id]||{}).nickname ? teamHostName(t) : null, dt?.owner || null ].filter(Boolean).join(' · ') || null,
      logo: t.logo,
      hostRank: pr?.rankCurrent ?? dt?.rank ?? null,
      rankProj: pr?.rankProjected ?? null,
      wins, losses, ties,
      effWins: wins+addW, effLosses: losses+addL, effTies: ties+addT,
      counted: !!(addW||addL||addT),
      provisional,
      projRecord: pr ? [pr.winsProjected, pr.lossesProjected] : null,
      odds: pr?.playoffOdds ?? null,
      oddsPct: (()=>{ const n=parseInt(String(pr?.playoffOdds||'').replace('%',''),10); return isNaN(n)?null:n; })(),
      pointsFor: pointsFor==null? null : Number(pointsFor.toFixed(2)),
      pointsAgainst: pointsAgainst==null? null : Number(pointsAgainst.toFixed(2)),
      games,
      recordLive,
      recordSource: hostCur? 'host' : (useAcc? 'ledger' : (pr? 'mpb' : null)),
      pfSource: hostTot? 'host' : (useAcc? 'ledger' : (pr?.pointsFor!=null? 'mpb' : null)),
      waiverPosition: dt?.waiverPosition ?? null,
      waiverBudgetUsed: dt?.waiverBudgetUsed ?? null,
      totalMoves: dt?.totalMoves ?? null,
      streak: dt?.streak ?? null,
      wkResult,
      wkPts: live? (live.self.pts ?? null) : null,
      rank: null, seed: null, seedWhy: null, inPlayoffs: null,  // filled below
      mine: !!t.mine,
      division: t.division ?? null,
    };
  });

  // Games back from the leader, on the record as counted.
  const lead = rows.reduce((a,r)=> (r.effWins - r.effLosses) > (a.effWins - a.effLosses) ? r : a, rows[0] || {effWins:0,effLosses:0});
  rows.forEach(r=>{ r.gb = ((lead.effWins - r.effWins) + (r.effLosses - lead.effLosses)) / 2; });

  /**
   * The standard rank: record, then points for. Every league, same rule.
   *
   * This used to be the seed where a seeding rule existed, which conflated two
   * things — a division winner can be seeded first from fourth place, and the
   * table then numbered them 1 while the record said otherwise. The seed still
   * decides who is IN, and is on the tooltip; the number is the plain standing.
   */
  rows.slice().sort(byStandard).forEach((r,i)=>{ r.rank=i+1; });

  applySeeds(rows, l);

  // With no rule configured, "in the playoffs" is simply the top N.
  if(!rows.some(r=>r.seed!=null)){
    const n = (l.playoffs && l.playoffs.teams) || null;
    if(n) rows.forEach(r=>{ r.inPlayoffs = r.rank<=n; });
  }
  return rows;
}

/** Record first, then points for — the ordering every league agrees on. */
function byStandard(a,b){
  return (b.effWins-a.effWins) || (a.effLosses-b.effLosses) || (b.effTies-a.effTies)
      || (b.pointsFor??0)-(a.pointsFor??0)
      || (b.wkPts??0)-(a.wkPts??0)
      || String(a.name).localeCompare(String(b.name));
}

/**
 * Playoff seeds, under this league's own rule, on these rows.
 *
 * The same three rules the CLI and League Setup speak, applied to the merged
 * rows rather than to one host's standings — so it works on ESPN and Yahoo,
 * and so the bracket and the table agree about this week.
 *
 * Rows are mutated rather than returned because every caller wants them
 * attached to the team they belong to, and a parallel array would be one more
 * thing to keep aligned.
 */
function applySeeds(rows, l){
  const cfg = l.seedRule;
  if(!cfg || !cfg.rule || !rows.length) return;
  const tb = cfg.tiebreak || 'pointsFor';
  const byRecord = tb==='pointsAgainst'
    ? (a,b)=> (b.effWins-a.effWins) || (a.effLosses-b.effLosses) || (a.pointsAgainst ?? Infinity)-(b.pointsAgainst ?? Infinity)
    : byStandard;
  const n = cfg.playoffTeams ?? rows.length;
  let ordered;

  if(cfg.rule==='division-first'){
    const locked = cfg.divisionSeeds ?? 2;
    const best=new Map();
    rows.forEach(r=>{
      const d=r.division ?? '_none';
      if(!best.has(d) || byRecord(r,best.get(d))<0) best.set(d,r);
    });
    const winners=[...best.values()].filter(r=>r.division).sort(byRecord).slice(0,locked);
    const w=new Set(winners);
    ordered=[...winners.map(r=>({r,why:'division winner'})),
             ...rows.filter(r=>!w.has(r)).sort(byRecord).map(r=>({r,why:'record'}))];
  } else if(cfg.rule==='points-wildcard'){
    const wc = cfg.wildcards ?? 1;
    const auto = rows.slice().sort(byRecord).slice(0, Math.max(0, n-wc));
    const a=new Set(auto);
    // The wildcard is decided on points alone, among everyone who missed.
    const wild = rows.filter(r=>!a.has(r))
      .sort((x,y)=> (y.pointsFor ?? y.wkPts ?? 0)-(x.pointsFor ?? x.wkPts ?? 0)).slice(0,wc);
    const wset=new Set(wild);
    ordered=[...auto.map(r=>({r,why:'record'})),
             ...wild.map(r=>({r,why:'points wildcard'})),
             ...rows.filter(r=>!a.has(r)&&!wset.has(r)).sort(byRecord).map(r=>({r,why:'missed'}))];
  } else {
    ordered=rows.slice().sort(byRecord).map(r=>({r,why:'record'}));
  }

  ordered.forEach(({r,why},i)=>{ r.seed=i+1; r.seedWhy=why; r.inPlayoffs = i<n; });
}

/* ---------- sortable tables ---------- */

const STAND_SORTS = {
  rank:   { label:'#',        of:(r)=> r.rank ?? 99, dir:1 },
  name:   { label:'Team',     of:(r)=> r.name.toLowerCase(), dir:1, text:1 },
  record: { label:'Record',   of:(r)=> (r.effWins - r.effLosses)*1000 + (r.pointsFor ?? 0), dir:-1 },
  gb:     { label:'GB',       of:(r)=> r.gb, dir:1 },
  pf:     { label:'PF',       of:(r)=> r.pointsFor ?? -1, dir:-1 },
  pa:     { label:'PA',       of:(r)=> r.pointsAgainst ?? Infinity, dir:1 },
  week:   { label:'Week',     of:(r)=> r.wkPts ?? -1, dir:-1 },
  odds:   { label:'Odds',     of:(r)=> r.oddsPct ?? -1, dir:-1 },
  div:    { label:'Division', of:(r)=> String(r.division||'~'), dir:1, text:1 },
  waiver: { label:'Waiver',   of:(r)=> r.waiverPosition ?? 99, dir:1 },
};

function sortRows(rows, key, flip){
  const s = STAND_SORTS[key] || STAND_SORTS.rank;
  const d = (s.dir || 1) * (flip ? -1 : 1);
  return rows.slice().sort((a,b)=>{
    const x=s.of(a), y=s.of(b);
    // Equal values fall back to the standard order rather than to whatever the
    // roster list happened to be in.
    if(x===y) return byStandard(a,b);
    if(s.text) return String(x).localeCompare(String(y))*d;
    return (x<y? -1 : 1)*d;
  });
}

/**
 * This week: what they have scored, over what they are on track to finish with.
 *
 * The projection is the point of the column during a live week — the score
 * alone says nothing about whether a team with four players left is ahead.
 * MyPlaybook's own figure is used, which already counts banked points plus the
 * remaining projections rather than re-projecting the whole roster.
 */
function weekCell(r){
  const td=el('td','r');
  if(!r.wkResult){ td.append(el('span','note','—')); return td; }
  const k=r.wkResult;
  const d=el('div','stack');
  const v=el('div','sv');
  v.textContent = k.pre && k.pts==null? '—' : pts2(k.pts);
  if(!k.bye && !k.pre){
    v.style.color = k.tie? 'var(--ink-2)' : (k.win? 'var(--good)' : 'var(--bad)');
    if(k.final) v.style.fontWeight='600';
  }
  d.append(v);
  const proj = k.proj==null? null : pts2(k.proj);
  const sub = k.bye ? (k.final? 'bye' : 'bye · proj '+(proj||'—'))
    : k.pre ? 'proj '+(proj||'—')
    : k.final ? (k.tie? 'tied' : (k.win? 'W ' : 'L ')+pts2(Math.abs(k.gap)))
    : 'proj '+(proj||'—')+' · '+(k.tie?'tied':(k.win?'up ':'down ')+pts2(Math.abs(k.gap)));
  d.append(Object.assign(el('div','ss'),{textContent:sub}));
  td.append(d);
  if(!k.bye){
    td.title='vs '+k.opp+' '+pts2(k.oppPts)+(k.oppProj!=null? ' (proj '+pts2(k.oppProj)+')':'')
      +' · '+(k.final?'final':(k.pre?'not started':(k.m.minutesLeft??'?')+'m of game time left'));
  }
  return td;
}

function pageStandings(){
  const l=L(), out=[];
  const h=el('div','head'); h.append(el('h1',null,'Standings'));
  out.push(h);

  const sb=standingsBoard(l);
  const rows=standingsRows(l, sb);
  if(sb && !sb.live){
    out.push(Object.assign(el('p','note'),{textContent:
      'This week has no live board yet — these numbers are the last stored week with scores (week '+sb.week+'; '+sb.rows.length+' matchups), as captured. Run `matchups:sync` once games kick off for the live table.'}));
  }
  const divisions=[...new Set(rows.map(r=>r.division).filter(Boolean))].sort();
  const anyPf=rows.some(r=>r.pointsFor!=null);
  const anyOdds=rows.some(r=>r.oddsPct!=null);
  const anyWaiver=rows.some(r=>r.waiverPosition!=null || r.waiverBudgetUsed!=null);
  const anyWeek=rows.some(r=>r.wkResult);
  const anySeed=rows.some(r=>r.seed!=null);
  const anyHost=rows.some(r=>r.recordSource==='host');
  // The live-result counter only runs for hosts without official records, so a
  // toggle that re-counts unplayed games is only offered where it does anything.
  const anyLive=rows.some(r=>r.recordLive && r.wkResult && !r.wkResult.final);

  const bar=el('div','toggles');
  if(divisions.length>1){
    bar.append(segmented([{label:'Whole league',value:'all'},{label:'By division',value:'division'}], standView,
      v=>{ standView=v; store.set('gd.standView',v); writeHash(); render(); }));
  }
  if(anyLive){
    // The record does not move while a game is being played. This is the opt-in
    // to the other reading — "if everyone ahead right now holds on".
    bar.append(segmented([{label:'Completed games',value:'done'},{label:'If leaders hold',value:'proj'}], standMode,
      v=>{ standMode=v; store.set('gd.standMode',v); writeHash(); render(); }));
  }
  if(bar.childNodes.length) out.push(bar);

  const budget = l.faabBudget ?? (l.detail&&l.detail.supported? l.detail.settings.waiverBudget : null);
  const maxGames = rows.reduce((a,r)=>Math.max(a, r.games||0), 0);

  // Every column carries a width, including the name. Under fixed layout the
  // leftover is then shared out proportionally; leaving the name column
  // unsized handed it every spare pixel and crushed the numbers against the
  // right edge.
  const cols=[
    {key:'rank',   label:'#',       r:1, w:46, title:'Record, then points for'},
    {key:'name',   label:'Team',    w:250},
    {key:'record', label:'Record',  r:1, w:72, title: anyHost
        ? 'Official '+l.host+' record for the season to date'
        : (standMode==='proj'
          ? 'Official record plus every game this week, counted to whoever is ahead'
          : 'Official record plus this week’s finished games only')},
  ];
  if(anyPf) cols.push(
    {key:'pf', label:'PF', r:1, w:72, title: anyHost? 'Points for — '+l.host+'\u2019s official season total' : 'Points for, over '+maxGames+' finished game(s)'},
    {key:'pa', label:'PA', r:1, w:72, title: anyHost? 'Points against — same official total' : 'Points against, over the same games'});
  if(divisions.length && standView!=='division') cols.push({key:'div', label:'Division', w:104});
  cols.push({key:'gb', label:'GB', r:1, w:46, title:'Games back of the leader'});
  if(anyOdds) cols.push({key:'odds', label:'Playoff %', r:1, w:78, title:'MyPlaybook projected playoff odds'});
  if(anyWeek) cols.push({key:'week', label:(sb&&!sb.live)? 'Week '+sb.week+' · stored' : 'Week '+DATA.week, r:1, w:88, title:(sb&&!sb.live)?
    'Scores from the last stored board (week '+sb.week+'), as captured at sync time' : 'Scored so far, over the projected final'});
  if(anyWaiver) cols.push({key:'waiver', label:'Waiver', r:1, w:76, title:budget? 'Claim order, and FAAB remaining' : 'Claim order'});

  const onSort=(k)=>{
    if(standSort===k) standFlip=!standFlip; else { standSort=k; standFlip=false; }
    store.set('gd.standSort',standSort); store.set('gd.standFlip',standFlip?'1':'');
    writeHash(); render();
  };

  // One cell renderer per column key; the columns above say which appear.
  const CELLS={
    rank:r=>{
      const rk=el('td','r');
      const badge=el('span','seedno'+(r.inPlayoffs?' in':''), String(r.rank));
      badge.title=[
        'Standing #'+r.rank+' by record, then points for',
        r.seed!=null? 'Playoff seed '+r.seed+' — '+r.seedWhy : null,
        r.hostRank!=null && r.hostRank!==r.rank? l.host+' has them #'+r.hostRank : null,
      ].filter(Boolean).join('\n');
      rk.append(badge);
      // The seed only earns its own mark when it disagrees with the standing.
      if(r.seed!=null && r.seed!==r.rank) rk.append(el('span','seedalt','#'+r.seed));
      return rk;
    },
    name:r=> teamCell(r),
    record:r=>{
      const rec=cell('num', null, {stack:true, text:r.effWins+'-'+r.effLosses+(r.effTies?'-'+r.effTies:''), sub:r.counted? r.wins+'-'+r.losses+' official' : ''});
      if(r.provisional) rec.querySelector('.sv').classList.add('prov');
      if(r.counted) rec.title=(r.provisional? 'Counts a game still in progress. ':'')+'Official record is '+r.wins+'-'+r.losses+'.';
      return rec;
    },
    pf:r=> ptsCell(r.pointsFor, r.games),
    pa:r=> ptsCell(r.pointsAgainst, r.games),
    div:r=> r.division? cell('chip', null, {cls:'pill gh', text:r.division}) : cell('chip', null, {cls:'note', text:FX_BLANK}),
    gb:r=> cell('num', null, {text: r.gb===0? FX_BLANK : (Number.isInteger(r.gb)? String(r.gb) : r.gb.toFixed(1))}),
    odds:r=>{
      const od=el('td','r');
      if(r.oddsPct==null) od.append(el('span','note',FX_BLANK));
      else{
        const sp=el('span','num odds', fxPct(r.oddsPct));
        sp.style.color = r.oddsPct>=70? 'var(--good)' : (r.oddsPct>=35? 'var(--market)' : 'var(--bad)');
        od.append(sp);
      }
      if(r.projRecord) od.title='Projected finish '+r.projRecord[0]+'-'+r.projRecord[1]+' (#'+(r.rankProj??'—')+')';
      return od;
    },
    week:r=> weekCell(r),
    waiver:r=> cell('num', null, {stack:true, text:r.waiverPosition==null? FX_BLANK : '#'+r.waiverPosition,
      sub: r.waiverBudgetUsed!=null && budget? '$'+(budget-r.waiverBudgetUsed) : (r.totalMoves!=null? r.totalMoves+' mv' : '')}),
  };
  // A blank here means no matchup for this team has ever been captured as
  // finished, not that it scored zero — a week synced only while games were
  // still live never counts toward this.
  function ptsCell(v, g){
    const td=cell('num', null, {stack:true, text:v==null? FX_BLANK : pts2(v), sub: v!=null && g!=null && g<maxGames? g+' gm' : ''});
    td.title = v!=null && g? pts2(v)+' over '+g+' finished game'+(g>1?'s':'')
      : 'No finished games stored for this team yet — a week has to be synced after its games end to count here.';
    return td;
  }
  cols.forEach(c=>{ c.cell=CELLS[c.key]; });
  // In vs out is a fill, not just a line: sorting by points-for or by
  // division breaks rank order, and a divider drawn at a fixed row index
  // would then sit in the wrong place while still looking authoritative.
  const rowClass=r=> [r.mine? 'mine' : '', r.inPlayoffs===true? 'inplay' : (r.inPlayoffs===false? 'outplay' : '')].filter(Boolean).join(' ') || null;
  const standTable=(list, divider)=> smallTable({id:'standings', cols, rows:list, rowClass, divider,
    sort:{key:standSort, flip:standFlip}, onSort});

  const cutIndex = rows.filter(r=>r.inPlayoffs).length || null;

  if(standView==='division' && divisions.length>1){
    divisions.forEach(dv=>{
      const sub=sortRows(rows.filter(r=>r.division===dv), standSort, standFlip);
      out.push(panel(dv, sub.length+' teams', standTable(sub)));
    });
    const none=rows.filter(r=>!r.division);
    if(none.length){
      const sub=sortRows(none, standSort, standFlip);
      out.push(panel('No division', none.length+' teams · assign them in League Setup', standTable(sub)));
    }
  } else {
    const sorted=sortRows(rows, standSort, standFlip);
    // The cut line is only drawn when the current sort actually puts the
    // qualifying teams on top; otherwise the fill carries it alone.
    const clean = cutIndex!=null && sorted.every((r,i)=> (i<cutIndex) === (r.inPlayoffs===true));
    const divider=(r,i)=>{
      if(!(clean && i===cutIndex)) return null;
      const cut=el('tr','cutrow'), td=el('td');
      td.append(el('span',null,'playoff cut · top '+cutIndex+(anySeed?' by this league’s rule':'')));
      cut.append(td);
      return cut;
    };
    out.push(panel('Standings', standingsSource(l, rows, maxGames, sb), standTable(sorted, divider)));
  }

  const notes=[];
  notes.push('Ranked on record, then points for. '+(anySeed
    ? 'Shaded rows are in under this league’s own rule — '+(l.seedRule.describe||'')+' A seed that differs from the standing is marked beside the number.'
    : (cutIndex? 'Shaded rows are the top '+cutIndex+'. Set a seeding rule in League Setup to mark them under your league’s actual rule.' : '')));
  if(anyLive){
    notes.push(standMode==='proj'
      ? 'Records count every game this week to whoever is currently ahead, or projected higher before kickoff.'
      : 'Records change only when a game finishes — a matchup in progress does not move the table.');
  } else if(anyHost){
    notes.push('Records and points are '+l.host+'\u2019s official season-to-date totals; this week joins them once the host finalizes it.');
  }
  if(!anyPf) notes.push('Points for and against appear as soon as a matchup finishes; none has yet this week.');
  else if(anyHost) notes.push('Points for and against are '+l.host+'\u2019s official season totals — the one host that publishes them, and the only complete number there is.');
  else if(rows.some(r=>r.pfSource==='ledger')) notes.push('Points are summed over every finished matchup this app has stored'
    +(standMode==='proj'? ', plus this week as it currently stands' : '')
    +' ('+maxGames+' game(s)) — neither ESPN nor Yahoo publishes a season total anywhere reachable, so weekly syncs are what build it.');
  notes.filter(Boolean).forEach(n=> out.push(Object.assign(el('p','note'),{textContent:n})));

  const P=l.adv&&l.adv.standings;
  if(P && !P.ok && P.inactive) out.push(inactiveNote(l,'Projected standings'));
  return out;
}

function standingsSource(l, rows, maxGames, sb){
  const bits=[];
  if(rows.some(r=>r.recordSource==='host')) bits.push('records + standings from '+l.host);
  else if(rows.some(r=>r.recordSource==='ledger')) bits.push('records from stored matchups');
  else if(rows.some(r=>r.recordSource==='mpb')) bits.push('records from MyPlaybook');
  if(rows.some(r=>r.wkResult)) bits.push((sb&&!sb.live)? 'scores from the stored week '+sb.week : 'live scores from all '+l.teams.length+' teams');
  if(rows.some(r=>r.pointsFor!=null)) bits.push('points over '+maxGames+' finished game'+(maxGames===1?'':'s'));
  if(rows.some(r=>r.waiverPosition!=null)) bits.push('waivers from '+l.host);
  return bits.join(' · ') || l.host;
}

/* ---------- waiver clock ----------
 *
 * "Is he a free agent or a waiver claim?" is a different question from "is he
 * unrostered", and it changes what you do: a free agent is first-come, a
 * waiver player costs a claim and processes on a schedule.
 *
 * No host exposes a per-player waiver state through anything reachable here.
 * It is derivable, though, from two things we do have: the drop that put him
 * there (transactions carry the date, and `viaWaivers` on the URL), and the
 * league's own claim period and process day, which you set in League Setup.
 *
 * When the period is not configured this returns null rather than guessing —
 * an invented clear time would be read as fact.
 */
const DAY_MS = 86400000;

function waiverClock(l){
  const o = ovFor(l);
  const w = o.waivers || {};
  const days = w.claimDays;
  const type = (w.type || l.waiverType || '').toLowerCase();
  if (type === 'none') return { configured:true, none:true, byPlayer:new Map() };
  if (days == null && w.processDay == null) return { configured:false, byPlayer:new Map() };

  // Most recent drop per player, across the whole league.
  const dropped = new Map();
  for (const t of l.transactions || []) {
    for (const d of t.drops || []) {
      const at = t.time ? new Date(t.time) : (t.date ? new Date(t.date) : null);
      if (!at || Number.isNaN(at.getTime())) continue;
      const prev = dropped.get(d.fpId);
      if (!prev || at > prev.at) dropped.set(d.fpId, { at, teamName: t.teamName });
    }
  }

  const now = new Date();
  const byPlayer = new Map();
  for (const [fpId, rec] of dropped) {
    let clearsAt = null;
    if (days != null) clearsAt = new Date(rec.at.getTime() + days * DAY_MS);
    if (w.processDay != null) {
      // Claims process on a fixed weekday; a player sits until the first
      // processing run at or after his claim period ends.
      const from = clearsAt || rec.at;
      const c = new Date(from);
      c.setHours(w.processHour ?? 3, 0, 0, 0);
      while (c.getDay() !== w.processDay || c < from) c.setDate(c.getDate() + 1);
      clearsAt = c;
    }
    if (!clearsAt) continue;
    byPlayer.set(fpId, {
      droppedAt: rec.at, droppedBy: rec.teamName, clearsAt,
      onWaivers: now < clearsAt,
      hoursLeft: Math.max(0, (clearsAt - now) / 3600000),
    });
  }
  return { configured:true, none:false, type, byPlayer };
}

/* ---------- demand signal ----------
   Everything else in this dashboard answers "how many points". This answers
   "how long is the window open", which is the question a waiver claim actually
   turns on — and it is the only data here that moves by the hour. */

/** Adds per hour, abbreviated: 16428 -> 16.4k/h. */
function rate(v){ return fxCount(v); }

/**
 * The acceleration cell, which is the one number on this page worth acting on.
 *
 * Volume tells you a player has already been claimed; acceleration tells you he
 * is being claimed NOW. Michael Mayer at 380k adds and 0.33x is a wave that
 * broke hours ago and a claim you are late to; Devin Singletary at 100k and
 * 200x is the wave itself.
 */
function surgeCell(sig){
  const td=el('td','r');
  if(!sig){ td.append(el('span','delta flat','—')); return td; }
  if(sig.v==null){
    // No rate at all is a blank like any other, not an empty pill that reads as a radio button.
    if(sig.r==null && !sig.fresh){ td.append(el('span','delta flat','—')); td.title='Not enough history to measure a rate.'; return td; }
    const sp=el('span','pill '+(sig.fresh?'ok':'gh'), sig.r!=null?'new':'—');
    sp.title = sig.fresh? 'No measurable activity before the last few hours — this is the start of the wave.' : 'Not enough history to measure a rate.';
    td.append(sp); return td;
  }
  const cls = sig.v>=2 ? 'up' : (sig.v<0.7 ? 'dn' : 'flat');
  const sp=el('span','delta '+cls, sig.v>=10? Math.round(sig.v)+'x' : sig.v.toFixed(1)+'x');
  sp.title = 'Adds per hour over the last '+(DATA.signals.windows?DATA.signals.windows[0]:6)+'h against the rate before it. '+
    (sig.v>=2? 'Accelerating — claim now.' : (sig.v<0.7? 'Decelerating — the wave has passed.' : 'Steady.'));
  td.append(sp); return td;
}

/** How much of the market already has him — the size of the window remaining. */
function rosteredCell(sig){
  const td=el('td','r');
  if(!sig || sig.yr==null){ td.append(el('span','delta flat','—')); return td; }
  const box=el('div'); box.style.display='flex'; box.style.alignItems='center'; box.style.gap='7px'; box.style.justifyContent='flex-end';
  box.append(Object.assign(el('span','num'),{textContent:sig.yr+'%'}));
  const bar=el('div','bar'); const i=el('i');
  i.style.width=Math.max(0,Math.min(100,sig.yr))+'%';
  if(sig.yrc!=null && sig.yrc>0) i.className='mk';
  bar.append(i); box.append(bar);
  td.append(box);
  td.title=sig.yr+'% of Yahoo leagues roster him'+(sig.yrc!=null?' ('+(sig.yrc>0?'+':'')+sig.yrc+' pts since the previous day)':'')+
    (sig.ys!=null?'; started in '+sig.ys+'%':'');
  return td;
}

/* ---------- players page ----------
   The full pool, browsed the way Sleeper's Players tab reads: every player
   FantasyPros ranks, or just the ones nobody in this league owns, with a
   projection column that switches between this week and rest of season.
   Filters compose — position, NFL team, league roster and the watch list all
   AND together, and the demand tile is back to being a per-row column rather
   than the whole page. */

/** The watch list: plain player ids in localStorage, toggled by the star. */
const watch = (()=>{
  const KEY='gd.watchlist';
  let set=new Set();
  try{ const v=localStorage.getItem(KEY); if(v) set=new Set(String(v).split(',').filter(Boolean)); }catch{}
  const persist=()=>{ try{ localStorage.setItem(KEY,[...set].join(',')); }catch{} };
  return {
    has: id => set.has(String(id)),
    toggle(id){ const s=String(id); if(set.has(s)) set.delete(s); else set.add(s); persist(); },
    all: ()=>[...set],
    count: ()=>set.size,
  };
})();

const GRADE_ORDER=['F','D-','D','D+','C-','C','C+','B-','B','B+','A-','A','A+'];

/**
 * The players table's sort table.
 *
 * Keys are the same names the column headers use, so clicking a header shows
 * the sort that made the row order. Projection sorts read the selected
 * look-ahead window rather than freezing week-1 or rest-of-season.
 */
const PLAYER_SORTS = {
  name:    {label:'Name', of:p=>String(p.n||'').toLowerCase(), text:true},
  cons:    {label:'Consensus', of:p=> consOrder(p,hz()), dir:-1},
  conspos: {label:'Consensus pos rank', of:p=>{ const c=metric(p,'agreed'); return c&&c.a? c.a.posRank : 9999; }, dir:1},
  fp:      {label:'FantasyPros', of:p=> (metric(p,'fp')||{}).v??-1, dir:-1},
  opp:     {label:'Opponent', of:p=>String(oppLabel(p,DATA.week)||'~').replace('@',''), text:true},
  trend:   {label:'Trend', of:p=> p.tr ?? 9999, dir:1},
  grade:   {label:'Grade', of:p=> GRADE_ORDER.indexOf(String(p.g||'')), dir:-1},
  own:     {label:'Rostered %', of:p=> p.own ?? -1, dir:-1},
  surge:   {label:'Surge', of:p=> p.sig?.v??(p.sig?.r!=null?0:-1), dir:-1},
  adds:    {label:'Adds/h', of:p=> p.sig?.r??-1, dir:-1},
  rostered:{label:'Rostered', of:p=> p.sig?.yr??-1, dir:-1},
  slAdds:  {label:'Sleeper adds', of:p=> p.sig?.a??-1, dir:-1},
  slDrops: {label:'Sleeper drops', of:p=> p.sig?.d??-1, dir:-1},
  yAdds:   {label:'Yahoo adds', of:p=> p.sig?.ya??-1, dir:-1},
  yDrops:  {label:'Yahoo drops', of:p=> p.sig?.yd??-1, dir:-1},
  yNet:    {label:'Yahoo net', of:p=> p.sig?.yn??-Infinity, dir:-1},
  yStart:  {label:'Yahoo started', of:p=> p.sig?.ys??-1, dir:-1},
};
PLAYER_SORTS.ovr   = {label:'Overall rank', of:p=> overallRank(p)??1e9, dir:1};

PLAYER_SORTS.vgpts = {label:'VegasEdge points', of:p=> p.vg&&p.vg.wk!=null? p.vg.wk : -1, dir:-1};
PLAYER_SORTS.vgrk  = {label:'VegasEdge rank', of:p=> p.vg&&p.vg.prk? p.vg.prk : 9999, dir:1};

PLAYER_SORTS.vgbb  = {label:'VegasEdge boom', of:p=> p.vg&&p.vg.boom!=null? p.vg.boom : -1, dir:-1};
PLAYER_SORTS.vgtag = {label:'VegasEdge tag', of:p=> ({'High Floor':'0','Balanced':'1','Volatile':'2'})[p.vg&&p.vg.vol]||'9', text:true};
PLAYER_SORTS.vgsk  = {label:'VegasEdge skew', of:p=> p.vg&&p.vg.sk!=null? p.vg.sk : -9, dir:-1};
PLAYER_SORTS.pts   = {label:'Score', of:p=> shownPoints(p, hz().kind==='week'? hz().from : DATA.week).v??-1, dir:-1};
PLAYER_SORTS.wkpts = {label:'This week\u2019s score', of:p=> shownPoints(p, DATA.week).v??-1, dir:-1};
PLAYER_SORTS.wkproj= {label:'This week', of:p=>{ const m=metric(p,'agreed',parseHz('w-'+DATA.week)); return m? m.v : -1; }, dir:-1};
PLAYER_SORTS.rosrk = {label:'ROS rank', of:p=>{ const m=metric(p,'agreed',parseHz('ros')); return m&&m.a? m.a.posRank : 9999; }, dir:1};
PLAYER_SORTS.logtot= {label:'Total', of:p=>{ const h=hz(), x=h.kind==='log'? logOf(p,h) : null; return x&&x.total!=null? x.total : -1; }, dir:-1};
PLAYER_SORTS.logg  = {label:'Games', of:p=>{ const h=hz(), x=h.kind==='log'? logOf(p,h) : null; return x? x.g : -1; }, dir:-1};

function byPlayers(a,b){
  const s=PLAYER_SORTS[playerSort]||PLAYER_SORTS.cons;
  const d=(s.dir||1)*(playerFlip?-1:1);
  const x=s.of(a), y=s.of(b);
  if(x===y) return byPlayerFallback(a,b);
  if(s.text) return String(x).localeCompare(String(y))*d;
  return (x<y?-1:1)*d;
}
function byPlayerFallback(a,b){
  return (POS_ORDER[a.p]||9)-(POS_ORDER[b.p]||9)
    || String(a.n||'').localeCompare(String(b.n||''))
    || (((metric(b,'agreed')||{}).v??-1)-((metric(a,'agreed')||{}).v??-1));
}

/** The star that keeps a player on the watch list. */
function starBtn(p){

}

/** Generic filter chip; click toggles it in/out of the set.
    `fullRender` chips (roster, free-agent) switch scope to All first, so a
    team chip can never be silently ignored by the scope toggle. `cls` picks
    the visual: a pill chip, a checkbox row (Roster popover), or a logo tile
    (Team popover). */
function filterChip(label, active, onClick, decorate, fullRender, cls){
  const b=el('button',(cls||'fchip')+(active?' on':''), label);
  b.type='button'; b.setAttribute('aria-pressed',String(active));
  if(decorate) decorate(b);
  b.onclick=()=>{
    const next=onClick();
    b.classList.toggle('on',next); b.setAttribute('aria-pressed',String(next));
    // `fullRender` may also be the specific refresh to run (the Sources page
    // rebuilds its own list, not the Players one).
    if(typeof fullRender==='function') fullRender(); else if(fullRender) render(); else buildList();
  };
  return b;
}
function chipGroup(title, chips){
  const g=el('div','fgroup');
  g.append(el('span','ftitle',title));
  chips.forEach(c=>g.append(c));
  return g;
}

/**
 * Injury, as a filter reads it: the game-day designation Sleeper carries
 * (Dynasty Daddy's row), not FantasyPros' practice report — LIMITED in
 * practice is not a status. Only a FantasyPros OUT counts when Sleeper is silent.
 */
const INJ_KINDS=[['H','Healthy'],['Q','Questionable'],['D','Doubtful'],['O','Out'],['IR','IR / PUP']];
function injClass(p){
  const s=String((p.dd && p.dd.inj) || '').toUpperCase();
  if(!s) return String(p.inj||'').toUpperCase()==='OUT'? 'O' : 'H';
  if(s.startsWith('Q')) return 'Q';
  if(s.startsWith('D') && s!=='DNR') return 'D';
  if(s==='O' || s==='OUT') return 'O';
  return 'IR';
}

/**
 * One player table's filters beyond position: who owns him in the league you
 * have open, his NFL team, and his injury status. Kept per table under its own
 * storage prefix, so Players and League Players each remember their own.
 */
function filterState(prefix){
  const own=store.get(prefix+'.own','all');
  const f={
    own: ['all','fa','roster','mine'].includes(own)? own : 'all',
    team: store.get(prefix+'.team',''),
    inj: String(store.get(prefix+'.inj','')).split(',')[0],
    save(){ store.set(prefix+'.own',f.own); store.set(prefix+'.team',f.team); store.set(prefix+'.inj',f.inj); },
    clear(){ f.own='all'; f.team=''; f.inj=''; f.save(); },
  };
  return f;
}
function applyFilters(list, f){
  if(f.team) list=list.filter(p=> teamAbbr(p.t)===f.team);
  if(f.inj==='ANY') list=list.filter(p=> injClass(p)!=='H');
  else if(f.inj) list=list.filter(p=> injClass(p)===f.inj);
  if(f.own==='fa') list=list.filter(p=> !ROSTER.has(p.i));
  else if(f.own==='roster') list=list.filter(p=> ROSTER.has(p.i));
  else if(f.own==='mine') list=list.filter(p=>{ const r=ROSTER.get(p.i); return r && r.mine; });
  return list;
}
/** The owner segment, the NFL team picker and the injury chips, as filter rows. `refresh` redraws after a change. */
/** A labelled single-choice dropdown: one row of these replaces a row of chips per filter. */
function filterSelect(label, options, value, onPick){
  const w=el('label','fsel');
  w.append(el('span','ftitle',label));
  const sel=el('select','hz');
  options.forEach(([v,t])=> sel.append(Object.assign(document.createElement('option'),{value:v, textContent:t})));
  sel.value=value;
  sel.onchange=()=> onPick(sel.value);
  w.append(sel);
  return w;
}
/**
 * The filter row: position, owner, NFL team and injury, one choice each.
 * `pos` is the page's position set (kept as a set of at most one, so the
 * stored value from the old chips still reads); `refresh` redraws the list.
 */
function filterControls(f, pool, pos, posKey, refresh){
  const row=el('div','prowbar');
  // The old chips allowed several positions; one choice now.
  if(pos.size>1){ pos.clear(); store.set(posKey,''); }
  const positions=['QB','RB','WR','TE','K','DST'].filter(x=> pool.some(p=>p.p===x));
  row.append(filterSelect('Position', [['','All'], ...positions.map(x=>[x,x])], pos.size===1? [...pos][0] : '', v=>{
    pos.clear(); if(v) pos.add(v); store.set(posKey,[...pos].join(',')); refresh();
  }));
  row.append(filterSelect('Owner', [['all','Everyone'],['fa','Available'],['roster','Rostered'],['mine','Mine']], f.own, v=>{ f.own=v; f.save(); refresh(); }));
  const teams=[...new Set(pool.map(p=> teamAbbr(p.t)).filter(t=> t && t!=='FA'))].sort();
  row.append(filterSelect('NFL team', [['','All'], ...teams.map(t=>[t,t])], f.team, v=>{ f.team=v; f.save(); refresh(); }));
  row.append(filterSelect('Injury', [['','All'], ['ANY','Any injury'], ...INJ_KINDS], f.inj, v=>{ f.inj=v; f.save(); refresh(); }));
  return row;
}

/**
 * fpId -> the league team that rosters him, computed once per render so the
 * Waiver Wire and the player detail modal only do lookups. "Mine" follows the teams you
 * claimed in League Setup, not just the one team the host reports.
 */
function rosterIndex(l){
  const mine=new Set(myTeams(l).map(t=>String(t.id)));
  const idx=new Map();
  l.teams.forEach(t=>{
    const info={id:String(t.id), name:teamLabel(l,t), abbr:teamAbbrev(l,t), logo:t.logo, mine:mine.has(String(t.id))};
    t.players.forEach(p=> idx.set(p.i, info));
  });
  return idx;
}

/**
 * Who has him, for every league in one cell: the owner badge
 * (docs/components.md §3.9) — the rostering team's abbreviation (YOU on
 * yours), FA, or W with the day he clears waivers — full name on hover. The
 * row itself is tinted by the same answer (`ownerRowClass`).
 */
function waiverClaim(p){
  const c=CLOCK && CLOCK.configured && !CLOCK.none? CLOCK.byPlayer.get(p.i) : null;
  return c && c.onWaivers? c : null;
}
function ownerOf(p){
  const claim=waiverClaim(p);
  return fxOwner(ROSTER.get(p.i)||null, claim? {clearsDay: claim.clearsAt.toLocaleDateString([], {weekday:'short'})} : null);
}
const ownerRowClass = p=> ownerOf(p).row || null;
/** The Owner column's tag: the team's abbreviation as small text; YOU, FA and W filled. */
function ownerTag(o){
  const w=el('span','own '+o.cls); w.title=o.title;
  w.append(el('span',null,o.text));
  if(o.day) w.append(el('small',null,o.day));
  return w;
}
function rosterBadgeCell(p){
  const td=el('td','ctr');
  const o=ownerOf(p), r=ROSTER.get(p.i), claim=!r && waiverClaim(p);
  const b=ownerTag(o);
  if(claim) b.title='On waivers \u2014 dropped '+claim.droppedAt.toLocaleString()+(claim.droppedBy? ' by '+claim.droppedBy : '')+'; clears '+claim.clearsAt.toLocaleString([], {weekday:'short', hour:'numeric'});
  else if(o.cls==='fa' && !(CLOCK && CLOCK.configured)) b.title='Free agent \u2014 set a claim period in League Setup to see waiver status';
  td.append(b);
  td.dataset.v=o.cls==='you'? '0' : (o.cls==='team'? '1'+o.text : (o.cls==='wv'? '2' : '3'));
  return td;
}

/** Week-over-week move in the expert consensus rank; negative is an improved rank, so that direction is the good arrow. */
function trendCell(p){
  const td=el('td','r');
  const v=p.tr;
  if(v!=null) td.dataset.v=String(-v);
  if(v==null || v===0){ td.append(el('span','delta flat','\u2014')); return td; }
  const up=v<0;
  const sp=el('span','delta '+(up?'up':'dn'), (up?'\u25B2':'\u25BC')+Math.abs(v));
  sp.title='Consensus rank '+(up?'improved':'slipped')+' by '+Math.abs(v)+' since the last update';
  td.append(sp); return td;
}
/** The start/sit grade as a filled chip — the one column that is a verdict, not a number. */
function gradeBadgeCell(p){
  const td=el('td','r');
  if(!p.g){ td.append(el('span','gradebadge muted','\u2014')); return td; }
  const f=p.g[0];
  td.append(el('span','gradebadge '+(f==='A'?'good':f==='B'?'info':f==='C'?'mid':'bad'), p.g));
  return td;
}
function addsCell(p){
  const td=el('td','r num');
  td.textContent = p.sig?.r!=null? rate(p.sig.r) : '—';
  if(p.sig?.r!=null) td.title=Math.round(p.sig.r)+' adds per hour across Sleeper';
  return td;
}

/** The filtered pool, every rule ANDed. */
function playList(){
  let list=applyFilters([...PLAYER_POOL], playerF());
  if(playerPos.size)   list=list.filter(p=> playerPos.has(p.p));
  if(playerWatchOnly)  list=list.filter(p=> watch.has(String(p.i)));
  if(playerQuery)      list=list.filter(p=> (p.n||'').toLowerCase().includes(playerQuery));
  list.sort(byPlayers);
  return list;
}

function onPlayerSort(key){
  if(playerSort===key) playerFlip=!playerFlip;
  else { playerSort=key; playerFlip=false; }
  store.set('gd.playerSort',playerSort); store.set('gd.playerFlip',playerFlip?'1':'');
  buildList();
}

/**
 * The Players table's columns. The consensus, source and info groups come from
 * `columnsFor` - the same list My Team and All Rosters draw from - so the two
 * cannot drift; only what belongs to the pool alone (the waiver-market signal)
 * is added here. Owner is the league you have open (the Owner filter reads it too).
 */
/**
 * Each player's overall rank in the pool by the agreed number — his own,
 * so it stays put whatever the table is filtered or sorted by, and the "#"
 * column sorts by it. Blank for a player the sources do not rank.
 */
let OVR=null;
function overallRank(p){
  if(!OVR || OVR.pool!==PLAYER_POOL || OVR.hz!==horizonKey){
    const h=hz(), v=new Map(PLAYER_POOL.map(x=>[x, consOrder(x,h)]));
    const ranked=PLAYER_POOL.filter(x=> metric(x,'agreed',h)).sort((a,b)=> v.get(b)-v.get(a) || byPlayerFallback(a,b));
    OVR={pool:PLAYER_POOL, hz:horizonKey, rank:new Map(ranked.map((x,i)=>[x.i,i+1]))};
  }
  return OVR.rank.get(p.i) ?? null;
}
const OVR_COL={w:44, band:'', key:'ovr', label:'#', ctr:1, title:'Overall rank by the agreed number',
  cell:p=>{ const td=el('td','ctr'); const n=overallRank(p); td.append(el('span','ork', n==null? '\u2014' : String(n))); return td; }};
function playerColumns(){
  return [
    OVR_COL,
    {w:330, band:'', key:'name',   label:'Player', cell:p=> cell('player', p)},
    {w:56, band:'', label:'Owner', ctr:1, cell:p=> rosterBadgeCell(p)},
    ...columnsFor(hz(), {players:true}),
    {w:34,  band:'', cell:p=>{ const td=el('td','watch'); td.append(starBtn(p)); return td; }},
  ];
}

function playersTable(list){
  return grid({id:'players', cols:playerColumns(), rows:list, noun:'players', stick:2, lean:true, rowClass:ownerRowClass,
    sort:{key:playerSort, flip:playerFlip}, onSort:onPlayerSort,

/** Rebuild only the list panel, so a search keeps its focus while typing. */
function buildList(){
